name: Migrations

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "migrations/**"
      - "atlas.hcl"
      - ".github/workflows/migrations.yml"

permissions:
  contents: read

jobs:
  integrity-and-lint:
    name: atlas integrity + destructive-change gate
    runs-on: ubuntu-latest
    env:
      # validate/lint analyse migrations on an ephemeral dev DB (Docker on the runner). apply targets
      # this if ever needed; the dev block in atlas.hcl is docker://postgres/16/dev.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
      - name: Hash integrity (atlas.sum matches migrations/)
        run: |
          atlas migrate hash --env local
          git diff --exit-code migrations/atlas.sum \
            || { echo "::error::migrations/atlas.sum is stale — run 'atlas migrate hash --env local'"; exit 1; }
      - name: Validate (replayable on a clean dev DB)
        run: atlas migrate validate --env local
      - name: Destructive-change lint (gate)
        # `atlas migrate lint` is Atlas-Pro-gated since v0.38; without `atlas login` it cannot run the
        # destructive-change analyzers. The gate is wired here and runs when a token is present; until
        # then it is non-blocking and the expand-only invariant is enforced by review + UPGRADING.md.
        continue-on-error: true
        run: atlas migrate lint --env local --latest 1

  upgrade-test:
    name: data-safe upgrade (prior revision -> HEAD)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis/postgis, NOT postgres: migration 0001 does `CREATE EXTENSION postgis` (M19 brought
        # PostGIS in for location), and a plain postgres image does not carry it — the job died at the
        # first migration with `extension "postgis" is not available`, before a single test ran. Every
        # other environment already uses this image: docker-compose.yml, docker-compose.dev.yml, and
        # atlas.hcl's own dev URL (docker://postgis/postgis/16-3.4/dev), which is why the lint gate
        # stayed green while the apply failed.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A database created from template1, not the postgis image's default one — that comes with
      # postgis/topology/tiger already installed, and upgrade-test.sh requires an EMPTY operator DB
      # (Atlas refuses a target it did not start clean).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oikumenea_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
      - name: Create a clean target database
        run: psql "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 -c "CREATE DATABASE oikumenea_ci"
      - name: Upgrade test (seed at prior revision, migrate to HEAD, assert preserved)
        run: ./scripts/upgrade-test.sh
