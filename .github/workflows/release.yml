name: Release

# Each artifact carries its OWN version and moves on its OWN tag, so one push releases one thing:
#
#   v1.2.3             -> the three container images (GHCR + Docker Hub, amd64 + arm64)
#   clients/go/v1.2.3  -> the nested Go SDK module   (tag only; the module proxy serves it)
#   ts/v1.2.3          -> oikumenea-client on npm
#
# Every job delegates to scripts/release.sh — the same command you can run locally with --dry-run.
# Nothing is published by logic that exists only in this file, so a release that misbehaves here can
# be reproduced on a laptop.
#
# The `clients/go/v*` pattern needs no special handling: the Go SDK tag is created by hand (or by
# `release.sh go-sdk --push`), and this workflow only VERIFIES it, because a Go module release IS the
# tag — there is nothing to upload.

on:
  push:
    tags:
      - "v*.*.*"
      - "clients/go/v*.*.*"
      - "ts/v*.*.*"
  workflow_dispatch:
    inputs:
      artifact:
        description: "What to release"
        required: true
        type: choice
        options: [images, go-sdk, ts-sdk]
      version:
        description: "Semver, without the leading v (e.g. 1.2.3)"
        required: true
        type: string
      dry_run:
        description: "Build and verify, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ── images ────────────────────────────────────────────────────────────────────────────────────
  images:
    name: container images (GHCR + Docker Hub)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.artifact == 'images')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.sh compares trees against previous tags

      - name: resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # QEMU for the arm64 leg; the Go images cross-compile CGO-free, but the console's npm build is
      # genuinely emulated and is the slow part of this job.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build + push
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scripts/release.sh images "${{ steps.v.outputs.version }}"
          else
            scripts/release.sh images "${{ steps.v.outputs.version }}" --push
          fi

  # ── Go SDK ────────────────────────────────────────────────────────────────────────────────────
  # The tag IS the release, so by the time this runs the artifact is already public. What it can
  # still do is fail loudly: build/vet/test the module and assert its generated mirrors match the
  # contract, so a bad tag is visible immediately rather than discovered by a consumer.
  go-sdk:
    name: Go SDK module
    if: startsWith(github.ref, 'refs/tags/clients/go/v') || (github.event_name == 'workflow_dispatch' && inputs.artifact == 'go-sdk')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag on a workflow_dispatch release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#clients/go/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scripts/release.sh go-sdk "${{ steps.v.outputs.version }}" --dry-run
          else
            scripts/release.sh go-sdk "${{ steps.v.outputs.version }}" --push
          fi

      - name: announce
        run: |
          # The import path comes from go.mod, NOT from the GitHub namespace — they are allowed to
          # differ, and here they do.
          echo "go get $(sed -n 's/^module //p' clients/go/go.mod | head -1)@v${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # ── TypeScript SDK ────────────────────────────────────────────────────────────────────────────
  ts-sdk:
    name: npm package (oikumenea-client)
    if: startsWith(github.ref, 'refs/tags/ts/v') || (github.event_name == 'workflow_dispatch' && inputs.artifact == 'ts-sdk')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version-bump commit + the ts/v* tag on a manual dispatch
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # the TS generator extracts the Conjure IR with a Go tool

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#ts/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            scripts/release.sh ts-sdk "${{ steps.v.outputs.version }}" --dry-run
          else
            scripts/release.sh ts-sdk "${{ steps.v.outputs.version }}" --push
          fi

      - name: announce
        run: echo "npm i oikumenea-client@${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
