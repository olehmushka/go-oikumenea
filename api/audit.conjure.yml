# Audit module API (M1). The append-only Action ledger's read surface (docs/modules/audit.md).
#
# Read-only by design: there is NO write endpoint — audit rows are written in-process, in the same
# transaction as the mutation they record (D-Audit). RID-bearing fields are typed `string` (the
# composed URN RID): Conjure reserves `rid` as a built-in primitive whose `ri.` format is NOT our
# `urn:oikumenea:` RID, so it cannot be used here. Generated Go lands in internal/conjure and is
# never hand-edited.
#
# Endpoints declare `auth: header` so the contract carries the bearer token from M1 onward; the
# `audit.read` permission check, unit-scoping over the closure, and the shadow gate are wired once
# authorization (M7) + identity-federation (M8) land.
types:
  definitions:
    default-package: oikumenea.audit
    objects:
      AuditActorType:
        docs: The two actor kinds (D-Audit). An instance admin is a PERSON, never a separate kind.
        values:
          - PERSON
          - SYSTEM
      AuditOutcome:
        docs: Outcome of the recorded action; denied write attempts are recorded too (D-Audit).
        values:
          - SUCCESS
          - DENIED
          - ERROR
      AuditEntry:
        docs: One immutable audit record — who did what to which target, when, in which request.
        fields:
          id:
            type: string
            docs: The Action RID (action__<type>) this entry records; the audit log is the action ledger.
          createdAt: datetime
          actorType: AuditActorType
          actorPersonId:
            type: optional<string>
            docs: The person who acted; present iff actorType is PERSON.
          subsystem:
            type: optional<string>
            docs: Originating source for SYSTEM actions (bootstrap, event-subscriber, …); present iff actorType is SYSTEM.
          action:
            type: string
            docs: The action code, e.g. assignment.grant, unit.transition, rank.scheme.update.
          targetType:
            type: string
            docs: The acted-on entity kind, e.g. unit, person, role_assignment, account, graph.
          targetId: optional<string>
          unitId:
            type: optional<string>
            docs: The unit context of the action where applicable (drives scoped audit reads).
          requestId:
            type: string
            docs: Correlation key shared with logs, metrics, and traces.
          before:
            type: optional<any>
            docs: State snapshot before the change (no secrets; PII minimized).
          after:
            type: optional<any>
            docs: State snapshot / change payload after the change (no secrets; PII minimized).
          outcome: AuditOutcome
      AuditEntryPage:
        docs: A page of audit entries plus the opaque token for the next page (empty when exhausted).
        fields:
          entries: list<AuditEntry>
          nextPageToken: optional<string>
      ActionType:
        docs: |
          One registered action type (D-ActionTypes, review-2026-09 R-29): the machine catalog behind
          the free-text `audit_log.action`. `code` is what an audit entry's `action` carries.
        fields:
          code:
            type: string
            docs: Stable dotted action code, e.g. assignment.grant, unit.transition.
          service:
            type: string
            docs: The owning RID service (module) name, e.g. authz, tenant, person.
          targetType:
            type: string
            docs: The object type the action targets (the audit target_type), e.g. unit, person, education.
          permission:
            type: string
            docs: The gating write permission (module-granular), e.g. assignment.grant, education.manage.
          parameters:
            type: list<ActionParam>
            docs: |
              The action's argument schema (D-ActionTypes, review-2026-09 R-29 parameter-schema seam),
              single-sourced from the Conjure request type that carries the action's inputs and derived
              from the IR — never hand-authored. Empty for actions with no request body (deletes,
              lifecycle POSTs, imports) or not yet annotated (the catalog is expand-only).
          endpoint:
            type: optional<ActionEndpoint>
            docs: |
              The HTTP endpoint an invocation targets (D-ActionInvocation, review-2026-09 R-33),
              single-sourced from the Conjure IR. Absent for actions with no invocable endpoint
              (purge-cascade erasures emitted internally on PersonPurged; the bulk import.* ingestion
              plane) — those are catalogued and audited but not runnable from the console.
      ActionEndpoint:
        docs: |
          The HTTP binding an action invocation targets (D-ActionInvocation, review-2026-09 R-33),
          derived from the Conjure IR by tools/genactionendpoints — never hand-authored, so it cannot
          drift from the contract.
        fields:
          method:
            type: string
            docs: HTTP method, e.g. POST, PUT, DELETE.
          path:
            type: string
            docs: Conjure path template, e.g. /person/v1/persons/{personId}/emails.
          pathParams:
            type: list<string>
            docs: |
              Path parameter names in path order. By convention the first is the target object's own
              RID (the object the action runs on); any remainder are sub-resource ids the caller supplies
              (e.g. the card id of a finance.card.update).
      ActionParam:
        docs: |
          One argument of an action type, projected from its Conjure request field (D-ActionTypes, R-29).
          Descriptive only — used for discoverability (the console action catalog), not write-time
          validation.
        fields:
          name:
            type: string
            docs: The request field name, e.g. subjectPersonId, scope.
          type:
            type: string
            docs: A display type token derived from the Conjure field type, e.g. string, rid, datetime, enum, list<string>.
          required:
            type: boolean
            docs: True when the field is non-optional in the request.
          docs:
            type: optional<string>
            docs: The field's documentation from the contract, when present.
          sensitivity:
            type: optional<string>
            docs: |
              Set for a regulated/secret field (D-DataScope): `pan` (PCI card number), `iban`, `spectrum`
              (special-category inference, range [-1,1]) or `secret`. The console runner masks the input
              and runs the matching advisory validator; the server's pkg/personalcode validators remain
              authoritative. Absent for ordinary fields.
      ObjectHistoryEvent:
        docs: |
          One dated change in an object's history (D-Temporal, review-2026-09 R-31): a projection of an
          audit row keyed to this object's RID. `before`/`after` carry the change payload and are
          **redacted (null) unless the caller holds the sensitive-reader capability** — the timeline
          (when/what/who) is always visible under `audit.read`.
        fields:
          at:
            type: datetime
            docs: When the change was recorded (the audit row's createdAt).
          action:
            type: string
            docs: The action code that produced the change, e.g. person.rank.assign, unit.transition.
          actorType: AuditActorType
          actorPersonId:
            type: optional<string>
            docs: The person who acted; present iff actorType is PERSON.
          subsystem:
            type: optional<string>
            docs: Originating source for SYSTEM actions; present iff actorType is SYSTEM.
          targetType:
            type: string
            docs: The acted-on entity kind (the audit target_type), e.g. person, unit.
          outcome: AuditOutcome
          requestId:
            type: string
            docs: Correlation key shared with logs, metrics, and traces.
          before:
            type: optional<any>
            docs: State before the change; null when redacted (caller lacks sensitive-reader) or absent.
          after:
            type: optional<any>
            docs: State after the change; null when redacted (caller lacks sensitive-reader) or absent.
      ObjectHistory:
        docs: |
          A paginated, reverse-chronological history of one object, read from the audit ledger
          (D-Temporal tier b, R-31). Serves the "what did this record say / who changed it when"
          question a Gotham-style dossier timeline needs.
        fields:
          rid:
            type: string
            docs: The object RID whose history this is (the audit target_id filter).
          events: list<ObjectHistoryEvent>
          nextPageToken: optional<string>
          redacted:
            type: boolean
            docs: |
              True when this response withheld before/after payloads because the caller lacks the
              sensitive-reader capability. The timeline itself is unaffected.
    errors:
      AuditEntryNotFound:
        namespace: Audit
        code: NOT_FOUND
        safe-args:
          auditEntryId: string
services:
  AuditService:
    name: Audit Service
    package: oikumenea.audit
    base-path: /audit/v1
    default-auth: header
    docs: |
      Read-only access to the append-only audit log (D-Audit). Gated by `audit.read`, unit-scoped
      exactly like `person.read` (PDP over the closure + shadow gate) once authorization lands (M7).
    endpoints:
      query:
        http: GET /audit
        docs: Query the log, filterable by actor/target/unit/action/outcome/time, token-paginated.
        args:
          actorPersonId:
            type: optional<string>
            param-type: query
          actorType:
            type: optional<AuditActorType>
            param-type: query
          targetType:
            type: optional<string>
            param-type: query
          targetId:
            type: optional<string>
            param-type: query
          unitId:
            type: optional<string>
            param-type: query
          action:
            type: optional<string>
            param-type: query
          outcome:
            type: optional<AuditOutcome>
            param-type: query
          since:
            type: optional<datetime>
            param-type: query
          until:
            type: optional<datetime>
            param-type: query
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: AuditEntryPage
      get:
        http: GET /audit/{entryId}
        docs: Read one entry by its Action RID. Returns Audit:AuditEntryNotFound when absent.
        args:
          entryId:
            type: string
            param-type: path
        returns: AuditEntry
      listActionTypes:
        http: GET /action-types
        docs: |
          The full action-type catalog (D-ActionTypes, R-29), sorted by (service, code). Lets a client
          — e.g. the console's object-actions panel — discover what actions exist and their gating
          permission, instead of hard-coding them. Static registry read; requires only an
          authenticated subject.
        returns: list<ActionType>
      getObjectHistory:
        http: GET /objects/{rid}/history
        docs: |
          The reverse-chronological audit history of one object (D-Temporal tier b, R-31): every
          recorded change to the object with `target_id = {rid}`, token-paginated. Gated by
          `audit.read`; the `before`/`after` change payloads are **redacted** (null, `redacted=true`)
          unless the caller also holds the sensitive-reader capability, because a folded per-object
          timeline can surface pii up to the D-DataScope special-category ceiling.
        args:
          rid:
            type: string
            param-type: path
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: ObjectHistory
