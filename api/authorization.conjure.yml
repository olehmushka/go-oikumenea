# Authorization module API (M7) — the centerpiece: RBAC + the Policy Decision Point (PDP)
# (docs/modules/authorization.md). Three resources + the decision surface:
#   * ROLES — named sets of code-defined permissions (the permission CATALOG is code, not data; a
#     role only references permission codes). Base roles are seeded + immutable.
#   * ASSIGNMENTS — the reified link__has_role: (subject, role, target_unit, scope, graph) + optional
#     expiry. The unit of granted authority; authority comes ONLY from these (never rank/position).
#   * INSTANCE ADMINS — the instance-wide authority plane (the cluster-admin analog).
#   * /authorize[/batch] — the decision the PDP computes over the unit-graph closure.
#
# RID-bearing fields are typed `string` (the composed URN RID): Conjure reserves `rid` as a built-in
# primitive whose `ri.` format is NOT our `urn:oikumenea:` RID. A role's `name`/`description` are
# TRANSLATABLE labels returned as `locale -> text` maps (assembled from the i18n store; D-i18n) —
# unlike permission codes, which are stable codes. Endpoints declare `auth: header`; the bearer token
# carries the acting subject (M8 hardens token->person; until then the PEP resolves an interim
# subject from the token). Writes are audited in-process (D-Audit). Generated Go lands in
# internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: oikumenea.authorization
    objects:
      Role:
        docs: A named set of permission codes (Object Role). Base roles are seeded and immutable.
        fields:
          id:
            type: string
            docs: The role's URN RID (carried as a plain string).
          code:
            type: string
            docs: Stable, locale-agnostic identifier; immutable by convention.
          name:
            type: map<string, string>
            docs: The role name as a locale -> text map (default-locale fallback + i18n translations).
          description:
            type: map<string, string>
            docs: The role description as a locale -> text map; empty when unset.
          permissions:
            type: list<string>
            docs: The role's permission codes (the closed catalog; code-defined).
          isBase:
            type: boolean
            docs: True for seeded base roles (immutable by instance admins).
          createdAt: datetime
          updatedAt: datetime
      RolePage:
        docs: A page of roles plus the opaque token for the next page (empty when exhausted).
        fields:
          roles: list<Role>
          nextPageToken: optional<string>
      Assignment:
        docs: |
          The reified link__has_role — the unit of granted authority. graphId is null for unit scope
          and names the cascade graph for subtree scope. Reversible: revoking sets revokedAt rather
          than deleting.
        fields:
          id:
            type: string
            docs: The assignment's URN RID (carried as a plain string).
          subjectPersonId: string
          roleId: string
          targetUnitId: string
          scope:
            type: string
            docs: One of unit | subtree.
          graphId:
            type: optional<string>
            docs: The cascade graph RID (subtree only); null for unit scope.
          grantedBy:
            type: optional<string>
            docs: The granting person RID; null for the install bootstrap grant.
          grantedAt: datetime
          revokedAt:
            type: optional<datetime>
            docs: When revoked; null while active.
          revokedBy: optional<string>
          expiresAt:
            type: optional<datetime>
            docs: Optional decision-time expiry; null = no expiry.
          createdAt: datetime
          updatedAt: datetime
      AssignmentPage:
        docs: A page of assignments plus the opaque token for the next page (empty when exhausted).
        fields:
          assignments: list<Assignment>
          nextPageToken: optional<string>
      FacetBucket:
        docs: |
          One bucket of a facet distribution (M57 / D-ObjectFacets).

          `key` is the bucket's stable, locale-agnostic identity — a `scope` value (`unit`) or a RID
          for a `ref` facet — and is exactly what you pass back as the corresponding list filter. Two
          synthetic keys never name a real value: `(unknown)` is the NULL bucket and `(other)` a
          top-N facet's collapsed tail; neither is a usable filter value.

          `label` carries the object's display name as a locale → text map (D-i18n) and is present
          only for `ref` buckets, whose keys are RIDs. Best effort: an id with no resolvable name
          carries no label.
        fields:
          key: string
          label: optional<map<string, string>>
          count: integer
      FacetDistribution:
        docs: |
          One facet's buckets, in chart order — for `scope`, the declared CHECK-set order with
          zero-count buckets included so a chart's shape is stable; for a ref, descending by count
          with `(other)`/`(unknown)` last.
        fields:
          facet: string
          buckets: list<FacetBucket>
      AssignmentStats:
        docs: |
          Facet distributions over the SAME set `listAssignments` returns under the same filters,
          with the reach trim folded INTO the count (M58 ticket 6 / D-ObjectFacets).

          TWO arms. An instance admin counts every grant; anyone else counts only grants whose
          target unit is within their `assignment.read` reach — the same question the `targetUnitId`
          filter has always asked, asked for many units at once. The trim is computed over
          `assignment.read` SPECIFICALLY and not over the `'%.read'` family that every other module's
          reach predicate uses: generic read-reach is a strict superset, so borrowing it here would
          widen a surface rather than describe it.

          ACTIVE ONLY. `listAssignments` returns active grants (`revokedAt` null) and this counts the
          same population, so `totalCount` is a count of ACTIVE grants — not of rows in the grant
          table. A revoked grant is a security artefact whose reachability is an authz read-surface
          decision rather than a facet-vocabulary one, which is why the default stands and why there
          is no `active` facet to make a one-bar chart out of.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
      InstanceAdmin:
        docs: A person on the instance-wide authority plane (the reified link__instance_admin).
        fields:
          id:
            type: string
            docs: The grant's URN RID (carried as a plain string).
          personId: string
          grantedBy:
            type: optional<string>
            docs: The granting person RID; null for the install bootstrap grant.
          grantedAt: datetime
          revokedAt: optional<datetime>
          revokedBy: optional<string>
      CreateRoleRequest:
        docs: Create a custom role. name/description are the default-locale fallbacks (translatable separately).
        fields:
          code: string
          name: string
          description: optional<string>
          permissions:
            type: list<string>
            docs: Permission codes from the catalog; instance-scope and unknown codes are rejected.
      UpdateRoleRequest:
        docs: Update a custom role's name/description and (when present) replace its permission set. code/isBase immutable.
        fields:
          name: optional<string>
          description: optional<string>
          permissions:
            type: optional<list<string>>
            docs: When present, fully replaces the permission set. Omit to leave permissions unchanged.
      GrantAssignmentRequest:
        docs: Grant a role to a person at a target unit. graph applies to subtree scope (default command); ignored for unit.
        fields:
          subjectPersonId: string
          roleId: string
          targetUnitId: string
          scope:
            type: string
            docs: One of unit | subtree.
          graph:
            type: optional<string>
            docs: The cascade graph CODE for a subtree grant; omit to default to the command graph. Ignored for unit scope.
          expiresAt:
            type: optional<datetime>
            docs: Optional decision-time expiry (RFC 3339).
      GrantInstanceAdminRequest:
        docs: Place a person on the instance-admin plane.
        fields:
          personId: string
      AuthorizeRequest:
        docs: Ask the PDP whether subject may perform action on unit. unitId is omitted for instance-scope actions.
        fields:
          subjectPersonId: string
          action: string
          unitId: optional<string>
          explain:
            type: optional<boolean>
            docs: When true, the response carries an explanation (DS-16). Default false.
      AuthorizeResponse:
        docs: A PDP decision. explanation is present only when explain was requested.
        fields:
          allow: boolean
          explanation: optional<Explanation>
      Explanation:
        docs: Why a decision was reached. For ALLOW, the contributing grants (may be several across graphs); for DENY, the reason.
        fields:
          contributions: list<Contribution>
          denyReason: optional<string>
      Contribution:
        docs: One reason an ALLOW was reached. instanceAdmin true means the instance plane; otherwise the assignment is named.
        fields:
          instanceAdmin: boolean
          assignmentId: optional<string>
          roleCode: optional<string>
          targetUnitId: optional<string>
          scope: optional<string>
          graphCode: optional<string>
      AuthorizeQuery:
        docs: One question in a batch decision.
        fields:
          action: string
          unitId: optional<string>
      BatchAuthorizeRequest:
        docs: Several questions for one subject; the subject's authority state is fetched once.
        fields:
          subjectPersonId: string
          queries: list<AuthorizeQuery>
          explain: optional<boolean>
      BatchAuthorizeResponse:
        fields:
          decisions: list<AuthorizeResponse>
      MyCapabilities:
        docs: |
          The CALLER's own effective authorization state (D-SelfCapabilities). `permissions` is the
          flat, deduped, sorted union of the caller's active-grant permission codes; `isInstanceAdmin`
          true means they hold everything and `permissions` is left empty (treat as show-all). A
          machine/service subject receives an empty set with isInstanceAdmin false. Cosmetic UI gating
          only — the PDP still re-decides every request.
        fields:
          permissions: list<string>
          isInstanceAdmin: boolean
      PrincipalGrant:
        docs: |
          One permission code held by a MACHINE subject (M51 / D-ServiceIdentities) — the reified
          PRINCIPAL_GRANT link. FLAT by construction: no target unit, no scope, no graph, because a
          service principal has no unit reach.

          `orgId` absent means INSTANCE-WIDE (reference-catalog imports, the M53 wiring codes); a named
          organization confines the principal to that organization's data — the blast-radius boundary
          for a connector is the organization, not the unit.
        fields:
          id: string
          principalId:
            type: string
            docs: The service principal's URN RID (registered on IdentityFederationService).
          permission:
            type: string
            docs: A code from the closed permission catalog.
          orgId:
            type: optional<string>
            docs: Absent = instance-wide; present = confined to that organization.
          grantedBy: optional<string>
          grantedAt: datetime
          revokedAt: optional<datetime>
      GrantPrincipalPermissionRequest:
        fields:
          principalId: string
          permission: string
          orgId:
            type: optional<string>
            docs: Omit for an instance-wide grant; set to confine the machine to one organization.
      PrincipalGrantPage:
        fields:
          grants: list<PrincipalGrant>
    errors:
      RoleNotFound:
        namespace: Role
        code: NOT_FOUND
        safe-args:
          roleId: string
      RoleConflict:
        docs: A role with this code already exists.
        namespace: Role
        code: CONFLICT
        safe-args:
          reason: string
      RoleInvalid:
        docs: The role request is malformed or names an unknown / instance-scope permission code.
        namespace: Role
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      RoleImmutable:
        docs: Base roles cannot be edited or deleted by instance admins.
        namespace: Role
        code: FAILED_PRECONDITION
        safe-args:
          roleId: string
      RoleInUse:
        docs: The role has active assignments and cannot be deleted; revoke them first.
        namespace: Role
        code: FAILED_PRECONDITION
        safe-args:
          roleId: string
      AssignmentNotFound:
        namespace: Assignment
        code: NOT_FOUND
        safe-args:
          assignmentId: string
      AssignmentConflict:
        docs: An identical active assignment already exists.
        namespace: Assignment
        code: CONFLICT
        safe-args:
          reason: string
      AssignmentInvalid:
        docs: |
          The assignment request is malformed or references an unknown subject/role/unit/graph, or a
          list/stats request named an undeclared facet key. It is NO LONGER returned for "provide
          exactly one of subjectPersonId or targetUnitId" — since M58 ticket 6 `listAssignments`
          needs neither.
        namespace: Assignment
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      NonAuthorityBearingGraph:
        docs: A subtree grant named a directory-only graph; authority does not cascade there (D-DirectoryGraphs).
        namespace: Authorization
        code: FAILED_PRECONDITION
        safe-args:
          graph: string
      SelfEscalation:
        docs: The grantor lacks the authority to grant this assignment (no self-escalation).
        namespace: Authorization
        code: PERMISSION_DENIED
        safe-args:
          reason: string
      PermissionDenied:
        docs: The PDP denied the action. The shared denial every module's PEP returns.
        namespace: Authorization
        code: PERMISSION_DENIED
        safe-args:
          action: string
      InstanceAdminNotFound:
        namespace: Authorization
        code: NOT_FOUND
        safe-args:
          instanceAdminId: string
      InstanceAdminConflict:
        docs: The person is already an active instance admin.
        namespace: Authorization
        code: CONFLICT
        safe-args:
          reason: string
      PrincipalGrantNotFound:
        namespace: PrincipalGrant
        code: NOT_FOUND
        safe-args:
          grantId: string
      PrincipalGrantConflict:
        docs: An identical active grant already exists for this principal.
        namespace: PrincipalGrant
        code: CONFLICT
        safe-args:
          reason: string
      PrincipalGrantInvalid:
        docs: |
          The request is malformed, names an unknown permission code, or names a principal that does
          not exist or is disabled.
        namespace: PrincipalGrant
        code: INVALID_ARGUMENT
        safe-args:
          reason: string

services:
  AuthorizationService:
    name: Authorization Service
    package: oikumenea.authorization
    base-path: /authorization/v1
    default-auth: header
    docs: |
      The PDP + RBAC management. /authorize answers (person, action, unit) over the unit-graph
      closure; roles/assignments/instance-admins are policy-as-data. /authorize requires
      assignment.read (no self-exemption, OQ-5); role.* are instance-scope; assignment.grant/revoke
      are unit-scoped on the target unit; instance.admin.manage is instance-scope. Writes audited
      (D-Audit). Denied operations surface Authorization:PermissionDenied.
    endpoints:
      authorize:
        http: POST /authorize
        docs: Decide (subject, action, unit). Requires assignment.read reaching the unit.
        args:
          request: AuthorizeRequest
        returns: AuthorizeResponse
      authorizeBatch:
        http: POST /authorize/batch
        docs: Batch decisions for one subject, with optional decision-explain (DS-16).
        args:
          request: BatchAuthorizeRequest
        returns: BatchAuthorizeResponse
      myCapabilities:
        http: GET /me/capabilities
        docs: |
          The caller's OWN effective permission codes + instance-admin flag (D-SelfCapabilities).
          Self-only: subject taken from the request context, NOT gated on assignment.read. Machine
          subjects get an empty set. Lets an unprivileged console hide modules it cannot read in one
          round-trip; cosmetic only.
        returns: MyCapabilities
      createRole:
        http: POST /roles
        docs: Create a custom role (instance-scope role.create). Returns Role:RoleConflict if the code is taken.
        args:
          request: CreateRoleRequest
        returns: Role
      listRoles:
        http: GET /roles
        docs: List roles, token-paginated (role.read).
        args:
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: RolePage
      getRole:
        http: GET /roles/{roleId}
        docs: Read one role with its permission set (role.read).
        args:
          roleId:
            type: string
            param-type: path
        returns: Role
      updateRole:
        http: PUT /roles/{roleId}
        docs: Edit a custom role (instance-scope role.update). Base roles return Role:RoleImmutable.
        args:
          roleId:
            type: string
            param-type: path
          request: UpdateRoleRequest
        returns: Role
      deleteRole:
        http: DELETE /roles/{roleId}
        docs: Soft-delete a custom role (instance-scope role.delete). Blocked with Role:RoleInUse if assigned.
        args:
          roleId:
            type: string
            param-type: path
      grantAssignment:
        http: POST /assignments
        docs: Grant (subject, role, unit, scope, graph) + optional expiry (assignment.grant on the target unit).
        args:
          request: GrantAssignmentRequest
        returns: Assignment
      revokeAssignment:
        http: DELETE /assignments/{assignmentId}
        docs: Revoke an assignment (reversible flip; assignment.revoke).
        args:
          assignmentId:
            type: string
            param-type: path
        returns: Assignment
      listAssignments:
        http: GET /assignments
        docs: |
          List ACTIVE assignments, token-paginated. Gated on `assignment.read` held anywhere, and
          reach-trimmed: an instance admin sees every grant, anyone else sees only grants whose
          target unit is within their `assignment.read` reach.

          Every argument is an optional FACET filter (M58 ticket 6 / D-ObjectFacets). Until then this
          endpoint required exactly one of `subjectPersonId`/`targetUnitId` and there was no way to
          ask for "the grants"; Assignment:AssignmentInvalid is no longer returned for that reason.

          Two things this changed rather than added, both deliberate:
          - the `subjectPersonId` arm used to be gated on `assignment.read` held ANYWHERE with no
            trim, so one grant anywhere enumerated any person's authority everywhere. It is now
            trimmed like every other arm, so it can only narrow.
          - the `targetUnitId` arm used to 403 when the caller could not reach the named unit; it now
            returns an empty page. The row set is identical.

          ACTIVE ONLY, and that default stands: `revokedAt` rows are never returned, so there is no
          `active` or `expiresAt` filter (a distribution whose every row is active is a chart with
          one bar).
        args:
          subjectPersonId:
            type: optional<string>
            param-type: query
            docs: Facet filter — the subject person's RID.
          targetUnitId:
            type: optional<string>
            param-type: query
            docs: Facet filter — the target unit's RID. EXACT match, not subtree-expanding.
          roleId:
            type: optional<string>
            param-type: query
            docs: Facet filter — the granted role's RID.
          scope:
            type: optional<string>
            param-type: query
            docs: Facet filter — `unit` | `subtree`.
          graphId:
            type: optional<string>
            param-type: query
            docs: Facet filter — the cascade graph's RID; set for subtree grants only.
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: AssignmentPage
      assignmentStats:
        http: GET /stats/assignments
        docs: |
          Facet distributions over the active grant population — the dashboard half of the assignment
          facet vocabulary (M58 ticket 6 / D-ObjectFacets). Takes exactly the filter args
          `listAssignments` takes, minus paging, so a dashboard and a list are two renderings of one
          request state.

          The path is `/stats/assignments` rather than `/assignments/stats` because the server's
          router rejects a literal path segment that is a sibling of `{assignmentId}`.
        args:
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`roleId,scope`). Omitted or empty =
              every facet the caller may read; an explicit list of nothing (`facets=,`) returns
              `totalCount` alone. An undeclared facet key is an Assignment:AssignmentInvalid.
          subjectPersonId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listAssignments`.
          targetUnitId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listAssignments`.
          roleId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listAssignments`.
          scope:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listAssignments`.
          graphId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listAssignments`.
        returns: AssignmentStats
      grantInstanceAdmin:
        http: POST /instance-admins
        docs: Grant instance-admin (instance.admin.manage). Returns Authorization:InstanceAdminConflict if already active.
        args:
          request: GrantInstanceAdminRequest
        returns: InstanceAdmin
      revokeInstanceAdmin:
        http: DELETE /instance-admins/{instanceAdminId}
        docs: Revoke instance-admin (instance.admin.manage; reversible flip).
        args:
          instanceAdminId:
            type: string
            param-type: path
        returns: InstanceAdmin
      grantPrincipalPermission:
        http: POST /principal-grants
        docs: |
          Grant a permission code to a machine subject (M51 / D-ServiceIdentities), optionally confined
          to one organization. Instance-plane act gated on `service-principal.manage`.

          A principal never holds a ROLE: instance-scope codes such as `import.manage` are satisfiable
          only on the instance plane, so a role could not carry them (see the PDP). Audited.
        args:
          request: GrantPrincipalPermissionRequest
        returns: PrincipalGrant
      revokePrincipalPermission:
        http: DELETE /principal-grants/{grantId}
        docs: |
          Revoke-flip a principal grant (the row survives; the history stays readable). Takes effect
          immediately — principal grants are read per request, not cached. Gates on
          `service-principal.manage`. Audited.
        args:
          grantId:
            type: string
            param-type: path
        returns: PrincipalGrant
      listPrincipalGrants:
        http: GET /principal-grants
        docs: List a machine subject's active grants. Gates on `service-principal.read`.
        args:
          principalId:
            type: string
            param-type: query
        returns: PrincipalGrantPage
