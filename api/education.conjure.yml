# Education module API (M20). External reference institutions (where a person studied/taught), their
# internal structure + buildings, and the person bindings (docs/modules/education.md / D-Education).
# Modelled as EXTERNAL reference entities — distinct from the deploying org's tenant units, independent
# of companies. Mirrors two existing templates: membership (positions + one-holder effective-dated
# appointments) and tenant (a recursive structure tree + a maintained transitive closure). Buildings
# reference the shared M19 location (locationId).
#
# RID-bearing fields are typed `string` (the canonical RID text): Conjure reserves `rid` as a built-in
# primitive, so a type named `Rid` cannot be used. Translatable labels (catalog/institution/unit/group
# names, building names, position titles) are returned as a `locale -> text` map assembled from the i18n
# store (D-i18n: all locales in every response, no negotiation); create/update requests carry the
# default-locale value as a plain `string`. Education entities carry no unit scope of their own (external
# reference data), so reads gate on `education.read` and writes on `education.manage` /
# `education.position.manage` / `education.enrollment.manage` (catalog management is instance-scope,
# `education.catalog.manage`) — all satisfied anywhere via the PEP. Writes are audited in-process under
# an interim `system` actor (D-Audit). Generated Go lands in internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: oikumenea.education
    objects:
      # ---- reference catalogs ----
      InstitutionKind:
        docs: An instance-admin catalog entry classifying an institution (university/school/…).
        fields:
          id: string
          code: string
          name:
            type: map<string, string>
            docs: Default-locale fallback + i18n translations.
          status: string
          sortOrder: optional<integer>
      UnitKind:
        docs: An instance-admin catalog entry classifying a structure-tree node (faculty/department/…).
        fields:
          id: string
          code: string
          name: map<string, string>
          status: string
          sortOrder: optional<integer>
      DegreeLevel:
        docs: An ISCED 2011 degree level (0..8), a migration-seeded reference scale.
        fields:
          id: string
          code: string
          name: map<string, string>
          iscedLevel: integer
          status: string
          sortOrder: optional<integer>
      # ---- objects ----
      Institution:
        docs: An external reference institution (where people studied/taught). Soft-deleted, not destroyed.
        fields:
          id: string
          code: string
          name: map<string, string>
          kindId: string
          countryId:
            type: optional<string>
            docs: The institution's country RID (geo_countries); null for international/online.
          foundedOn: optional<string>
          closedOn: optional<string>
          state:
            type: string
            docs: One of active | closed | merged.
          createdAt: datetime
          updatedAt: datetime
      EducationUnit:
        docs: A node in an institution's recursive structure tree (campus → faculty → department → chair).
        fields:
          id: string
          institutionId: string
          parentId:
            type: optional<string>
            docs: The parent unit RID; null for a top-level unit.
          kindId: string
          code: string
          name: map<string, string>
          status: string
          sortOrder: optional<integer>
          depth:
            type: optional<integer>
            docs: Distance from the queried root (populated by list-by-institution via the closure).
          createdAt: datetime
          updatedAt: datetime
      Building:
        docs: A physical building of an institution (optionally a unit), located via the shared M19 location.
        fields:
          id: string
          institutionId: string
          unitId: optional<string>
          locationId:
            type: optional<string>
            docs: The shared location RID (M19); null until geocoded.
          code: string
          name: map<string, string>
          kind:
            type: string
            docs: One of academic | dormitory | administrative | library | sports | other.
          createdAt: datetime
          updatedAt: datetime
      Group:
        docs: A cohort (study group) under a unit, with an admission year.
        fields:
          id: string
          unitId: string
          code: string
          name: map<string, string>
          admissionYear: optional<integer>
          status: string
          createdAt: datetime
          updatedAt: datetime
      EducationPosition:
        docs: |
          An institution/unit-owned billet (mirrors membership Position) — exists while vacant; carries
          no authority. The current holder is populated on get/list (null when vacant).
        fields:
          id: string
          institutionId: string
          unitId: optional<string>
          code: string
          title: map<string, string>
          status: string
          sortOrder: optional<integer>
          holder: optional<Appointment>
          createdAt: datetime
          updatedAt: datetime
      Appointment:
        docs: A person filling an education position (link__holds_education_position), one-holder, effective-dated.
        fields:
          id: string
          personId: string
          positionId: string
          status: string
          effectiveFrom: datetime
          effectiveTo: optional<datetime>
          createdAt: datetime
          updatedAt: datetime
      PersonAppointment:
        docs: An appointment a person holds, enriched with the position's title and owning institution (read-only person view).
        fields:
          id: string
          personId: string
          positionId: string
          positionTitle: string
          institutionId: string
          institutionName: string
          status: string
          effectiveFrom: datetime
          effectiveTo: optional<datetime>
          createdAt: datetime
          updatedAt: datetime
      # ---- person bindings ----
      Enrollment:
        docs: A person STUDIED_AT an institution (optionally a unit/group), with an ISCED level + qualification.
        fields:
          id: string
          personId: string
          institutionId: string
          unitId: optional<string>
          groupId: optional<string>
          programId:
            type: optional<string>
            docs: The program studied (education_programs); null if unspecified.
          degreeLevelId: optional<string>
          fieldOfStudy: optional<string>
          studentNumber: optional<string>
          status:
            type: string
            docs: One of enrolled | graduated | withdrawn | expelled | on_leave.
          qualification: optional<string>
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
          createdAt: datetime
          updatedAt: datetime
      DormitoryStay:
        docs: A person RESIDED_IN_DORMITORY — a dedicated stay (person ↔ dorm building, room, period).
        fields:
          id: string
          personId: string
          buildingId: string
          room: optional<string>
          status:
            type: string
            docs: One of active | ended.
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
          createdAt: datetime
          updatedAt: datetime
      # ---- pages ----
      InstitutionPage:
        fields:
          institutions: list<Institution>
          nextPageToken: optional<string>
      FacetBucket:
        docs: |
          One bucket of a facet distribution (M57 / D-ObjectFacets).

          `key` is the bucket's stable, locale-agnostic identity — an enum value (`closed`), a year
          (`1834`), or a RID for a `ref` facet — and is exactly what you pass back as the
          corresponding list filter. Two synthetic keys never name a real value: `(unknown)` is the
          NULL bucket and `(other)` a top-N facet's collapsed tail; neither is a usable filter value.

          `label` carries the object's display name as a locale → text map (D-i18n) and is present
          only for `ref` buckets, whose keys are RIDs. Best effort: an id with no resolvable name
          carries no label.
        fields:
          key: string
          label: optional<map<string, string>>
          count: integer
      FacetDistribution:
        docs: |
          One facet's buckets, in chart order — for an enum, the declared CHECK-set order with
          zero-count buckets included so a chart's shape is stable; for a ref, descending by count
          with `(other)`/`(unknown)` last; for `foundedOn`, ascending by year.
        fields:
          facet: string
          buckets: list<FacetBucket>
      InstitutionStats:
        docs: |
          Facet distributions over the SAME set `listInstitutions` returns under the same filters,
          with the shadow gate folded INTO the count (M58 ticket 5 / D-ObjectFacets).

          An institution IS a `university`-domain tenant ORGANIZATION plus a sidecar (M41 /
          D-UnifiedOrgGraph), so it carries that organization's public/shadow bit and this count
          applies the organization gate: `public OR reachable`, where reach is DERIVED from unit reach
          (D-VisibilityScope, amended M58 ticket 4) — an organization is visible when any of its live
          units is in the subject's reach. Folded into SQL rather than applied to the page, because
          trimming after the fact is right for a page and wrong for a count. `totalCount` therefore
          equals the rows exhaustively paging `listInstitutions` under these filters would return.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
      PositionPage:
        fields:
          positions: list<EducationPosition>
          nextPageToken: optional<string>
      # ---- catalog lists ----
      InstitutionKindList:
        fields:
          institutionKinds: list<InstitutionKind>
      UnitKindList:
        fields:
          unitKinds: list<UnitKind>
      DegreeLevelList:
        fields:
          degreeLevels: list<DegreeLevel>
      EducationUnitList:
        fields:
          units: list<EducationUnit>
      BuildingList:
        fields:
          buildings: list<Building>
      GroupList:
        fields:
          groups: list<Group>
      PersonAppointmentList:
        fields:
          appointments: list<PersonAppointment>
      EnrollmentList:
        fields:
          enrollments: list<Enrollment>
      DormitoryStayList:
        fields:
          dormitoryStays: list<DormitoryStay>
      # ---- request bodies ----
      UpsertCatalogKindRequest:
        docs: Create/update an institution-kind or unit-kind. name is the default-locale fallback.
        fields:
          code: string
          name: string
          sortOrder: optional<integer>
      CreateInstitutionRequest:
        fields:
          code: string
          name: string
          kindId: string
          countryId: optional<string>
          foundedOn: optional<string>
          closedOn: optional<string>
      UpdateInstitutionRequest:
        docs: Update name/kind/country/dates/state. code is immutable; omitted fields are unchanged.
        fields:
          name: optional<string>
          kindId: optional<string>
          countryId: optional<string>
          foundedOn: optional<string>
          closedOn: optional<string>
          state: optional<string>
      CreateUnitRequest:
        fields:
          code: string
          name: string
          kindId: string
          parentId:
            type: optional<string>
            docs: The parent unit (same institution); omit for a top-level unit.
          sortOrder: optional<integer>
      UpdateUnitRequest:
        docs: Update name/kind/sort order/status. code and institution are immutable.
        fields:
          name: optional<string>
          kindId: optional<string>
          status: optional<string>
          sortOrder: optional<integer>
      ReparentUnitRequest:
        docs: Move a unit under a new parent (same institution), recomputing the closure. Cycle-guarded.
        fields:
          parentId:
            type: optional<string>
            docs: The new parent unit; null makes the unit top-level.
      CreateBuildingRequest:
        fields:
          code: string
          name: string
          kind: string
          unitId: optional<string>
          locationId: optional<string>
      UpdateBuildingRequest:
        fields:
          name: optional<string>
          kind: optional<string>
          unitId: optional<string>
          locationId: optional<string>
      CreateGroupRequest:
        fields:
          code: string
          name: string
          admissionYear: optional<integer>
      UpdateGroupRequest:
        fields:
          name: optional<string>
          admissionYear: optional<integer>
          status: optional<string>
      CreatePositionRequest:
        docs: Create a billet (vacant) owned by the institution or one of its units.
        fields:
          code: string
          title: string
          unitId: optional<string>
          sortOrder: optional<integer>
      UpdatePositionRequest:
        fields:
          title: optional<string>
          sortOrder: optional<integer>
      FillPositionRequest:
        fields:
          personId: string
          effectiveFrom: optional<datetime>
      EndAppointmentRequest:
        fields:
          effectiveTo: optional<datetime>
      UpsertEnrollmentRequest:
        docs: Create or update a person's enrollment. On create, omit nothing required; on update, target by id.
        fields:
          institutionId: string
          unitId: optional<string>
          groupId: optional<string>
          programId: optional<string>
          degreeLevelId: optional<string>
          fieldOfStudy: optional<string>
          studentNumber: optional<string>
          status: optional<string>
          qualification: optional<string>
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
      UpsertDormitoryStayRequest:
        fields:
          buildingId: string
          room: optional<string>
          status: optional<string>
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
    errors:
      InstitutionNotFound:
        namespace: Education
        code: NOT_FOUND
        safe-args:
          institutionId: string
      UnitNotFound:
        namespace: Education
        code: NOT_FOUND
        safe-args:
          unitId: string
      BuildingNotFound:
        namespace: Education
        code: NOT_FOUND
        safe-args:
          buildingId: string
      GroupNotFound:
        namespace: Education
        code: NOT_FOUND
        safe-args:
          groupId: string
      PositionNotFound:
        namespace: Education
        code: NOT_FOUND
        safe-args:
          positionId: string
      EnrollmentNotFound:
        namespace: Education
        code: NOT_FOUND
        safe-args:
          enrollmentId: string
      DormitoryStayNotFound:
        namespace: Education
        code: NOT_FOUND
        safe-args:
          stayId: string
      Conflict:
        docs: A code already exists in the parent scope (institution/unit).
        namespace: Education
        code: CONFLICT
        safe-args:
          reason: string
      Invalid:
        docs: A malformed request or an unknown referenced entity (kind/country/parent/person/…).
        namespace: Education
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      UnitCycleDetected:
        docs: Reparenting would create a cycle in the structure tree.
        namespace: Education
        code: FAILED_PRECONDITION
        safe-args:
          unitId: string
      PositionAlreadyFilled:
        docs: The position already has an active holder (one billet, one holder).
        namespace: Education
        code: FAILED_PRECONDITION
        safe-args:
          positionId: string
      InUse:
        docs: The entity is still referenced and cannot be removed (e.g. a unit with children).
        namespace: Education
        code: FAILED_PRECONDITION
        safe-args:
          reason: string
      LifecycleConflict:
        docs: The entity is not in a state that allows the transition (e.g. ending an ended appointment).
        namespace: Education
        code: FAILED_PRECONDITION
        safe-args:
          reason: string
services:
  EducationService:
    name: Education Service
    package: oikumenea.education
    base-path: /education/v1
    default-auth: header
    docs: |
      Institutions, their structure tree (+ closure), buildings, groups, positions/appointments, and the
      person bindings (enrollments, dorm stays). Reads gate on `education.read`; structure writes on
      `education.manage`; position/appointment writes on `education.position.manage`; person-binding
      writes on `education.enrollment.manage`; catalog-kind writes on `education.catalog.manage`. Writes
      are audited in-process (D-Audit).
    endpoints:
      # ---- catalogs ----
      listInstitutionKinds:
        http: GET /institution-kinds
        returns: InstitutionKindList
      upsertInstitutionKind:
        http: PUT /institution-kinds
        docs: Create or update (by code) an institution-kind catalog entry.
        args:
          request: UpsertCatalogKindRequest
        returns: InstitutionKind
      listUnitKinds:
        http: GET /unit-kinds
        docs: The `university` domain's unit-kind catalog (owned by the tenant service — M41).
        returns: UnitKindList
      listDegreeLevels:
        http: GET /degree-levels
        returns: DegreeLevelList
      # ---- institutions ----
      createInstitution:
        http: POST /institutions
        args:
          request: CreateInstitutionRequest
        returns: Institution
      listInstitutions:
        http: GET /institutions
        docs: |
          List institutions, token-paginated, optionally filtered by the facet vocabulary (M58 ticket
          5 / D-ObjectFacets). Shadow-gated: an institution IS a `university`-domain tenant
          organization (M41 / D-UnifiedOrgGraph), so it carries that organization's public/shadow bit
          and is trimmed by the same rule `listOrganizations` applies. Gated by education.read.

          Every filter arg here is also an arg of `institutionStats`, and a chart segment's key is a
          usable value for the arg it came from — that is what makes a dashboard and a list two
          renderings of one request state.
        args:
          query:
            type: optional<string>
            param-type: query
            docs: Optional case-insensitive code/name filter.
          kindId:
            type: optional<string>
            param-type: query
            docs: Facet filter — institution-kind RID (`oikumenea.education_institution_kinds`).
          countryId:
            type: optional<string>
            param-type: query
            docs: Facet filter — country RID (D-Geo). Nullable column; setting it excludes institutions with no country.
          foundedOnFrom:
            type: optional<string>
            param-type: query
            docs: Facet filter — INCLUSIVE lower bound on the founding date (YYYY-MM-DD). Excludes institutions with no founding date.
          foundedOnTo:
            type: optional<string>
            param-type: query
            docs: Facet filter — INCLUSIVE upper bound on the founding date (YYYY-MM-DD).
          state:
            type: optional<string>
            param-type: query
            docs: Facet filter — `active` | `closed` | `merged`. The INSTITUTION's lifecycle, not the owning organization's.
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: InstitutionPage
      institutionStats:
        http: GET /stats/institutions
        docs: |
          Facet distributions over the institution registry — the dashboard half of the institution
          facet vocabulary (M58 ticket 5 / D-ObjectFacets). Takes exactly the filter args
          `listInstitutions` takes, minus paging, so a dashboard and a list are two renderings of one
          request state.

          The path is `/stats/institutions` rather than `/institutions/stats` because the server's
          router rejects a literal path segment that is a sibling of `{institutionId}` — see the
          route-conflict guard in `internal/platform/transport`.
        args:
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`kindId,state`). Omitted or empty =
              every facet the caller may read; an explicit list of nothing (`facets=,`) returns
              `totalCount` alone. An undeclared facet key is an Education:Invalid.
          query:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listInstitutions`.
          kindId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listInstitutions`.
          countryId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listInstitutions`.
          foundedOnFrom:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listInstitutions`.
          foundedOnTo:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listInstitutions`.
          state:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listInstitutions`.
        returns: InstitutionStats
      getInstitution:
        http: GET /institutions/{institutionId}
        args:
          institutionId: { type: string, param-type: path }
        returns: Institution
      updateInstitution:
        http: PUT /institutions/{institutionId}
        args:
          institutionId: { type: string, param-type: path }
          request: UpdateInstitutionRequest
        returns: Institution
      deleteInstitution:
        http: DELETE /institutions/{institutionId}
        args:
          institutionId: { type: string, param-type: path }
      # ---- units (structure tree) ----
      createUnit:
        http: POST /institutions/{institutionId}/units
        args:
          institutionId: { type: string, param-type: path }
          request: CreateUnitRequest
        returns: EducationUnit
      listUnits:
        http: GET /institutions/{institutionId}/units
        docs: All active units of an institution with their closure depth from the nearest root.
        args:
          institutionId: { type: string, param-type: path }
        returns: EducationUnitList
      getUnit:
        http: GET /units/{unitId}
        args:
          unitId: { type: string, param-type: path }
        returns: EducationUnit
      updateUnit:
        http: PUT /units/{unitId}
        args:
          unitId: { type: string, param-type: path }
          request: UpdateUnitRequest
        returns: EducationUnit
      reparentUnit:
        http: POST /units/{unitId}/reparent
        docs: Move a unit under a new parent, recomputing the closure. Returns Education:UnitCycleDetected on a cycle.
        args:
          unitId: { type: string, param-type: path }
          request: ReparentUnitRequest
        returns: EducationUnit
      # ---- buildings ----
      createBuilding:
        http: POST /institutions/{institutionId}/buildings
        args:
          institutionId: { type: string, param-type: path }
          request: CreateBuildingRequest
        returns: Building
      listBuildings:
        http: GET /institutions/{institutionId}/buildings
        args:
          institutionId: { type: string, param-type: path }
        returns: BuildingList
      getBuilding:
        http: GET /buildings/{buildingId}
        args:
          buildingId: { type: string, param-type: path }
        returns: Building
      updateBuilding:
        http: PUT /buildings/{buildingId}
        args:
          buildingId: { type: string, param-type: path }
          request: UpdateBuildingRequest
        returns: Building
      deleteBuilding:
        http: DELETE /buildings/{buildingId}
        args:
          buildingId: { type: string, param-type: path }
      # ---- groups ----
      createGroup:
        http: POST /units/{unitId}/groups
        args:
          unitId: { type: string, param-type: path }
          request: CreateGroupRequest
        returns: Group
      listGroups:
        http: GET /units/{unitId}/groups
        args:
          unitId: { type: string, param-type: path }
        returns: GroupList
      getGroup:
        http: GET /groups/{groupId}
        args:
          groupId: { type: string, param-type: path }
        returns: Group
      updateGroup:
        http: PUT /groups/{groupId}
        args:
          groupId: { type: string, param-type: path }
          request: UpdateGroupRequest
        returns: Group
      deleteGroup:
        http: DELETE /groups/{groupId}
        args:
          groupId: { type: string, param-type: path }
      # ---- positions & appointments ----
      createPosition:
        http: POST /institutions/{institutionId}/positions
        args:
          institutionId: { type: string, param-type: path }
          request: CreatePositionRequest
        returns: EducationPosition
      listPositions:
        http: GET /institutions/{institutionId}/positions
        args:
          institutionId: { type: string, param-type: path }
          state:
            type: optional<string>
            param-type: query
            docs: Filter — vacant | filled. Omit for all active.
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: PositionPage
      getPosition:
        http: GET /positions/{positionId}
        args:
          positionId: { type: string, param-type: path }
        returns: EducationPosition
      updatePosition:
        http: PUT /positions/{positionId}
        args:
          positionId: { type: string, param-type: path }
          request: UpdatePositionRequest
        returns: EducationPosition
      abolishPosition:
        http: POST /positions/{positionId}/abolish
        args:
          positionId: { type: string, param-type: path }
        returns: EducationPosition
      fillPosition:
        http: POST /positions/{positionId}/fill
        docs: Fill a vacant position. Returns Education:PositionAlreadyFilled if already filled.
        args:
          positionId: { type: string, param-type: path }
          request: FillPositionRequest
        returns: Appointment
      endAppointment:
        http: POST /appointments/{appointmentId}/end
        args:
          appointmentId: { type: string, param-type: path }
          request: EndAppointmentRequest
        returns: Appointment
      # ---- person bindings ----
      listPersonAppointments:
        http: GET /persons/{personId}/appointments
        docs: Read-only list of the education positions a person holds, enriched with title + institution.
        args:
          personId: { type: string, param-type: path }
        returns: PersonAppointmentList
      listEnrollments:
        http: GET /persons/{personId}/enrollments
        args:
          personId: { type: string, param-type: path }
        returns: EnrollmentList
      createEnrollment:
        http: POST /persons/{personId}/enrollments
        args:
          personId: { type: string, param-type: path }
          request: UpsertEnrollmentRequest
        returns: Enrollment
      updateEnrollment:
        http: PUT /persons/{personId}/enrollments/{enrollmentId}
        args:
          personId: { type: string, param-type: path }
          enrollmentId: { type: string, param-type: path }
          request: UpsertEnrollmentRequest
        returns: Enrollment
      deleteEnrollment:
        http: DELETE /persons/{personId}/enrollments/{enrollmentId}
        args:
          personId: { type: string, param-type: path }
          enrollmentId: { type: string, param-type: path }
      listDormitoryStays:
        http: GET /persons/{personId}/dormitory-stays
        args:
          personId: { type: string, param-type: path }
        returns: DormitoryStayList
      createDormitoryStay:
        http: POST /persons/{personId}/dormitory-stays
        args:
          personId: { type: string, param-type: path }
          request: UpsertDormitoryStayRequest
        returns: DormitoryStay
      updateDormitoryStay:
        http: PUT /persons/{personId}/dormitory-stays/{stayId}
        args:
          personId: { type: string, param-type: path }
          stayId: { type: string, param-type: path }
          request: UpsertDormitoryStayRequest
        returns: DormitoryStay
      deleteDormitoryStay:
        http: DELETE /persons/{personId}/dormitory-stays/{stayId}
        args:
          personId: { type: string, param-type: path }
          stayId: { type: string, param-type: path }
