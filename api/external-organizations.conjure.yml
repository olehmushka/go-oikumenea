# External-organizations module API (M30 / D-ExternalOrgs). A registry of external organizations a
# person is tied to but which the deploying org neither owns nor commands — political parties,
# government bodies, foreign military formations, NGOs, lobbying registrants (docs/modules/
# external-organizations.md). It is the node-space the M33 institutional-tie edges point at when the
# org side is neither a tenant unit nor an M21 company. Catalog-typed, provenance-tagged, hermenea-fed.
#
# RID-bearing fields are typed `string` (the canonical RID text): Conjure reserves `rid` as a built-in
# primitive, so a type named `Rid` cannot be used. Translatable labels (kind/org names) are returned as
# a `locale -> text` map assembled from the i18n store (D-i18n: all locales in every response, no
# negotiation); create/update requests carry the default-locale value as a plain `string`. External
# orgs carry no unit scope of their own (external reference data), so reads gate on `externalorg.read`
# and catalog + org writes on the instance-scope `externalorg.manage` — both satisfied anywhere via the
# PEP. Writes are audited in-process under a `system` actor (D-Audit). Rows carry the D-OverlayFoundation
# (M29) provisional/resolved status + the source/confidence/as_of attribution column-set. Generated Go
# lands in internal/conjure, never hand-edited.
types:
  definitions:
    default-package: oikumenea.externalorg
    objects:
      # ---- reference catalog ----
      ExternalOrgKind:
        docs: An external-org kind (party/government_body/military/ngo/registrant/other).
        fields:
          id: string
          code: string
          name:
            type: map<string, string>
            docs: Default-locale fallback + i18n translations.
          status: string
          sortOrder: optional<integer>
      # ---- object ----
      ExternalOrganization:
        docs: |
          An external organization at registry grade. Soft-deleted, not destroyed. The RID is the
          external handle. Carries the D-OverlayFoundation provisional/resolved status + attribution.
        fields:
          id: string
          kindId: string
          kindLabel:
            type: optional<string>
            docs: Best-effort default-locale kind name.
          name:
            type: map<string, string>
            docs: Default-locale fallback + i18n translations.
          code: optional<string>
          countryId: optional<string>
          countryLabel: optional<string>
          wikidataId:
            type: optional<string>
            docs: Optional Wikidata Q-id concordance (the hermenea import natural key).
          status:
            type: string
            docs: One of provisional | resolved.
          source:
            type: string
            docs: One of self_declared | operator_verified | imported (attribution).
          confidence:
            type: string
            docs: One of confirmed | probable | possible (attribution).
          asOf: optional<datetime>
          createdAt: datetime
          updatedAt: datetime
      # ---- pages / lists ----
      ExternalOrgPage:
        fields:
          orgs: list<ExternalOrganization>
          nextPageToken: optional<string>
      ExternalOrgKindList:
        fields:
          kinds: list<ExternalOrgKind>
      # ---- facet distributions (M58 / D-ObjectFacets) ----
      FacetBucket:
        docs: |
          One bucket of a facet distribution (M58 / D-ObjectFacets).

          `key` is the bucket's stable, locale-agnostic identity — an enum value, a `YYYY-MM` month,
          or a RID for a `ref` facet — and is exactly what you pass back as the corresponding query
          filter, which is what makes a chart segment and a filter the same act. Two synthetic keys
          never name a real value: `(unknown)` is the NULL bucket (mandatory for a nullable column,
          so the gap is visible rather than dropped) and `(other)` is a top-N facet's collapsed tail;
          neither is a usable filter value.

          `label` carries a display name as a locale → text map (D-i18n) and is present only for
          `ref` buckets, whose keys are RIDs. Best effort — an id with no resolvable name simply
          carries no label.
        fields:
          key: string
          label: optional<map<string, string>>
          count: integer
      FacetDistribution:
        docs: |
          One facet's buckets, in chart order — for an enum, the declared CHECK-set order with
          zero-count buckets included so a chart's shape is stable across filterings; for the asOf
          histogram, ascending by month; for a ref facet, descending by count with
          `(other)`/`(unknown)` last.
        fields:
          facet: string
          buckets: list<FacetBucket>
      ExternalOrgStats:
        docs: |
          Facet distributions over the SAME set `listExternalOrgs` returns under the same filters
          (M58 / D-ObjectFacets): `totalCount` is what exhaustively paging that endpoint would yield,
          not an estimate and not a page count.

          Every facet here partitions the result set — each counted row lands in exactly one bucket
          of each distribution, so a distribution's counts sum to `totalCount`.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
      # ---- request bodies ----
      UpsertExternalOrgKindRequest:
        docs: Create/update (by code) an external-org-kind catalog entry. name is the default-locale fallback.
        fields:
          code: string
          name: string
          sortOrder: optional<integer>
      CreateExternalOrgRequest:
        docs: |
          Register an external organization. status defaults to resolved; pass provisional to create a
          stub awaiting merge. source/confidence default to operator_verified/possible when omitted.
        fields:
          kindId: string
          name: string
          code: optional<string>
          countryId: optional<string>
          wikidataId: optional<string>
          status: optional<string>
          source: optional<string>
          confidence: optional<string>
          asOf: optional<datetime>
      UpdateExternalOrgRequest:
        docs: Update kind/name/code/country/wikidata/status/attribution; omitted fields are unchanged.
        fields:
          kindId: optional<string>
          name: optional<string>
          code: optional<string>
          countryId: optional<string>
          wikidataId: optional<string>
          status: optional<string>
          source: optional<string>
          confidence: optional<string>
          asOf: optional<datetime>
      MergeExternalOrgRequest:
        docs: |
          Resolve a provisional stub into a canonical organization. The provisional org (the path id) is
          tombstoned; the canonical (intoOrgId) survives. confidence is recorded on the merge action.
        fields:
          intoOrgId: string
          confidence: optional<string>
    errors:
      ExternalOrgNotFound:
        namespace: ExternalOrg
        code: NOT_FOUND
        safe-args:
          orgId: string
      Conflict:
        docs: A code/wikidata-id already exists among active rows.
        namespace: ExternalOrg
        code: CONFLICT
        safe-args:
          reason: string
      Invalid:
        docs: A malformed request or an unknown referenced entity (kind/country), or an invalid merge.
        namespace: ExternalOrg
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
services:
  ExternalOrganizationService:
    name: External Organization Service
    package: oikumenea.externalorg
    base-path: /external-orgs/v1
    default-auth: header
    docs: |
      An external-organizations registry: the kind catalog + the external-organization node-space, with
      provisional/resolved resolution. Reads gate on `externalorg.read`; catalog + org writes on the
      instance-scope `externalorg.manage`. Writes are audited in-process (D-Audit).
    endpoints:
      # ---- catalog ----
      listExternalOrgKinds:
        http: GET /external-org-kinds
        returns: ExternalOrgKindList
      upsertExternalOrgKind:
        http: PUT /external-org-kinds
        args:
          request: UpsertExternalOrgKindRequest
        returns: ExternalOrgKind
      # ---- organizations ----
      listExternalOrgs:
        http: GET /external-orgs
        args:
          query:
            type: optional<string>
            param-type: query
            docs: Optional case-insensitive name/code filter.
          kind:
            type: optional<string>
            param-type: query
            docs: |
              Optional kind filter, accepting EITHER the kind's code or its RID. It began as a
              code-only filter; the RID form was added with the M58 facet vocabulary, because a `kind`
              chart segment's bucket key is a `kind_id` RID and a bucket key must remain a usable
              filter value. Both spellings select the same rows.
          country:
            type: optional<string>
            param-type: query
            docs: Optional country RID filter.
          status:
            type: optional<string>
            param-type: query
            docs: Optional status filter (provisional | resolved).
          source:
            type: optional<string>
            param-type: query
            docs: |
              Optional attribution-source filter (self_declared | operator_verified | imported) —
              the D-OverlayFoundation attribution column-set.
          confidence:
            type: optional<string>
            param-type: query
            docs: Optional attribution-confidence filter (confirmed | probable | possible).
          asOfFrom:
            type: optional<datetime>
            param-type: query
            docs: Optional lower bound (inclusive) on asOf, when the asserted value was observed.
          asOfTo:
            type: optional<datetime>
            param-type: query
            docs: Optional upper bound (inclusive) on asOf.
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: ExternalOrgPage
      externalOrgStats:
        http: GET /stats/external-orgs
        docs: |
          Facet distributions over the registry — the dashboard half of the facet vocabulary (M58 /
          D-ObjectFacets). Takes exactly the filter args `listExternalOrgs` takes (minus paging) plus
          an optional `facets` CSV, so a dashboard and a list are two renderings of ONE request state
          and a chart segment is a link to the same URL with one more filter applied.

          `totalCount` equals the number of rows exhaustively paging `listExternalOrgs` with these
          same filters would return. One round-trip serves the whole dashboard.

          ONE aggregate arm, with no subject and no scoped twin — but for the OPPOSITE reason to the
          audit ledger's single arm. `external_organizations` is a flat instance-global reference
          table with no row-level security and no unit reach: `externalorg.read` held anywhere is the
          whole visibility decision, so there is nothing for a second arm to narrow.

          The path is `/stats/external-orgs` rather than `/external-orgs/stats` because the server's
          router rejects a literal path segment that is a sibling of `{orgId}`.
        args:
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`kind,status,source`). Omitted or empty
              = every facet the caller may read; an explicit list of nothing (`facets=,`) returns
              `totalCount` alone. An undeclared facet key is an ExternalOrg:Invalid.
          query:
            type: optional<string>
            param-type: query
            docs: Optional case-insensitive name/code filter, as on the list.
          kind:
            type: optional<string>
            param-type: query
            docs: Optional kind filter (code or RID), as on the list.
          country:
            type: optional<string>
            param-type: query
            docs: Optional country RID filter, as on the list.
          status:
            type: optional<string>
            param-type: query
            docs: Optional status filter (provisional | resolved), as on the list.
          source:
            type: optional<string>
            param-type: query
            docs: Optional attribution-source filter, as on the list.
          confidence:
            type: optional<string>
            param-type: query
            docs: Optional attribution-confidence filter, as on the list.
          asOfFrom:
            type: optional<datetime>
            param-type: query
            docs: Optional lower bound (inclusive) on asOf, as on the list.
          asOfTo:
            type: optional<datetime>
            param-type: query
            docs: Optional upper bound (inclusive) on asOf, as on the list.
        returns: ExternalOrgStats
      createExternalOrg:
        http: POST /external-orgs
        args:
          request: CreateExternalOrgRequest
        returns: ExternalOrganization
      getExternalOrg:
        http: GET /external-orgs/{orgId}
        args:
          orgId: { type: string, param-type: path }
        returns: ExternalOrganization
      updateExternalOrg:
        http: PUT /external-orgs/{orgId}
        args:
          orgId: { type: string, param-type: path }
          request: UpdateExternalOrgRequest
        returns: ExternalOrganization
      deleteExternalOrg:
        http: DELETE /external-orgs/{orgId}
        args:
          orgId: { type: string, param-type: path }
      mergeExternalOrg:
        http: POST /external-orgs/{orgId}/merge
        docs: Resolve a provisional stub (orgId) into a canonical organization (intoOrgId); tombstones the stub.
        args:
          orgId: { type: string, param-type: path }
          request: MergeExternalOrgRequest
        returns: ExternalOrganization
