# Identity-federation module API (M8). The external-IdP seam (docs/modules/identity-federation.md).
# go-oikumenea does NOT authenticate (L-AuthzOnly): it stores no credentials and issues no tokens. It
# owns the optional login ACCOUNT (an attachment to a person, <=1 active) and the verified
# (issuer, subject) EXTERNAL IDENTITIES that federate to it. Inbound-token validation (OIDC discovery
# + JWKS) is MIDDLEWARE, not an endpoint — there is intentionally no login/token-issuing operation.
#
# RID-bearing fields are typed `string` (the composed URN RID): Conjure reserves `rid` as a built-in
# primitive whose `ri.` format is NOT our `urn:oikumenea:` RID. Account/identity management gates on
# the `person.*` permissions of the LINKED person (an account is an attachment to a person, so it
# inherits that person's authorization surface); /whoami is authenticated-only (the middleware is the
# authentication boundary, not an authorization check). Writes are recorded in the audit log in-process
# (D-Audit). Generated Go lands in internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: oikumenea.identityfederation
    objects:
      Account:
        docs: |
          An optional login attachment to exactly one person (Object Account). A person may have zero
          accounts (roster-only) or one active account. `identities` are the linked login points and is
          populated by getAccount/createAccount; it is empty in contexts that do not load it.
        fields:
          id:
            type: string
            docs: The account's URN RID (carried as a plain string).
          personId:
            type: string
            docs: The URN RID of the person this account attaches to.
          email:
            type: optional<string>
            docs: The IdP-asserted email, if any; unique among active accounts when present.
          status:
            type: string
            docs: One of active | disabled (disable is a reversible login block).
          identities:
            type: list<ExternalIdentity>
            docs: The external identities (login points) federated to this account.
          createdAt: datetime
          updatedAt: datetime
      ExternalIdentity:
        docs: |
          A verified (issuer, subject) login point federating to one account (Object External
          identity). Globally unique; immutable once created and removed by unlink. No token columns —
          access/refresh tokens are never persisted.
        fields:
          id:
            type: string
            docs: The external identity's URN RID (carried as a plain string).
          accountId:
            type: string
            docs: The URN RID of the account this identity federates to.
          issuer:
            type: string
            docs: The IdP `iss` (an allowed issuer).
          subject:
            type: string
            docs: The IdP `sub` — a pseudonymous identifier for the person.
          createdAt: datetime
      Whoami:
        docs: |
          The caller's own resolved PDP context — the person (and optional account) the inbound token
          mapped to. Produced from the request context the validation middleware attached.
        fields:
          personId:
            type: string
            docs: The URN RID of the resolved person (the PDP subject).
          accountId:
            type: optional<string>
            docs: The URN RID of the resolved account; absent only on out-of-band/system contexts.
          email:
            type: optional<string>
            docs: The account's IdP-asserted email, if any.
      LinkIdentityRequest:
        docs: Link a verified (issuer, subject) login point to an account.
        fields:
          issuer: string
          subject: string
      IssuerOption:
        docs: |
          One IdP issuer accepted by this instance (from install config), offered to binding UIs so an
          operator picks an issuer rather than typing it. PUBLIC fields only — verification secrets
          (HS256 keys) are never exposed. An external identity's `issuer` must match one of these for a
          token from it to ever validate.
        fields:
          issuer:
            type: string
            docs: The `iss` value (also the OIDC discovery base URL).
          audience:
            type: optional<string>
            docs: |
              The expected `aud`, if the instance pins one. When the issuer accepts several (one per
              client of this deployment) this carries the first; `audiences` carries the full set.
          audiences:
            type: list<string>
            docs: |
              Every `aud` this instance accepts from the issuer. A token validates when its own
              audience intersects this set. Non-empty for every `oidc` issuer (enforced at boot).
          label:
            type: optional<string>
            docs: |
              Operator-supplied display name for the issuer ("Google", "Corporate Entra ID"), so a
              binding UI can offer a readable choice instead of a bare discovery URL. Cosmetic only —
              never an identity or authorization input.
          type:
            type: string
            docs: One of oidc | hs256 (hs256 is local/dev only).
      CreateAccountRequest:
        docs: |
          Create an account for a person, optionally linking its first external identity in the same
          operation. The first identity on a new account is always permitted (the linking cap applies
          only to ADDITIONAL identities).
        fields:
          personId: string
          email:
            type: optional<string>
            docs: The IdP-asserted email, if known.
          identity:
            type: optional<LinkIdentityRequest>
            docs: The first login point to link; omit to create a login-less account shell.
      ServicePrincipal:
        docs: |
          A MACHINE subject (M51 / D-ServiceIdentities) — a facade with standing of its own, or a
          connector. It authenticates through the same external IdP and the same middleware as a
          person, using the OAuth2 client-credentials grant, and is keyed by the same
          (issuer, subject) pair as an ExternalIdentity: a given pair is a person identity XOR a
          principal, never both.

          A principal holds NO role assignment and NO unit reach; its authority is the flat
          per-principal grants owned by AuthorizationService. Registering one creates no credential —
          the IdP owns the client secret (L-AuthzOnly holds).
        fields:
          id:
            type: string
            docs: The principal's URN RID (carried as a plain string).
          code:
            type: string
            docs: Stable, locale-agnostic machine name (D-Code) — what audit rows and operators reference.
          name: string
          description: optional<string>
          issuer:
            type: string
            docs: The IdP `iss` of the client-credentials token.
          subject:
            type: string
            docs: The IdP `sub` of the client-credentials token. Immutable after registration.
          clientId:
            type: optional<string>
            docs: |
              Display label from the token's `azp`/`client_id` claim, so an operator can tell which IdP
              client this is. NEVER an authorization input — the identity key is (issuer, subject).
          status:
            type: string
            docs: One of active | disabled. A disabled principal fails resolution, so its tokens stop working at once.
          createdAt: datetime
          updatedAt: datetime
      RegisterServicePrincipalRequest:
        fields:
          code: string
          name: string
          description: optional<string>
          issuer:
            type: string
            docs: The IdP `iss` the machine's tokens carry.
          subject:
            type: string
            docs: |
              The IdP `sub` the machine's tokens carry. For Keycloak this is the service-account user
              id; a rejected unknown token logs its issuer/subject so it can be copied from there.
          clientId: optional<string>
      UpdateServicePrincipalRequest:
        docs: |
          Mutable display fields only. (issuer, subject) is the identity key the middleware resolves
          on and is immutable — re-pointing it would silently transfer a machine's authority to a
          different IdP client. Register a new principal and disable the old one instead.
        fields:
          name: string
          description: optional<string>
          clientId: optional<string>
      ServicePrincipalPage:
        fields:
          principals: list<ServicePrincipal>
          nextPageToken: optional<string>
      LoginEvent:
        docs: |
          One deduped login/IP occurrence for an account (M37 / D-LoginSecurityLog): first-party
          security telemetry from the token-validation seam, `pii:contact`, retention-bounded. Repeat
          occurrences from the same (context, ip) within the dedup window collapse into one row —
          `occurrenceCount` + `lastSeenAt` carry the recency. The `resolved*` / `isVpn` / `isTor`
          fields are the IP-intelligence overlay and stay absent until a resolver ships.
        fields:
          id: string
          accountId: string
          context:
            type: string
            docs: One of login | activity | registration (registration = the JIT link-on-match).
          ip: string
          firstSeenAt: datetime
          lastSeenAt: datetime
          occurrenceCount: integer
          resolvedCountry:
            type: optional<string>
            docs: ISO 3166-1 alpha-2 when resolved.
          resolvedIsp: optional<string>
          isVpn: optional<boolean>
          isTor: optional<boolean>
          userAgent: optional<string>
      LoginEventPage:
        fields:
          events: list<LoginEvent>
          nextPageToken: optional<string>
    errors:
      AccountNotFound:
        namespace: Account
        code: NOT_FOUND
        safe-args:
          accountId: string
      AccountConflict:
        docs: The person already has an active account, or the email is already taken.
        namespace: Account
        code: CONFLICT
        safe-args:
          reason: string
      AccountInvalid:
        docs: The request is malformed or references an unknown person.
        namespace: Account
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      IdentityNotFound:
        namespace: Identity
        code: NOT_FOUND
        safe-args:
          identityId: string
      IdentityConflict:
        docs: |
          The (issuer, subject) is already linked to an account, or identity linking is disabled
          (account.identity_linking.enabled = false) and the account already has an active identity.
        namespace: Identity
        code: CONFLICT
        safe-args:
          reason: string
      ServicePrincipalNotFound:
        namespace: ServicePrincipal
        code: NOT_FOUND
        safe-args:
          principalId: string
      ServicePrincipalConflict:
        docs: |
          The code is taken, or the (issuer, subject) already names a principal OR a person external
          identity — an inbound token must resolve to exactly one subject.
        namespace: ServicePrincipal
        code: CONFLICT
        safe-args:
          reason: string
      ServicePrincipalInvalid:
        docs: The request is malformed, or attempts to change the immutable (issuer, subject) key.
        namespace: ServicePrincipal
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      IdentityInvalid:
        docs: The identity request is malformed (empty issuer/subject).
        namespace: Identity
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
services:
  IdentityFederationService:
    name: Identity Federation Service
    package: oikumenea.identityfederation
    base-path: /identity/v1
    default-auth: header
    docs: |
      Optional login accounts + the external identities that federate to them. Account/identity
      management gates on the `person.*` permissions of the linked person; /whoami is
      authenticated-only. Token validation itself is middleware, not an endpoint. Writes are audited
      in-process (D-Audit).
    endpoints:
      getAccount:
        http: GET /accounts/{accountId}
        docs: Read an account with its linked identities. Gates on `person.read` of the linked person.
        args:
          accountId:
            type: string
            param-type: path
        returns: Account
      listIssuers:
        http: GET /issuers
        docs: |
          List the IdP issuers configured for this instance (public fields only — no secrets), for
          binding UIs to offer as a choice when linking an external identity. Gates on `person.read`.
        returns: list<IssuerOption>
      getAccountByPerson:
        http: GET /persons/{personId}/account
        docs: |
          Read the person's single active account (with its linked identities), or
          Account:AccountNotFound when the person is roster-only (has no account). Gates on
          `person.read`. The console uses this to surface a person's login/account state.
        args:
          personId:
            type: string
            param-type: path
        returns: Account
      createAccount:
        http: POST /accounts
        docs: |
          Create an account for a person, optionally linking its first identity. Gates on
          `person.update`. Returns Account:AccountConflict if the person already has an active
          account, Identity:IdentityConflict if the initial (issuer, subject) is already linked.
        args:
          request: CreateAccountRequest
        returns: Account
      disableAccount:
        http: POST /accounts/{accountId}/disable
        docs: Disable login on an account (reversible). Gates on `person.update`.
        args:
          accountId:
            type: string
            param-type: path
        returns: Account
      linkIdentity:
        http: POST /accounts/{accountId}/identities
        docs: |
          Link an additional external identity (login point) to an account. Gates on `person.update`.
          Returns Identity:IdentityConflict when linking is disabled and the account already has an
          active identity, or when the (issuer, subject) is already linked elsewhere.
        args:
          accountId:
            type: string
            param-type: path
          request: LinkIdentityRequest
        returns: ExternalIdentity
      unlinkIdentity:
        http: DELETE /accounts/{accountId}/identities/{identityId}
        docs: Unlink an external identity from an account (hard removal). Gates on `person.update`.
        args:
          accountId:
            type: string
            param-type: path
          identityId:
            type: string
            param-type: path
      whoami:
        http: GET /whoami
        docs: Resolve the caller's own PDP context (person + account) from the validated inbound token.
        returns: Whoami
      registerServicePrincipal:
        http: POST /service-principals
        docs: |
          Register a machine subject (M51 / D-ServiceIdentities). Instance-plane act gated on
          `service-principal.manage`. Returns ServicePrincipal:ServicePrincipalConflict when the code
          or the (issuer, subject) is taken — including when that pair is already a person's external
          identity. Creates no credential: the external IdP owns the client secret.
        args:
          request: RegisterServicePrincipalRequest
        returns: ServicePrincipal
      listServicePrincipals:
        http: GET /service-principals
        docs: Keyset page over the registry. Gates on `service-principal.read`.
        args:
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: ServicePrincipalPage
      getServicePrincipal:
        http: GET /service-principals/{principalId}
        docs: Read one machine subject. Gates on `service-principal.read`.
        args:
          principalId:
            type: string
            param-type: path
        returns: ServicePrincipal
      updateServicePrincipal:
        http: PUT /service-principals/{principalId}
        docs: |
          Update the display fields. Gates on `service-principal.manage`. The (issuer, subject) key is
          immutable — see UpdateServicePrincipalRequest.
        args:
          principalId:
            type: string
            param-type: path
          request: UpdateServicePrincipalRequest
        returns: ServicePrincipal
      disableServicePrincipal:
        http: POST /service-principals/{principalId}/disable
        docs: |
          Reversible kill switch: a disabled principal fails token resolution immediately, while the
          audit rows naming it stay intact. Gates on `service-principal.manage`.
        args:
          principalId:
            type: string
            param-type: path
        returns: ServicePrincipal
      enableServicePrincipal:
        http: POST /service-principals/{principalId}/enable
        docs: Re-enable a disabled machine subject. Gates on `service-principal.manage`.
        args:
          principalId:
            type: string
            param-type: path
        returns: ServicePrincipal
      listAccountLoginEvents:
        http: GET /accounts/{accountId}/login-events
        docs: |
          Page an account's login/IP security history, newest-first (M37 / D-LoginSecurityLog). Gates
          on the instance-scope `account.security-log.read` (the data is pii:contact). `pageToken` is
          the opaque keyset cursor from the previous page.
        args:
          accountId:
            type: string
            param-type: path
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: LoginEventPage
