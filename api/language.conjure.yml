# Language module API (M18 / D-Languages). A read-only lookup over the language service's Glottolog
# languoid forest + ISO-15924 writing-system registry, so clients can resolve a language/script to its
# RID and browse the genealogy. The catalog is WRITTEN by the hermenea import pipeline (language-scheme
# / language-scripts), not here; this service is read-only.
#
# RID-bearing fields are typed `string` (the canonical uuid RID): Conjure reserves `rid` as a built-in
# primitive whose `ri.` format is NOT our RID, so a type named `Rid`/`rid` cannot be used. Generated Go
# lands in internal/conjure and is never hand-edited. Reads are gated by `language.read`.
types:
  definitions:
    default-package: oikumenea.language
    objects:
      Languoid:
        docs: A node in the Glottolog forest. `id` is the RID (the reference key); `code` is the stable glottocode; `name` is the locale->text display map.
        fields:
          id:
            type: string
            docs: The languoid's RID (language service); what person/unit/locale links reference.
          code:
            type: string
            docs: Glottocode (8-char), the stable, locale-agnostic lookup key (e.g. stan1293).
          level:
            type: string
            docs: family | language | dialect.
          name:
            type: map<string, string>
            docs: locale->text display name (all enabled locales; default-locale `name` column + i18n store).
          parentId:
            type: optional<string>
            docs: The RID of the immediate parent languoid (absent for a top-level family / isolate).
          hasChildren:
            type: boolean
            docs: Whether this languoid has non-dialect children (family/language); lets a tree browser show an expand affordance only on expandable nodes.
          familyCode:
            type: optional<string>
            docs: The root-family glottocode (derived via the closure).
          iso6393:
            type: optional<string>
            docs: ISO 639-3 code, when the languoid has one (families/dialects usually do not).
          macroarea:
            type: optional<string>
            docs: Glottolog macroarea.
          status:
            type: string
            docs: AES endangerment (not_endangered…extinct).
      LanguoidList:
        docs: A page of languoids in code order.
        fields:
          languoids: list<Languoid>
          nextPageToken:
            type: optional<string>
            docs: |
              Keyset cursor (the last glottocode on this page) to fetch the next page; absent when the
              page is the last one. Pass it back as `pageToken`. The filters must be held constant across
              a paged sweep.
      WritingSystem:
        docs: An ISO-15924 script. `id` is the RID; `code` is the ISO-15924 lookup code.
        fields:
          id:
            type: string
            docs: The writing system's RID (language service).
          code:
            type: string
            docs: ISO-15924 code (e.g. Latn, Cyrl, Hani).
          name:
            type: map<string, string>
            docs: locale->text display name (all enabled locales; default-locale `name` column + i18n store).
          scriptType:
            type: optional<string>
            docs: logographic | syllabary | alphabet | abjad | abugida | featural.
      WritingSystemList:
        docs: The writing systems, in code order.
        fields:
          writingSystems: list<WritingSystem>
      FacetBucket:
        docs: |
          One bucket of a facet distribution (M58 / D-ObjectFacets).

          `key` is the bucket's stable, locale-agnostic identity — an enum value (`dialect`) or an open
          code (`Eurasia`, `indo1319`) — and is exactly what you pass back as the corresponding list
          filter. Two synthetic keys never name a real value: `(unknown)` is the NULL bucket and
          `(other)` a top-N facet's collapsed tail; neither is a usable filter value.

          `label` carries a display name as a locale -> text map (D-i18n) and is present only for `ref`
          buckets, whose keys are RIDs. The languoid type declares NO ref facet — a glottocode and a
          macroarea are their own labels — so no bucket here carries one.
        fields:
          key: string
          label: optional<map<string, string>>
          count: integer
      FacetDistribution:
        docs: |
          One facet's buckets, in chart order — for an enum, the declared CHECK-set order with
          zero-count buckets included so a chart's shape is stable; for a code facet, descending by
          count with `(other)`/`(unknown)` last.
        fields:
          facet: string
          buckets: list<FacetBucket>
      LanguoidStats:
        docs: |
          Facet distributions over the SAME set `listLanguages` returns under the same structural
          filters (M58 / D-ObjectFacets), so `totalCount` equals the rows exhaustively paging
          `listLanguages` would return.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
    errors:
      LanguoidNotFound:
        docs: No languoid exists with the given RID.
        namespace: Language
        code: NOT_FOUND
        safe-args:
          languoidId: string
      LanguoidInvalid:
        docs: |
          The languoid filter or facet arguments are malformed — a `level`/`status` value outside its
          CHECK set, or an undeclared facet key on `languoidStats`.
        namespace: Language
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
services:
  LanguageService:
    name: Language Service
    package: oikumenea.language
    base-path: /language/v1
    default-auth: header
    docs: |
      Read-only lookup over the Glottolog languoid forest + ISO-15924 writing systems (D-Languages).
      Reads are gated by `language.read`. Writes happen via the hermenea import pipeline, not here.
    endpoints:
      listLanguages:
        http: GET /languages
        docs: |
          List languoids in code order, optionally filtered by level, root family (glottocode), and a
          name/code substring. `pageSize` caps the page (default/clamped server-side) since the catalog
          is large (~26k); narrow with the filters.

          `pageSize` was named `limit` before M58 ticket 4. The rename is a WIRE BREAK, taken because
          the paging-arg convention (`pageSize`/`pageToken`) is a checked invariant held by every other
          faceted type, and this endpoint was the only holdout.
        args:
          level:
            type: optional<string>
            param-type: query
            docs: Filter to a level (family | language | dialect).
          family:
            type: optional<string>
            param-type: query
            docs: Filter to descendants of this root-family glottocode (via family_code).
          macroarea:
            type: optional<string>
            param-type: query
            docs: |
              Facet filter — the Glottolog macroarea, matched EXACTLY. The column is set-valued and
              stored semicolon-joined, so a languoid spanning two macroareas is filtered as
              `Africa;Eurasia` — which is also the bucket key the dashboard emits for it.
          status:
            type: optional<string>
            param-type: query
            docs: Facet filter — AES endangerment (`not_endangered` | `threatened` | `shifting` | `moribund` | `nearly_extinct` | `extinct`).
          parent:
            type: optional<string>
            param-type: query
            docs: Filter to the immediate children of this languoid RID (one tree level, for lazy expansion).
          topLevel:
            type: optional<boolean>
            param-type: query
            docs: When true, return only top-level languoids (no parent — the forest roots).
          query:
            type: optional<string>
            param-type: query
            docs: Case-insensitive substring match on name or glottocode.
          pageSize:
            type: optional<integer>
            param-type: query
            docs: Max rows to return (server clamps to a sane maximum). Named `limit` before M58 ticket 4.
          pageToken:
            type: optional<string>
            param-type: query
            docs: |
              Keyset cursor from a previous page's `nextPageToken` (a glottocode); returns the rows that
              sort after it in code order. Omit for the first page.
        returns: LanguoidList
      languoidStats:
        http: GET /stats/languages
        docs: |
          Facet distributions over the languoid registry — the dashboard half of the languoid facet
          vocabulary (M58 / D-ObjectFacets). Takes exactly the STRUCTURAL filter args `listLanguages`
          takes — `level`, `family`, `macroarea`, `status` and the free-text `query` — plus the
          `facets` CSV, so a dashboard and a list are two renderings of one request state.

          The tree-traversal args `parent`/`topLevel` have no counterpart here on purpose: they switch
          the LIST to a one-level hierarchy walk rather than describing the registry, so there is
          nothing for them to count.

          ONE arm, and no subject. The languoid catalog is instance-global reference data — no
          row-level security, no unit column, no reach predicate — so `language.read` held anywhere is
          the whole visibility decision and there is none left to fold into the count.

          The path is `/stats/languages` rather than `/languages/stats` because the server's router
          rejects a literal path segment that is a sibling of `{id}` — see the route-conflict guard in
          `internal/platform/transport`.
        args:
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`level,status`). Omitted or empty = every
              facet the caller may read; an explicit list of nothing (`facets=,`) returns `totalCount`
              alone. An undeclared facet key is a Language:LanguoidInvalid.
          level:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listLanguages`.
          family:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listLanguages`.
          macroarea:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listLanguages`.
          status:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listLanguages`.
          query:
            type: optional<string>
            param-type: query
            docs: |
              Case-insensitive substring match on name or glottocode — the same trigram-served
              predicate `listLanguages` uses, so a searched list and its dashboard describe one set.
        returns: LanguoidStats
      getLanguage:
        http: GET /languages/{id}
        docs: Fetch one languoid by its RID.
        args:
          id:
            type: string
            param-type: path
            docs: The languoid's RID.
        returns: Languoid
      listWritingSystems:
        http: GET /writing-systems
        docs: List the ISO-15924 writing systems in code order.
        returns: WritingSystemList
