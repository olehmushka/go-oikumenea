# Location module API (M19 / D-Location). A shared, standalone place entity: a precise
# GEOGRAPHY(POINT,4326) coordinate + a structured postal address over the geo_countries registry, with
# an app-derived MGRS index. Anything with a location (M20 buildings, M21 addresses,
# religion sites) references a location by its RID and owns visibility/precision/purpose on its own
# link — a location itself carries no owner. Lives beside the read-only GeoService on the `location`
# RID service (12); unlike GeoService, LocationService is a full audited CRUD surface.
#
# RID-bearing fields are typed `string` (the canonical uuid RID): Conjure reserves `rid` as a built-in
# primitive whose `ri.` format is NOT our RID, so a type named `Rid`/`rid` cannot be used. Localized
# `name` (on a location type) is an inline map<string,string> (locale->text), all enabled locales in
# every response (D-i18n). Generated Go lands in internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: oikumenea.location
    objects:
      CoordinateInput:
        docs: |
          A coordinate in one of several supported formats. The application converts it to a canonical
          WGS84 lat/lon, derives the MGRS, and preserves this input verbatim as the location's
          sourceCoordinate. `format` selects which fields are read (the others are ignored); the
          converter set is a pluggable registry, so more formats can be added without a schema change.
        fields:
          format:
            type: string
            docs: One of latlon | mgrs | utm | sk42 | sk42grid.
          latitude:
            type: optional<double>
            docs: WGS84 latitude (format=latlon).
          longitude:
            type: optional<double>
            docs: WGS84 longitude (format=latlon).
          mgrs:
            type: optional<string>
            docs: MGRS grid reference, e.g. 36UUA2418291607 (format=mgrs).
          zone:
            type: optional<integer>
            docs: UTM or СК-42 (Gauss-Krüger) zone number (format=utm|sk42).
          hemisphere:
            type: optional<string>
            docs: N | S, the UTM hemisphere (format=utm).
          easting:
            type: optional<double>
            docs: Easting in metres (format=utm|sk42).
          northing:
            type: optional<double>
            docs: Northing in metres (format=utm|sk42).
          grid:
            type: optional<string>
            docs: СК-42 grid-square reference (format=sk42grid).
      Location:
        docs: A shared place — a precise coordinate, an app-derived MGRS, and a structured postal address.
        fields:
          id:
            type: string
            docs: The location's RID (location service); what owning modules reference by FK.
          latitude:
            type: double
            docs: WGS84 latitude of the authoritative coordinate.
          longitude:
            type: double
            docs: WGS84 longitude of the authoritative coordinate.
          mgrs:
            type: optional<string>
            docs: App-derived MGRS grid reference (absent for polar UPS coordinates, out of scope).
          sourceCoordinate:
            type: optional<CoordinateInput>
            docs: The coordinate as originally supplied (its format + raw values), preserved verbatim.
          countryId:
            type: string
            docs: The country's RID (resolve an ISO alpha-2 code via GET /geo/countries).
          adminArea1:
            type: optional<string>
          adminArea2:
            type: optional<string>
          locality:
            type: optional<string>
          street:
            type: optional<string>
          houseNumber:
            type: optional<string>
          postalCode:
            type: optional<string>
          rawAddress:
            type: optional<string>
          typeId:
            type: optional<string>
            docs: Optional place-type classification (location_location_types RID).
          typeName:
            type: optional<map<string, string>>
            docs: Localized name (locale->text) of the place type, when typeId is set.
          createdAt:
            type: datetime
          updatedAt:
            type: datetime
      LocationWrite:
        docs: |
          Create/replace payload for a location. `coordinate` is the required spine (validated in the
          application, not the wire, so a missing/unparseable coordinate returns Location:CoordinateRequired
          or Location:CoordinateInvalid rather than a deserialization error). MGRS is never supplied — it
          is app-derived from the resolved WGS84 coordinate.
        fields:
          coordinate:
            type: optional<CoordinateInput>
            docs: The coordinate in any supported format; required (absence → Location:CoordinateRequired).
          countryId:
            type: string
            docs: The country's RID (required).
          adminArea1:
            type: optional<string>
          adminArea2:
            type: optional<string>
          locality:
            type: optional<string>
          street:
            type: optional<string>
          houseNumber:
            type: optional<string>
          postalCode:
            type: optional<string>
          rawAddress:
            type: optional<string>
          typeId:
            type: optional<string>
      LocationPage:
        docs: A page of locations plus the opaque token for the next page (empty when exhausted).
        fields:
          locations: list<Location>
          nextPageToken: optional<string>
      FacetBucket:
        docs: |
          One bucket of a facet distribution (M57 / D-ObjectFacets).

          `key` is the bucket's stable, locale-agnostic identity — for both location facets a RID —
          and is exactly what you pass back as the corresponding list filter. Two synthetic keys
          never name a real value: `(unknown)` is the NULL bucket and `(other)` a top-N facet's
          collapsed tail; neither is a usable filter value.

          `label` carries the object's display name as a locale → text map (D-i18n) and is present
          only for `ref` buckets, whose keys are RIDs. Best effort: an id with no resolvable name
          carries no label.
        fields:
          key: string
          label: optional<map<string, string>>
          count: integer
      FacetDistribution:
        docs: |
          One facet's buckets, in chart order — descending by count, with `(other)`/`(unknown)` last.
        fields:
          facet: string
          buckets: list<FacetBucket>
      LocationStats:
        docs: |
          Facet distributions over the SAME set `listLocations` returns under the same arguments —
          the dashboard half of the location facet vocabulary (M58 ticket 6 / D-ObjectFacets).

          ONE visibility arm, and no subject: a location carries no owner, no unit and no
          public/shadow bit (D-Location — a referencing module owns the *meaning* of a place on its
          own link), so `location.read` held anywhere is the whole gate and there is no second arm
          for a visibility decision to make. That is languoid's shape — the ABSENCE of a decision —
          and NOT the audit ledger's, which is a decision made entirely by which connection the
          query runs on.

          THE SPATIAL WINDOW COUNTS. Unlike a tree-walk arg, a radius or bounding box is a predicate
          over the listed table itself, so it narrows this aggregate exactly as it narrows the list
          and the same mode precedence applies (`query` beats radius beats bbox). `totalCount`
          therefore equals the rows exhaustively paging `listLocations` under these arguments would
          return, in every one of the four modes.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
      LocationType:
        docs: An instance-admin catalog label classifying a place (building/address/online); descriptive only.
        fields:
          id:
            type: string
          code:
            type: string
          name:
            type: map<string, string>
            docs: Localized display name (locale->text), all enabled locales.
          status:
            type: string
            docs: active | retired.
      LocationTypeList:
        docs: The active location types, in display order.
        fields:
          locationTypes: list<LocationType>
    errors:
      CoordinateRequired:
        namespace: Location
        code: INVALID_ARGUMENT
        docs: A location requires a coordinate; address-only records are out of scope.
      CoordinateInvalid:
        namespace: Location
        code: INVALID_ARGUMENT
        docs: The supplied coordinate could not be parsed/converted to WGS84, or resolves out of range.
      QueryWindowRequired:
        namespace: Location
        code: INVALID_ARGUMENT
        docs: |
          VESTIGIAL since M58 ticket 6 and no longer returned by any endpoint: `listLocations` gained
          an unwindowed browse mode, so "no window given" is now a valid request rather than an
          error. Retained because the contract is expand-only — removing a declared error is a wire
          break for any client that switches on its name.
      Invalid:
        namespace: Location
        code: INVALID_ARGUMENT
        docs: The request names an undeclared facet key or an otherwise malformed argument.
        safe-args:
          reason: string
      LocationNotFound:
        namespace: Location
        code: NOT_FOUND
        safe-args:
          locationId: string
      LocationInUse:
        namespace: Location
        code: CONFLICT
        docs: The location is referenced by an owning link and cannot be deleted.
        safe-args:
          locationId: string
services:
  LocationService:
    name: Location Service
    package: oikumenea.location
    base-path: /location/v1
    default-auth: header
    docs: |
      CRUD + spatial queries over the shared location entity (D-Location). A location has no unit scope
      of its own; reads/writes are satisfied anywhere via the PEP (location.read/create/update,
      location.types.manage). The coordinate may be supplied in several formats; the application converts
      it to WGS84 and derives the MGRS on every coordinate change. Radius/bbox use PostGIS ST_DWithin.
    endpoints:
      createLocation:
        http: POST /locations
        docs: Create a location from a coordinate (any supported format) + address; derives MGRS. Location:CoordinateRequired when the coordinate is missing.
        args:
          request:
            type: LocationWrite
            param-type: body
        returns: Location
      getLocation:
        http: GET /locations/{locationId}
        docs: Read one location by its RID. Location:LocationNotFound when absent.
        args:
          locationId:
            type: string
            param-type: path
        returns: Location
      updateLocation:
        http: PUT /locations/{locationId}
        docs: Replace a location's coordinate/address/type (re-derives MGRS on the coordinate).
        args:
          locationId:
            type: string
            param-type: path
          request:
            type: LocationWrite
            param-type: body
        returns: Location
      deleteLocation:
        http: DELETE /locations/{locationId}
        docs: Soft-delete a location. Location:LocationInUse when an owner still references it.
        args:
          locationId:
            type: string
            param-type: path
      listLocations:
        http: GET /locations
        docs: |
          Browse, spatial or text query, token-paginated. FOUR modes, selected by which arguments are
          present and resolved in this precedence (M58 ticket 6):

          1. `query` — case-insensitive match on the address fields (locality, admin areas, street,
             MGRS, raw address);
          2. a radius — `lat` + `lng` + `radiusM`, via ST_DWithin, nearest first;
          3. a bounding box — `minLat` + `minLng` + `maxLat` + `maxLng`;
          4. BROWSE — none of the above: the whole registry in RID order.

          Mode 4 is new; before it, no window meant Location:QueryWindowRequired, and there was no way
          to ask for "the locations" at all. That error is now vestigial (see its docs).

          `countryId` and `typeId` are FACET filters (D-ObjectFacets) and apply in EVERY mode — they
          narrow the window rather than replacing it. `locationStats` takes the same arguments and
          describes the same set.
        args:
          lat:
            type: optional<double>
            param-type: query
          lng:
            type: optional<double>
            param-type: query
          radiusM:
            type: optional<double>
            param-type: query
          minLat:
            type: optional<double>
            param-type: query
          minLng:
            type: optional<double>
            param-type: query
          maxLat:
            type: optional<double>
            param-type: query
          maxLng:
            type: optional<double>
            param-type: query
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
          query:
            type: optional<string>
            param-type: query
            docs: Case-insensitive substring match on locality, admin areas, street, MGRS, or raw address.
          countryId:
            type: optional<string>
            param-type: query
            docs: Facet filter — the country's RID (geo_countries). Applies in every mode.
          typeId:
            type: optional<string>
            param-type: query
            docs: Facet filter — the place-type's RID (location_location_types). Applies in every mode.
        returns: LocationPage
      locationStats:
        http: GET /stats/locations
        docs: |
          Facet distributions over the location registry — the dashboard half of the location facet
          vocabulary (M58 ticket 6 / D-ObjectFacets). Takes exactly the arguments `listLocations`
          takes, minus paging, so a dashboard and a list are two renderings of one request state —
          INCLUDING the spatial window, which is a predicate over the listed table and therefore
          counts (see LocationStats).

          The path is `/stats/locations` rather than `/locations/stats` because the server's router
          rejects a literal path segment that is a sibling of `{locationId}`.
        args:
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`countryId,typeId`). Omitted or empty =
              every facet the caller may read; an explicit list of nothing (`facets=,`) returns
              `totalCount` alone. An undeclared facet key is a Location:Invalid.
          lat:
            type: optional<double>
            param-type: query
            docs: Spatial window — see `listLocations`.
          lng:
            type: optional<double>
            param-type: query
            docs: Spatial window — see `listLocations`.
          radiusM:
            type: optional<double>
            param-type: query
            docs: Spatial window — see `listLocations`.
          minLat:
            type: optional<double>
            param-type: query
            docs: Spatial window — see `listLocations`.
          minLng:
            type: optional<double>
            param-type: query
            docs: Spatial window — see `listLocations`.
          maxLat:
            type: optional<double>
            param-type: query
            docs: Spatial window — see `listLocations`.
          maxLng:
            type: optional<double>
            param-type: query
            docs: Spatial window — see `listLocations`.
          query:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listLocations`.
          countryId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listLocations`.
          typeId:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listLocations`.
        returns: LocationStats
      listLocationTypes:
        http: GET /location/types
        docs: List the active place-type catalog.
        returns: LocationTypeList
