# Person module API (M5). The personnel directory (docs/modules/person.md): the core aggregate of
# the whole service — account-optional, instance-global, holding at most one rank per rank system. A person is the
# primary PII store, so it carries a reversible deactivate -> purge (crypto-erase) lifecycle.
#
# RID-bearing fields are typed `string` (the composed URN RID): Conjure reserves `rid` as a built-in
# primitive whose `ri.` format is NOT our `urn:oikumenea:` RID, so a type named `Rid`/`rid` cannot be
# used. Calendar DATE fields (birthdate, citizenship/residence effective dates) are ISO-8601 date
# strings ("YYYY-MM-DD") — a day, not an instant — while lifecycle timestamps are `datetime`.
#
# Person NAMES are per-record data managed by the person's admins (a canonical display_name plus
# locale-tagged transliteration variants), NOT the instance-admin localization store (D-i18n) — so a
# person's own name is returned verbatim, never as a locale->text map. The ranks a person holds —
# at most one per rank system (D-Rank) — are returned as `ranks` (systemId + rankId pairs); clients
# resolve the labels via RankService.
#
# Endpoints declare `auth: header` so the contract carries the bearer token from now on; reads gate
# on `person.read`, writes on `person.create`/`person.update`/`person.rank.assign`/`person.lifecycle`/
# `person.purge` — all enforced once authorization (M7, the read-scope rule D-PersonReadScope) +
# identity-federation (M8) land. Writes are recorded in the audit log in-process (D-Audit), under an
# interim `system` actor until the acting person can be resolved (M7/M8). Generated Go lands in
# internal/conjure and is never hand-edited.
types:
  definitions:
    default-package: oikumenea.person
    objects:
      Person:
        docs: |
          An individual personnel record. Names follow the Unicode CLDR fixed field set
          (D-PersonNamesCLDR): displayName is authoritative, the structured parts are advisory. There
          is no patronymic field — the Slavic по-батькові lives in given2. nameVariants/citizenships/
          residences are populated by getPerson and empty in list responses.
        fields:
          id:
            type: string
            docs: The person's URN RID (carried as a plain string).
          code:
            type: optional<string>
            docs: Optional stable, locale-agnostic external id (e.g. personnel/service number); unique among active persons.
          displayName:
            type: string
            docs: The canonical full name form; authoritative for search/display.
          title: optional<string>
          given: optional<string>
          given2:
            type: optional<string>
            docs: Second given name; also holds the Slavic по-батькові / Icelandic patronymic.
          surname: optional<string>
          surnamePrefix:
            type: optional<string>
            docs: Nobiliary / genealogical particle (van, von, de, bin).
          surname2:
            type: optional<string>
            docs: Second surname (Hispanic / Lusophone).
          generation:
            type: optional<string>
            docs: Generational suffix (Jr., Sr., III).
          credentials:
            type: optional<string>
            docs: Post-nominal credentials (PhD, MD).
          preferred:
            type: optional<string>
            docs: Known-as / nickname.
          birthdate:
            type: optional<string>
            docs: ISO-8601 calendar date of birth (YYYY-MM-DD); a day, not an instant.
          dateOfDeath:
            type: optional<string>
            docs: ISO-8601 calendar date of death (YYYY-MM-DD); a bio attribute, not a lifecycle state — a deceased person stays an active record (D-PersonBio).
          sex:
            type: string
            docs: Biological sex, ISO/IEC 5218 as text — one of not_known | male | female | not_applicable.
          countryOfBirth:
            type: optional<string>
            docs: Country RID (resolve via GET /geo/countries), validated against the geo registry (D-Geo).
          attributes:
            type: optional<any>
            docs: Free-form long-tail directory fields (JSONB). pii:special ceiling — no special-category data without the envelope seam.
          ranks:
            type: list<PersonRank>
            docs: The ranks the person holds — at most one per rank system (a DIRECTORY attribute; never an authz input — D-Rank). Empty when unranked. Populated by getPerson; empty in list responses.
          status:
            type: string
            docs: Lifecycle status — one of active | deactivated | purged | provisional (D-OverlayFoundation).
          deactivatedAt: optional<datetime>
          purgeAfter:
            type: optional<datetime>
            docs: End of the reversibility window; purge is refused before it.
          createdAt: datetime
          updatedAt: datetime
          nameVariants:
            type: list<NameVariant>
            docs: Locale-tagged transliterations. Populated by getPerson; empty in list responses.
          citizenships:
            type: list<Citizenship>
            docs: The person's citizenships. Populated by getPerson; empty in list responses.
          residences:
            type: list<Residence>
            docs: The person's residence history. Populated by getPerson; empty in list responses.
          emails:
            type: list<Email>
            docs: The person's contact emails. Populated by getPerson; empty in list responses.
          phones:
            type: list<Phone>
            docs: The person's contact phones. Populated by getPerson; empty in list responses.
          callSigns:
            type: list<CallSign>
            docs: The person's call signs. Populated by getPerson; empty in list responses.
          messengerLinks:
            type: list<MessengerLink>
            docs: The person's messenger reachability links. Populated by getPerson; empty in list responses.
          socialAccounts:
            type: list<SocialAccount>
            docs: The person's standalone social accounts. Populated by getPerson; empty in list responses.
      PersonRank:
        docs: One rank a person holds, scoped to a rank system (the HOLDS_RANK link; one per system — D-Rank). A directory attribute, never an authz input.
        fields:
          systemId:
            type: string
            docs: The URN RID of the rank system (derived from the rank); clients resolve the label via RankService.
          rankId:
            type: string
            docs: The URN RID of the rank held in that system.
      NameVariant:
        docs: A full transliterated name form for one locale (e.g. ukr native, eng Latin). Person-managed, NOT the localization store.
        fields:
          id: string
          personId: string
          locale:
            type: string
            docs: The locale/script this form is for (an i18n_locales code).
          displayName: string
          title: optional<string>
          given: optional<string>
          given2: optional<string>
          surname: optional<string>
          surnamePrefix: optional<string>
          surname2: optional<string>
          generation: optional<string>
          credentials: optional<string>
          preferred: optional<string>
          isPrimary: boolean
          variantKind:
            type: string
            docs: transliteration (the canonical per-locale form) | aka | former_legal | maiden | pseudonym | cover (D-PhysicalIdentity).
          source:
            type: optional<string>
            docs: Alias attribution — how the name was learned (self_declared | operator_verified | imported); null for transliterations.
          confidence:
            type: optional<string>
            docs: Alias attribution confidence weight (confirmed | probable | possible).
      PhysicalDescription:
        docs: An effective-dated physical description (D-PhysicalIdentity, M31). pii:basic.
        fields:
          id: string
          personId: string
          heightCm:
            type: optional<integer>
            docs: Height in centimetres (1–299).
          weightKg:
            type: optional<integer>
            docs: Weight in whole kilograms (1–699).
          eyeColorId:
            type: optional<string>
            docs: Eye color — a platform_colors RID (domain='eye', D-Color). Resolve label/hex via the platform color catalog.
          hairColorId:
            type: optional<string>
            docs: Hair color — a platform_colors RID (domain='hair', D-Color). Resolve label/hex via the platform color catalog.
          build:
            type: optional<string>
            docs: Free-text physique (slim | athletic | heavy | ...).
          bloodType:
            type: optional<string>
            docs: One of A+|A-|B+|B-|AB+|AB-|O+|O-|unknown.
          effectiveFrom:
            type: string
            docs: ISO-8601 date the description took effect.
          effectiveTo:
            type: optional<string>
            docs: ISO-8601 date it ceased; null = current.
          source: optional<string>
          confidence: optional<string>
      DistinguishingMark:
        docs: A tattoo/scar/piercing/birthmark (D-PhysicalIdentity, M31). pii:special ceiling — a mark can reveal Art. 9 data.
        fields:
          id: string
          personId: string
          kind:
            type: string
            docs: One of tattoo | scar | piercing | birthmark.
          bodyLocation:
            type: optional<string>
            docs: Where on the body (e.g. left forearm); free text.
          description:
            type: optional<string>
            docs: The mark's appearance; free text.
          source: optional<string>
          confidence: optional<string>
      EthnicityType:
        docs: |
          A declared-ethnicity vocabulary entry in an instance-admin-managed, HIERARCHICAL taxonomy
          (D-PhysicalIdentity amendment, M43). Stable code + translatable name + optional parent (tree
          structure). `languages`/`countries` are GROUP-level ethnolinguistic + homeland associations
          (reference metadata about the group; NEVER a person's datum — a person's ethnicity and
          languages stay independent). This catalog is plaintext; a person's SELECTION is encrypted.
        fields:
          id: string
          code:
            type: string
            docs: Stable, locale-agnostic identifier (D-Code).
          name:
            type: map<string, string>
            docs: The translatable label as a locale -> text map (all enabled locales; D-i18n).
          parentId:
            type: optional<string>
            docs: The RID of the immediate parent group (absent for forest roots).
          hasChildren:
            type: boolean
            docs: Whether this group has children (lets a tree browser show the expand affordance).
          wikidataId:
            type: optional<string>
            docs: Wikidata Q-id anchor (external linkage; from the opt-in import).
          status:
            type: string
            docs: One of active | retired.
          sortOrder: optional<integer>
          languages:
            type: list<string>
            docs: Associated-language RIDs (Glottolog languoids) — group-level, populated on getEthnicityType.
          countries:
            type: list<string>
            docs: Homeland-country RIDs (geo_countries) — group-level, populated on getEthnicityType.
      Ethnicity:
        docs: |
          A person's self-declared ethnicity (D-PhysicalIdentity / D-SpecialPII, M31). The declared value
          is envelope-encrypted at rest; `code` is the DECRYPTED catalog code returned only to authorized
          readers. A crypto-erased tombstone returns an empty code.
        fields:
          id: string
          personId: string
          code:
            type: string
            docs: The declared ethnicity-type code (decrypted); empty for a crypto-erased tombstone.
          name:
            type: optional<string>
            docs: The catalog's default-locale display name for the declared code.
          legalBasis:
            type: string
            docs: The GDPR lawful-basis code (platform_legal_basis_kinds; an Art. 9 condition for special-category data).
          status:
            type: string
            docs: One of active | retired.
          source: optional<string>
          confidence: optional<string>
      Citizenship:
        docs: A person's effective-dated nationality in a country (D-Geo). A person may hold several; at most one active per country.
        fields:
          id: string
          personId: string
          country:
            type: string
            docs: Country RID (resolve via GET /geo/countries).
          basis:
            type: string
            docs: How the citizenship was acquired — one of birth | descent | naturalization | other.
          acquiredOn:
            type: optional<string>
            docs: ISO-8601 date the citizenship was acquired.
          lostOn:
            type: optional<string>
            docs: ISO-8601 date the citizenship was lost; null = currently held.
          isPrimary:
            type: boolean
            docs: The person's primary nationality (at most one active).
      Residence:
        docs: A person's effective-dated residence in a country/region (D-Geo). Locator data (pii:contact).
        fields:
          id: string
          personId: string
          country:
            type: string
            docs: Country RID (resolve via GET /geo/countries).
          region:
            type: optional<string>
            docs: Optional sub-national region / locality (free text).
          validFrom:
            type: string
            docs: ISO-8601 date the residence began.
          validTo:
            type: optional<string>
            docs: ISO-8601 date the residence ended; null = current.
      Address:
        docs: |
          A person's precise, effective-dated address (D-PersonAddresses, M32) — a reified link to a
          shared location_locations row (M19 Location). Distinct from Residence (country-grade legal
          residence); an Address is the geocoded overlay. pii:contact; purge-erased.
        fields:
          id: string
          personId: string
          locationId:
            type: string
            docs: The location_locations RID this address resolves to (create/resolve via the location service).
          role:
            type: string
            docs: One of home | work | mailing | other.
          validFrom:
            type: string
            docs: ISO-8601 date the address became effective.
          validTo:
            type: optional<string>
            docs: ISO-8601 date the address ended; null = current.
          isPrimary:
            type: boolean
            docs: The person's primary address (at most one active primary per person).
          privacySeeking:
            type: boolean
            docs: A mailing address that deliberately differs from home (itself a signal).
          source: optional<string>
          confidence: optional<string>
      PartyMembership:
        docs: |
          A person's political-party affiliation (D-InstitutionalTies, M33) — a reified link. Political
          opinion is a GDPR Art. 9 special category, so the party identity is envelope-encrypted at rest;
          `party` here is the decrypted value ("" for a crypto-erased tombstone). legalBasis is required.
          pii:special.
        fields:
          id: string
          personId: string
          party:
            type: string
            docs: The party name (or an external-organizations RID). Decrypted; "" when crypto-erased.
          role:
            type: string
            docs: One of member | official | candidate | donor | supporter | other.
          validFrom: optional<string>
          validTo:
            type: optional<string>
            docs: ISO-8601 date the affiliation ended; null = current.
          legalBasis:
            type: string
            docs: The platform_legal_basis_kinds code authorizing this Art. 9 processing.
          status:
            type: string
            docs: active | retired.
          source: optional<string>
          confidence: optional<string>
      UpsertPartyMembershipRequest:
        docs: Add a party membership, or replace one when id is supplied (D-InstitutionalTies, M33).
        fields:
          id: optional<string>
          party: string
          role: optional<string>
          validFrom: optional<string>
          validTo: optional<string>
          legalBasis: string
          status: optional<string>
          source: optional<string>
          confidence: optional<string>
      GovernmentPosition:
        docs: |
          A public office a person holds or held (D-InstitutionalTies, M33) — a reified link. pepTrigger
          persists after the position ends and feeds the M34 PEP watchlist check. pii:basic.
        fields:
          id: string
          personId: string
          title:
            type: string
            docs: e.g. "Minister of Defence", "Senator".
          body:
            type: string
            docs: The government body, e.g. "Ministry of Defence", "US Senate".
          orgId:
            type: optional<string>
            docs: Optional resolved body RID (polymorphic — external org / company / unit).
          countryId: optional<string>
          level:
            type: string
            docs: One of international | national | regional | local.
          roleType: optional<string>
          validFrom: optional<string>
          validTo: optional<string>
          pepTrigger:
            type: boolean
            docs: Politically-exposed-person flag; persists after the office ends.
          source: optional<string>
          confidence: optional<string>
      UpsertGovernmentPositionRequest:
        docs: Add a government position, or replace one when id is supplied (D-InstitutionalTies, M33).
        fields:
          id: optional<string>
          title: string
          body: string
          orgId: optional<string>
          countryId: optional<string>
          level: optional<string>
          roleType: optional<string>
          validFrom: optional<string>
          validTo: optional<string>
          pepTrigger: optional<boolean>
          source: optional<string>
          confidence: optional<string>
      LobbyingRelationship:
        docs: |
          A public lobbying filing (D-InstitutionalTies, M33) — a reified link: the person as registrant
          lobbying for a client before a legislative body on a set of issues. pii:basic.
        fields:
          id: string
          personId: string
          registrant: string
          client: optional<string>
          legislativeBody: optional<string>
          issues: list<string>
          filingId: optional<string>
          sourceUrl: optional<string>
          validFrom: optional<string>
          validTo: optional<string>
          source: optional<string>
          confidence: optional<string>
      UpsertLobbyingRelationshipRequest:
        docs: Add a lobbying relationship, or replace one when id is supplied (D-InstitutionalTies, M33).
        fields:
          id: optional<string>
          registrant: string
          client: optional<string>
          legislativeBody: optional<string>
          issues: optional<list<string>>
          filingId: optional<string>
          sourceUrl: optional<string>
          validFrom: optional<string>
          validTo: optional<string>
          source: optional<string>
          confidence: optional<string>
      ExternalReference:
        docs: |
          An off-platform pointer about a person (D-InstitutionalTies, M33) — an Object. Mirrors a social
          account; a hermenea import target (idempotent by URL). pii:basic.
        fields:
          id: string
          personId: string
          kind:
            type: string
            docs: One of wikipedia | news | registry | social | court | academic | other.
          url: string
          externalId: optional<string>
          categories: list<string>
          lastChecked: optional<string>
          disputed: boolean
          source: optional<string>
          confidence: optional<string>
      UpsertExternalReferenceRequest:
        docs: Add an external reference (idempotent by url), or replace one when id is supplied (M33).
        fields:
          id: optional<string>
          kind: optional<string>
          url: string
          externalId: optional<string>
          categories: optional<list<string>>
          lastChecked:
            type: optional<string>
            docs: RFC-3339 timestamp of the last verification check.
          disputed: optional<boolean>
          source: optional<string>
          confidence: optional<string>
      WatchlistMatch:
        docs: |
          The persisted residue of a live watchlist screening check (D-Watchlists, M34). Match METADATA
          only — never the underlying lists. One row per person; CheckWatchlists refreshes it. `pep` is a
          snapshot of the M33 government-position derivation captured at check time. pii:sensitive.
        fields:
          id: string
          personId: string
          onList:
            type: boolean
            docs: Any hit across the queried providers (OFAC / EU / UN / INTERPOL).
          lists:
            type: list<string>
            docs: The list codes matched, e.g. INTERPOL_RED, OFAC_SDN.
          program: optional<string>
          matchScore:
            type: optional<double>
            docs: 0..1 best-match score across providers.
          pep:
            type: boolean
            docs: Politically-exposed-person snapshot, derived from M33 government positions.
          lastChecked: string
          nextCheckDue:
            type: optional<string>
            docs: RFC-3339 time the upstream ≤24h cache lapses.
          source: optional<string>
          confidence: optional<string>
      RegulatorySanction:
        docs: |
          A structured regulatory/enforcement action against a person (D-Watchlists, M34) — an Object.
          Durable reference data (operator-curated or hermenea-imported), distinct from the volatile
          live-lookup above. Idempotent import keys on (person, externalId). pii:sensitive.
        fields:
          id: string
          personId: string
          regulator:
            type: string
            docs: The regulator/authority, e.g. "SEC", "FCA", "NBU".
          actionType:
            type: string
            docs: One of fine | ban | license_revocation | warning | settlement | debarment | other.
          amount: optional<double>
          currency:
            type: optional<string>
            docs: ISO-4217 code; required when amount is present.
          status:
            type: string
            docs: One of active | appealed | overturned | expired | settled.
          sanctionDate: optional<string>
          sourceUrl: optional<string>
          externalId:
            type: optional<string>
            docs: The id within the source system (the import idempotency key).
          legalBasis: optional<string>
          source: optional<string>
          confidence: optional<string>
      UpsertRegulatorySanctionRequest:
        docs: Add a regulatory sanction, or replace one when id is supplied (D-Watchlists, M34).
        fields:
          id: optional<string>
          regulator: string
          actionType: optional<string>
          amount: optional<double>
          currency: optional<string>
          status: optional<string>
          sanctionDate: optional<string>
          sourceUrl: optional<string>
          externalId: optional<string>
          legalBasis: optional<string>
          source: optional<string>
          confidence: optional<string>
      CryptoWallet:
        docs: |
          A crypto-wallet attribution for a person (D-PersonOverlays, M35) — an Object. The address is
          public on-chain data, but attributing it to a person is pii:sensitive; synergy with the M34
          sanctioned-wallet cross-check. Hard-erased on purge.
        fields:
          id: string
          personId: string
          address:
            type: string
            docs: The on-chain wallet address.
          chain:
            type: string
            docs: One of bitcoin | ethereum | solana | tron | bnb | polygon | monero | other.
          attributionMethod:
            type: string
            docs: One of exchange_kyc | blockchain_analysis | self_declared | leak | public_post | other.
          balanceUsdApprox:
            type: optional<double>
            docs: Last-known approximate USD balance.
          firstSeen: optional<string>
          lastSeen: optional<string>
          source: optional<string>
          confidence: optional<string>
      UpsertCryptoWalletRequest:
        docs: Add a crypto wallet, or replace one when id is supplied (D-PersonOverlays, M35).
        fields:
          id: optional<string>
          address: string
          chain: optional<string>
          attributionMethod: optional<string>
          balanceUsdApprox: optional<double>
          firstSeen: optional<string>
          lastSeen: optional<string>
          source: optional<string>
          confidence: optional<string>
      Personality:
        docs: |
          A declared or formally-assessed personality profile (D-PersonOverlays, M35) — an Object.
          DECLARED SURVEY OR FORMAL HR ASSESSMENT ONLY — never inferred from text. pii:sensitive.
        fields:
          id: string
          personId: string
          framework:
            type: string
            docs: One of mbti | big_five | disc | enneagram | other.
          result:
            type: string
            docs: The typed output, e.g. "INTJ", a Big-Five summary, an Enneagram type.
          instrument:
            type: optional<string>
            docs: The specific test/assessment used.
          method:
            type: string
            docs: One of self_declared_survey | hr_assessment (inference is forbidden).
          assessedAt: optional<string>
          source: optional<string>
          confidence: optional<string>
      UpsertPersonalityRequest:
        docs: Add a personality profile, or replace one when id is supplied (D-PersonOverlays, M35).
        fields:
          id: optional<string>
          framework: optional<string>
          result: string
          instrument: optional<string>
          method: optional<string>
          assessedAt: optional<string>
          source: optional<string>
          confidence: optional<string>
      PoliticalLeaning:
        docs: |
          An INFERRED political leaning (D-PersonOverlays, M35) — an Object. Political opinion is a GDPR
          Art. 9 special category, so `spectrum` is envelope-encrypted at rest; the value here is decrypted
          (0 for a crypto-erased tombstone). legalBasis is required. This is a SEPARATE overlay and is NEVER
          merged with the declared M33 party membership. pii:special.
        fields:
          id: string
          personId: string
          spectrum:
            type: double
            docs: The inferred left/right position in [-1,1]. Decrypted; 0 when crypto-erased.
          inferenceSources:
            type: list<string>
            docs: The inference methodology tags, e.g. social_media | voting_record | donation_records.
          assessedAt: optional<string>
          legalBasis:
            type: string
            docs: The platform_legal_basis_kinds code authorizing this Art. 9 inference.
          confidence: optional<string>
      UpsertPoliticalLeaningRequest:
        docs: |
          Set the person's inferred political leaning (replaces the single active row). Requires legalBasis
          (Art. 9). Inferred-only — never a declared party affiliation (D-PersonOverlays, M35).
        fields:
          spectrum:
            type: double
            docs: The inferred position in [-1,1].
          inferenceSources: optional<list<string>>
          assessedAt: optional<string>
          legalBasis: string
          confidence: optional<string>
      Email:
        docs: A person's contact email (D-PersonContactChannels). pii:contact; distinct from the login email.
        fields:
          id: string
          personId: string
          typeCode:
            type: string
            docs: The email-type catalog code (personal | work | other ...).
          address:
            type: string
            docs: The email address (stored case-insensitively).
          provider:
            type: optional<string>
            docs: Provider derived from the address domain on write (gmail.com -> google); null when no mapping.
          isPrimary:
            type: boolean
            docs: The person's primary email (at most one active).
      Phone:
        docs: A person's contact phone (D-PersonContactChannels). number is E.164-normalized; country is derived. pii:contact.
        fields:
          id: string
          personId: string
          typeCode:
            type: string
            docs: The phone-type catalog code (mobile | home | work | other ...).
          number:
            type: string
            docs: The phone number, E.164-normalized on write.
          country:
            type: optional<string>
            docs: Country RID derived from the number (resolve codes via GET /geo/countries); null when underivable.
          isPrimary:
            type: boolean
            docs: The person's primary phone (at most one active).
      CallSign:
        docs: A person's informal identifier / позивний (D-PersonContactChannels). pii:basic; unique per person among active.
        fields:
          id: string
          personId: string
          callSign:
            type: string
            docs: The call sign label (required; unique per person).
          isPrimary:
            type: boolean
            docs: The person's primary call sign (at most one active).
      EmailType:
        docs: An instance-admin catalog entry naming a contact-email kind. Stable code + translatable name.
        fields:
          code:
            type: string
            docs: Stable, locale-agnostic identifier (D-Code); immutable by convention.
          name:
            type: map<string, string>
            docs: The translatable label as a locale -> text map (all enabled locales; D-i18n).
          status:
            type: string
            docs: One of active | retired.
          sortOrder: optional<integer>
      PhoneType:
        docs: An instance-admin catalog entry naming a contact-phone kind. Stable code + translatable name.
        fields:
          code:
            type: string
            docs: Stable, locale-agnostic identifier (D-Code); immutable by convention.
          name:
            type: map<string, string>
            docs: The translatable label as a locale -> text map (all enabled locales; D-i18n).
          status:
            type: string
            docs: One of active | retired.
          sortOrder: optional<integer>
      Platform:
        docs: An instance-admin catalog entry naming a social network / messenger (D-PersonSocialChannels). Stable code + translatable name + category.
        fields:
          code:
            type: string
            docs: Stable, locale-agnostic identifier (D-Code); immutable by convention.
          name:
            type: map<string, string>
            docs: The translatable label as a locale -> text map (all enabled locales; D-i18n).
          category:
            type: string
            docs: One of messenger | social. Only messenger platforms may carry a messenger link.
          status:
            type: string
            docs: One of active | retired.
          sortOrder: optional<integer>
      MessengerLink:
        docs: |
          Reachability on a messenger platform over one of the person's existing channels
          (D-PersonSocialChannels). Exactly one of phoneId/emailId is set.
        fields:
          id: string
          phoneId:
            type: optional<string>
            docs: The URN RID of the person's phone this link annotates; null when the link is over an email.
          emailId:
            type: optional<string>
            docs: The URN RID of the person's email this link annotates; null when the link is over a phone.
          platformCode:
            type: string
            docs: The messenger platform code (category=messenger).
          isPrimary:
            type: boolean
            docs: The person's primary messenger reachability (at most one active).
          verifiedAt:
            type: optional<datetime>
            docs: When the reachability was verified; null when unverified.
      SocialAccount:
        docs: |
          A person's standalone social-network account (D-PersonSocialChannels). platformUserId is the
          platform's immutable internal id (the durable key); handle is the mutable current @handle.
        fields:
          id: string
          personId: string
          platformCode:
            type: string
            docs: The platform code the account is on.
          platformUserId:
            type: optional<string>
            docs: The platform's immutable internal id (the durable key); null when unknown.
          handle:
            type: string
            docs: The current @handle (mutable; rename history kept separately).
          displayName: optional<string>
          profileUrl:
            type: optional<string>
            docs: Profile URL; derived from platform + handle on write when not supplied.
          language: optional<string>
          platformVerified:
            type: boolean
            docs: The platform "blue-check"; distinct from operator confirmation.
          verifiedByOperatorAt:
            type: optional<datetime>
            docs: When an operator confirmed the account; null when unconfirmed.
          source:
            type: string
            docs: How the account was learned — one of self_declared | operator_verified | imported.
          confidence:
            type: string
            docs: Weight of the claim — one of confirmed | probable | possible.
          isPrimary:
            type: boolean
            docs: The person's primary social account (at most one active).
      SocialAccountHandle:
        docs: One period in a social account's @handle-rename history (D-PersonSocialChannels). validTo null = current.
        fields:
          id: string
          accountId: string
          handle: string
          validFrom: datetime
          validTo:
            type: optional<datetime>
            docs: When this handle stopped being current; null = current.
      PersonLanguage:
        docs: |
          A language a person speaks (D-Languages, M18; Link link__speaks). languageId references a
          level='language' Glottolog languoid (LanguageService); name is the languoid's translatable
          display name (locale -> text map). cefrLevel is the optional CEFR proficiency; isNative flags a
          mother tongue.
        fields:
          id: string
          personId: string
          languageId:
            type: string
            docs: The languoid's URN RID (a level='language' node; resolve via GET /language/v1/languages).
          name:
            type: map<string, string>
            docs: The languoid's translatable display name as a locale -> text map (all enabled locales; D-i18n).
          cefrLevel:
            type: optional<string>
            docs: CEFR proficiency — one of A1 | A2 | B1 | B2 | C1 | C2; null when unstated.
          isNative:
            type: boolean
            docs: Whether this is a mother tongue.
      RelationType:
        docs: An instance-admin catalog entry for an open-ended person↔person relation label (D-PersonRelationships). Stable code + translatable name + category.
        fields:
          code:
            type: string
            docs: Stable, locale-agnostic identifier (D-Code); immutable by convention.
          name:
            type: map<string, string>
            docs: The translatable label as a locale -> text map (all enabled locales; D-i18n).
          category:
            type: string
            docs: One of sponsorship | association | next_of_kin.
          status:
            type: string
            docs: One of active | retired.
          sortOrder: optional<integer>
      Partnership:
        docs: |
          A marriage or engagement between two persons (D-PersonRelationships; Link link__partnered_with).
          Symmetric: stored as a canonical pair (personIdA < personIdB). At most one active engaged/married
          row per person.
        fields:
          id: string
          personIdA:
            type: string
            docs: The lower-sorting partner's URN RID (canonical pair ordering).
          personIdB:
            type: string
            docs: The higher-sorting partner's URN RID.
          status:
            type: string
            docs: One of engaged | married | divorced | widowed | annulled | dissolved.
          effectiveFrom:
            type: optional<string>
            docs: ISO-8601 date the partnership began (YYYY-MM-DD).
          effectiveTo:
            type: optional<string>
            docs: ISO-8601 date it ended (YYYY-MM-DD); null = ongoing.
      Kinship:
        docs: A directional parent→child blood/legal parentage link (D-PersonRelationships; Link link__kin_parent_of). Siblings are derived, never stored.
        fields:
          id: string
          parentId:
            type: string
            docs: The parent's URN RID.
          childId:
            type: string
            docs: The child's URN RID.
          status:
            type: string
            docs: One of active | disestablished.
      Guardianship:
        docs: A legal guardian→ward link, distinct from blood kinship (D-PersonRelationships; Link link__guardian_of).
        fields:
          id: string
          guardianId:
            type: string
            docs: The guardian's URN RID.
          wardId:
            type: string
            docs: The ward's URN RID.
          relationCode:
            type: optional<string>
            docs: Optional relation-type catalog code.
          status:
            type: string
            docs: One of active | ended.
          effectiveFrom: optional<string>
          effectiveTo:
            type: optional<string>
            docs: null = ongoing.
      Sponsorship:
        docs: A sponsor→sponsored link — godparent / academic advisor / military mentor (D-PersonRelationships; Link link__sponsor_of).
        fields:
          id: string
          sponsorId:
            type: string
            docs: The sponsor's URN RID.
          sponsoredId:
            type: string
            docs: The sponsored person's URN RID.
          relationCode:
            type: string
            docs: Required relation-type catalog code (category=sponsorship).
          status:
            type: string
            docs: One of active | ended.
          effectiveFrom: optional<string>
          effectiveTo:
            type: optional<string>
            docs: null = ongoing.
          enrollmentId:
            type: optional<string>
            docs: Optional education context — the enrollment (D-Education, M20) this sponsorship relates to.
          educationRole:
            type: optional<string>
            docs: Optional education role of the sponsor — one of professor | tutor | curator | advisor.
      NextOfKin:
        docs: An in-directory next-of-kin nomination (subject→contact, both directory persons; D-PersonRelationships; Link link__next_of_kin). A nomination, not a blood fact.
        fields:
          id: string
          subjectId:
            type: string
            docs: The nominating person's URN RID.
          contactId:
            type: string
            docs: The nominated contact's URN RID (an in-directory person).
          relationCode:
            type: optional<string>
            docs: Optional relation-type catalog code (category=next_of_kin).
          priority:
            type: integer
            docs: Priority ordering of the nomination (1 = highest).
          status:
            type: string
            docs: One of active | withdrawn.
      Association:
        docs: A symmetric association / conflict-of-interest / prohibited-contact link (D-PersonRelationships; Link link__associated_with).
        fields:
          id: string
          personIdA:
            type: string
            docs: The lower-sorting person's URN RID (canonical pair ordering).
          personIdB:
            type: string
            docs: The higher-sorting person's URN RID.
          relationCode:
            type: optional<string>
            docs: Optional relation-type catalog code (category=association).
          kind:
            type: string
            docs: One of associate | coi | no_contact.
          status:
            type: string
            docs: One of active | ended.
      PersonPage:
        docs: A page of persons plus the opaque token for the next page (empty when exhausted).
        fields:
          persons: list<Person>
          nextPageToken: optional<string>
      CreatePersonRequest:
        docs: Create a person — no account and no unit required (L-AccountOptional / D-PersonGlobal).
        fields:
          code: optional<string>
          displayName: string
          title: optional<string>
          given: optional<string>
          given2: optional<string>
          surname: optional<string>
          surnamePrefix: optional<string>
          surname2: optional<string>
          generation: optional<string>
          credentials: optional<string>
          preferred: optional<string>
          birthdate: optional<string>
          dateOfDeath: optional<string>
          sex:
            type: optional<string>
            docs: ISO/IEC 5218 value; defaults to not_known when omitted.
          countryOfBirth: optional<string>
          attributes: optional<any>
      CreateProvisionalPersonRequest:
        docs: |
          Create a provisional stub person (D-OverlayFoundation, M29). Minimal-PII: only a display name
          is required, with optional attribution (source/confidence) recording how the stub was learned.
        fields:
          displayName: string
          source:
            type: optional<string>
            docs: How the stub was learned — self_declared | operator_verified | imported (the attribution convention).
          confidence:
            type: optional<string>
            docs: Certainty weight — confirmed | probable | possible (defaults to possible).
          attributes: optional<any>
      MergePersonRequest:
        docs: Resolve a provisional stub into a canonical person (D-OverlayFoundation, M29).
        fields:
          intoPersonId:
            type: string
            docs: The URN RID of the surviving canonical person the stub's edges are re-homed onto.
          confidence:
            type: optional<string>
            docs: Operator certainty about the identity equation — confirmed | probable | possible (defaults to possible). Recorded in the audit trail.
      UpdatePersonRequest:
        docs: |
          Update a person's names (canonical + CLDR parts), birthdate, date_of_death, sex,
          country_of_birth, and attributes. Omitted fields are unchanged; an empty string clears an
          optional name part. `code` is immutable by convention and ranks are set via setRank (per system).
        fields:
          displayName: optional<string>
          title: optional<string>
          given: optional<string>
          given2: optional<string>
          surname: optional<string>
          surnamePrefix: optional<string>
          surname2: optional<string>
          generation: optional<string>
          credentials: optional<string>
          preferred: optional<string>
          birthdate: optional<string>
          dateOfDeath: optional<string>
          sex: optional<string>
          countryOfBirth: optional<string>
          attributes: optional<any>
      SetRankRequest:
        docs: |
          Set or clear the person's rank in ONE rank system (one rank per system — D-Rank). The rank's
          system is derived from the rank itself, so on set only rankId is needed; on clear, systemId
          names the system to clear.
        fields:
          rankId:
            type: optional<string>
            docs: The URN RID of the rank to assign (its rank system is derived); omit to clear the person's rank in `systemId`.
          systemId:
            type: optional<string>
            docs: Required only when clearing (rankId omitted) — the URN RID of the rank system to clear. Ignored when rankId is present.
      DeactivateRequest:
        docs: Begin reversible deactivation; opens a grace window (purgeAfter = now + the configured grace).
        fields:
          reason:
            type: optional<string>
            docs: Optional free-text reason recorded in the audit entry.
      UpsertNameVariantRequest:
        docs: Add or replace the name variant for a locale (keyed by (person, locale)).
        fields:
          locale: string
          displayName: string
          title: optional<string>
          given: optional<string>
          given2: optional<string>
          surname: optional<string>
          surnamePrefix: optional<string>
          surname2: optional<string>
          generation: optional<string>
          credentials: optional<string>
          preferred: optional<string>
          isPrimary: optional<boolean>
      AddNameAliasRequest:
        docs: Add an alias name form (aka/former_legal/maiden/pseudonym/cover). Addressed by its RID; may carry attribution.
        fields:
          locale: string
          variantKind:
            type: string
            docs: One of aka | former_legal | maiden | pseudonym | cover.
          displayName: string
          title: optional<string>
          given: optional<string>
          given2: optional<string>
          surname: optional<string>
          surnamePrefix: optional<string>
          surname2: optional<string>
          generation: optional<string>
          credentials: optional<string>
          preferred: optional<string>
          source: optional<string>
          confidence: optional<string>
      UpsertPhysicalDescriptionRequest:
        docs: Add a physical description, or replace one when id is supplied.
        fields:
          id:
            type: optional<string>
            docs: The RID of an existing description row to replace; omit to add a new row.
          heightCm: optional<integer>
          weightKg: optional<integer>
          eyeColorId:
            type: optional<string>
            docs: A platform_colors RID (domain='eye', D-Color).
          hairColorId:
            type: optional<string>
            docs: A platform_colors RID (domain='hair', D-Color).
          build: optional<string>
          bloodType: optional<string>
          effectiveFrom:
            type: optional<string>
            docs: ISO-8601 date; defaults to today on insert.
          effectiveTo: optional<string>
          source: optional<string>
          confidence: optional<string>
      UpsertDistinguishingMarkRequest:
        docs: Add a distinguishing mark, or replace one when id is supplied.
        fields:
          id:
            type: optional<string>
            docs: The RID of an existing mark row to replace; omit to add a new row.
          kind:
            type: string
            docs: One of tattoo | scar | piercing | birthmark.
          bodyLocation: optional<string>
          description: optional<string>
          source: optional<string>
          confidence: optional<string>
      UpsertEthnicityTypeRequest:
        docs: Add or update a declared-ethnicity catalog entry (instance-admin managed).
        fields:
          code: string
          name:
            type: string
            docs: The default-locale display name (other locales arrive via the localization store).
          parentId:
            type: optional<string>
            docs: The RID of the parent group (absent for a root). D-PhysicalIdentity amendment, M43.
          wikidataId: optional<string>
          sortOrder: optional<integer>
      AddEthnicityRequest:
        docs: Declare an ethnicity for a person (self-declared, envelope-encrypted, lawful-basis-gated).
        fields:
          code:
            type: string
            docs: A person_ethnicity_types code (validated against the catalog before sealing).
          legalBasis:
            type: string
            docs: The GDPR lawful-basis code (an Art. 9 condition; platform_legal_basis_kinds).
          source: optional<string>
          confidence: optional<string>
      UpdateEthnicityRequest:
        docs: Re-declare the ethnicity value and/or flip legal basis / status.
        fields:
          code: string
          legalBasis: string
          status:
            type: optional<string>
            docs: active | retired; defaults to active.
      UpsertCitizenshipRequest:
        docs: Add or replace the active citizenship for a country (keyed by (person, country)).
        fields:
          country: string
          basis:
            type: optional<string>
            docs: birth | descent | naturalization | other; defaults to other.
          acquiredOn: optional<string>
          lostOn: optional<string>
          isPrimary: optional<boolean>
      UpsertResidenceRequest:
        docs: Add a residence row, or replace one when id is supplied.
        fields:
          id:
            type: optional<string>
            docs: The URN RID of an existing residence row to replace; omit to add a new row.
          country: string
          region: optional<string>
          validFrom: string
          validTo: optional<string>
      UpsertAddressRequest:
        docs: Add an address, or replace one when id is supplied (D-PersonAddresses, M32).
        fields:
          id:
            type: optional<string>
            docs: The RID of an existing address row to replace; omit to add a new row.
          locationId:
            type: string
            docs: The location_locations RID this address resolves to.
          role:
            type: string
            docs: One of home | work | mailing | other.
          validFrom:
            type: optional<string>
            docs: ISO-8601 date the address became effective; defaults to today.
          validTo: optional<string>
          isPrimary: optional<boolean>
          privacySeeking: optional<boolean>
          source: optional<string>
          confidence: optional<string>
      UpsertEmailRequest:
        docs: Add a contact email, or replace one when id is supplied. provider is derived from the address.
        fields:
          id:
            type: optional<string>
            docs: The URN RID of an existing email row to replace; omit to add a new row.
          typeCode: string
          address: string
          isPrimary: optional<boolean>
      UpsertPhoneRequest:
        docs: Add a contact phone, or replace one when id is supplied. number is E.164-normalized and country derived.
        fields:
          id:
            type: optional<string>
            docs: The URN RID of an existing phone row to replace; omit to add a new row.
          typeCode: string
          number: string
          isPrimary: optional<boolean>
      UpsertCallSignRequest:
        docs: Add a call sign, or replace one when id is supplied. The value is required and unique per person.
        fields:
          id:
            type: optional<string>
            docs: The URN RID of an existing call-sign row to replace; omit to add a new row.
          callSign: string
          isPrimary: optional<boolean>
      UpsertMessengerLinkRequest:
        docs: |
          Add a messenger link over one of the person's phones or emails, or replace one when id is
          supplied. Exactly one of phoneId/emailId must be set; platformCode must be a messenger platform.
        fields:
          id:
            type: optional<string>
            docs: The URN RID of an existing messenger-link row to replace; omit to add a new row.
          phoneId: optional<string>
          emailId: optional<string>
          platformCode: string
          isPrimary: optional<boolean>
          verifiedAt: optional<datetime>
      UpsertSocialAccountRequest:
        docs: Add a social account, or replace one when id is supplied. handle is normalized and profileUrl derived when omitted.
        fields:
          id:
            type: optional<string>
            docs: The URN RID of an existing social-account row to replace; omit to add a new row.
          platformCode: string
          platformUserId: optional<string>
          handle: string
          displayName: optional<string>
          profileUrl: optional<string>
          language: optional<string>
          platformVerified: optional<boolean>
          verifiedByOperatorAt: optional<datetime>
          source:
            type: string
            docs: self_declared | operator_verified | imported.
          confidence:
            type: optional<string>
            docs: confirmed | probable | possible; defaults to possible.
          isPrimary: optional<boolean>
      UpsertPersonLanguageRequest:
        docs: Add or update a language the person speaks (keyed on languageId). cefrLevel/isNative are the proficiency attributes.
        fields:
          languageId:
            type: string
            docs: The languoid's URN RID; must resolve to a level='language' Glottolog node.
          cefrLevel:
            type: optional<string>
            docs: A1 | A2 | B1 | B2 | C1 | C2; omit to leave unstated.
          isNative: optional<boolean>
      UpsertPartnershipRequest:
        docs: |
          Record or replace a partnership between the path person and partnerId. The pair is stored in
          canonical order; the path person must not be the partner. At most one active engaged/married
          partnership per person.
        fields:
          id:
            type: optional<string>
            docs: The URN RID of an existing partnership row to replace; omit to add a new row.
          partnerId:
            type: string
            docs: The other partner's URN RID (an in-directory person).
          status:
            type: string
            docs: engaged | married | divorced | widowed | annulled | dissolved.
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
      UpsertKinshipRequest:
        docs: Record or replace a parent→child kinship between the path person and counterpartId; role names the path person's side.
        fields:
          id: optional<string>
          counterpartId:
            type: string
            docs: The other person's URN RID.
          role:
            type: string
            docs: The path person's role — parent | child.
          status:
            type: optional<string>
            docs: active | disestablished; defaults to active.
      UpsertGuardianshipRequest:
        docs: Record or replace a guardian→ward link between the path person and counterpartId; role names the path person's side.
        fields:
          id: optional<string>
          counterpartId:
            type: string
            docs: The other person's URN RID.
          role:
            type: string
            docs: The path person's role — guardian | ward.
          relationCode: optional<string>
          status:
            type: optional<string>
            docs: active | ended; defaults to active.
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
      UpsertSponsorshipRequest:
        docs: Record or replace a sponsor→sponsored link between the path person and counterpartId; role names the path person's side. relationCode is required (category=sponsorship).
        fields:
          id: optional<string>
          counterpartId:
            type: string
            docs: The other person's URN RID.
          role:
            type: string
            docs: The path person's role — sponsor | sponsored.
          relationCode:
            type: string
            docs: Required relation-type code (category=sponsorship).
          status:
            type: optional<string>
            docs: active | ended; defaults to active.
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
          enrollmentId:
            type: optional<string>
            docs: Optional education context — the enrollment (D-Education, M20) this sponsorship relates to.
          educationRole:
            type: optional<string>
            docs: Optional sponsor education role — one of professor | tutor | curator | advisor.
      UpsertNextOfKinRequest:
        docs: Nominate or replace a next-of-kin contact for the path person (the subject). contactId must be an in-directory person.
        fields:
          id: optional<string>
          contactId:
            type: string
            docs: The nominated contact's URN RID (an in-directory person).
          relationCode:
            type: optional<string>
            docs: Optional relation-type code (category=next_of_kin).
          priority:
            type: optional<integer>
            docs: Priority ordering (1 = highest); defaults to 1.
          status:
            type: optional<string>
            docs: active | withdrawn; defaults to active.
      UpsertAssociationRequest:
        docs: Record or replace a symmetric association between the path person and counterpartId.
        fields:
          id: optional<string>
          counterpartId:
            type: string
            docs: The other person's URN RID.
          kind:
            type: string
            docs: associate | coi | no_contact.
          relationCode:
            type: optional<string>
            docs: Optional relation-type code (category=association).
          status:
            type: optional<string>
            docs: active | ended; defaults to active.
    errors:
      PersonNotFound:
        namespace: Person
        code: NOT_FOUND
        safe-args:
          personId: string
      PersonConflict:
        docs: A unique constraint was violated — the external code is taken, or an active citizenship for the country already exists.
        namespace: Person
        code: CONFLICT
        safe-args:
          reason: string
      PersonInvalid:
        docs: The request is malformed (bad name/code/date/enum) or references an unknown rank, country, or locale.
        namespace: Person
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      PersonLifecycleConflict:
        docs: The lifecycle transition is not allowed from the current state (e.g. purge before the grace window, reactivate a person that is not deactivated).
        namespace: Person
        code: FAILED_PRECONDITION
        safe-args:
          reason: string
services:
  PersonService:
    name: Person Service
    package: oikumenea.person
    base-path: /person/v1
    default-auth: header
    docs: |
      The personnel directory (D-PersonGlobal). Reads gate on `person.read` via the read-scope rule
      (D-PersonReadScope); writes on `person.create`/`person.update`/`person.rank.assign`/
      `person.lifecycle`/`person.purge` — all enforced once authorization (M7) lands. Writes are
      audited in-process (D-Audit). The module never reads rank to make a decision (D-Rank).
    endpoints:
      createPerson:
        http: POST /persons
        docs: Create a person (no account, no unit needed). Returns Person:PersonConflict if the code is taken.
        args:
          request: CreatePersonRequest
        returns: Person
      createProvisionalPerson:
        http: POST /provisional-persons
        docs: |
          Create a minimal-PII PROVISIONAL stub (D-OverlayFoundation, M29) — an unresolved external /
          edge-target person so a relationship or overlay edge points at a real node. Resolve it later
          via mergePerson. Only displayName is required.
        args:
          request: CreateProvisionalPersonRequest
        returns: Person
      mergePerson:
        http: POST /persons/{personId}/merge
        docs: |
          Resolve the provisional stub {personId} INTO a canonical person (D-OverlayFoundation, M29):
          re-homes the stub's edges (and every other module's references) onto the canonical person in
          one transaction, then tombstones the stub. {personId} must be provisional; `intoPersonId` must
          be a distinct, non-provisional person. Returns the canonical Person. Returns Person:PersonInvalid
          when the source is not provisional or the target is invalid.
        args:
          personId:
            type: string
            param-type: path
            docs: The provisional stub being merged away.
          request: MergePersonRequest
        returns: Person
      getPerson:
        http: GET /persons/{personId}
        docs: Read one person with its name variants, citizenships, and residences.
        args:
          personId:
            type: string
            param-type: path
