            type: string
            param-type: path
          request: UpsertGuardianshipRequest
        returns: Guardianship
      listSponsorships:
        http: GET /persons/{personId}/sponsorships
        docs: List sponsorships (godparent/advisor/mentor) touching the person.
        args:
          personId:
            type: string
            param-type: path
        returns: list<Sponsorship>
      upsertSponsorship:
        http: PUT /persons/{personId}/sponsorships
        docs: Add or replace a sponsor→sponsored link. relationCode must be a category=sponsorship code. Returns Person:PersonInvalid for a self-edge, unknown counterpart, or wrong relation category.
        args:
          personId:
            type: string
            param-type: path
          request: UpsertSponsorshipRequest
        returns: Sponsorship
      listNextOfKin:
        http: GET /persons/{personId}/next-of-kin
        docs: List next-of-kin nominations touching the person (priority-ordered).
        args:
          personId:
            type: string
            param-type: path
        returns: list<NextOfKin>
      upsertNextOfKin:
        http: PUT /persons/{personId}/next-of-kin
        docs: Nominate or replace a next-of-kin contact for the person. Returns Person:PersonInvalid for a self-nomination, unknown contact, or wrong relation category.
        args:
          personId:
            type: string
            param-type: path
          request: UpsertNextOfKinRequest
        returns: NextOfKin
      listAssociations:
        http: GET /persons/{personId}/associations
        docs: List associations (associate/COI/no-contact) touching the person.
        args:
          personId:
            type: string
            param-type: path
        returns: list<Association>
      upsertAssociation:
        http: PUT /persons/{personId}/associations
        docs: Add or replace a symmetric association. Returns Person:PersonInvalid for a self-pair, unknown counterpart, wrong relation category, or bad kind.
        args:
          personId:
            type: string
            param-type: path
          request: UpsertAssociationRequest
        returns: Association
      deleteRelationship:
        http: DELETE /persons/{personId}/relationships/{relationshipId}
        docs: |
          Remove any person↔person link by id (the link type is decoded from the RID). The path person
