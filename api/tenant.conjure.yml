# Tenant module API (M3). The unit graph the whole service hangs off (docs/modules/tenant.md /
# D-Graphs): units as a multi-parent, multi-root DAG per named hierarchy (graph), a maintained
# transitive closure (ancestors/descendants in one lookup for the M7 PDP), public/shadow
# visibility, and lifecycle. The module never decides access — it calls the PDP (M7).
#
# RID-bearing fields are typed `string` (the composed URN RID): Conjure reserves `rid` as a
# built-in primitive whose `ri.` format is NOT our `urn:oikumenea:` RID, so a type named `Rid`/`rid`
# cannot be used. Localized `name` is returned as an inline map<string,string> (locale->text), all
# enabled locales, NO Accept-Language negotiation (D-i18n); the owning module assembles it from its
# default-locale `name` column + the localization store. Generated Go lands in internal/conjure and
# is never hand-edited.
#
# Endpoints declare `auth: header` so the contract carries the bearer token from now on; the
# unit-scoped `unit.*` / instance-scoped `graph.*`/`closure.rebuild` permission checks and the
# shadow-visibility gate land once authorization (M7) + identity-federation (M8) do. Writes are
# recorded in the audit log in-process (D-Audit).
types:
  definitions:
    default-package: oikumenea.tenant
    objects:
      Visibility:
        docs: A unit's read-time visibility. SHADOW units are filtered by the shadow gate (M7).
        values:
          - PUBLIC
          - SHADOW
      UnitState:
        docs: |
          A unit's (or organization's) lifecycle state. Transitions are reversible and recorded as
          append-only events. Organizations reuse this enum (D-TenantOrganizations, M40).
        values:
          - ACTIVE
          - SUSPENDED
          - ARCHIVED
      Domain:
        docs: |
          An org-kind catalog row (D-TenantOrganizations, M40): military/government/company/
          university/church/public-org, … Classifies organizations and units; a directory attribute,
          never a PDP input. `code` is the stable external reference; `name` is the locale->text map.
        fields:
          id:
            type: string
            docs: The domain's URN RID (carried as a plain string).
          code:
            type: string
            docs: Stable, locale-agnostic identifier (e.g. military, university). Immutable by convention.
          name:
            type: map<string, string>
            docs: locale->text display name (all enabled locales; D-i18n).
          status:
            type: string
            docs: active | retired (catalog soft-state).
          sortOrder: optional<integer>
      UnitKind:
        docs: |
          A domain-scoped unit-kind catalog row (D-TenantOrganizations, M40) replacing the former
          free-text unitKind (military→brigade/battalion/platoon; university→faculty/department/chair).
        fields:
          id:
            type: string
            docs: The unit-kind's URN RID.
          domainId:
            type: string
            docs: The owning domain's RID; codes are unique per domain.
          code:
            type: string
            docs: Stable identifier, unique among active kinds of the same domain.
          name:
            type: map<string, string>
            docs: locale->text display name.
          attrSchema:
            type: optional<any>
            docs: Optional JSON schema validating a unit's metadata for this kind.
          status:
            type: string
            docs: active | retired.
          sortOrder: optional<integer>
      Organization:
        docs: |
          The realm a person joins (D-TenantOrganizations, M40): US Army / Bundeswehr / KhNU. Many
          organizations may share a domain. Owns units and per-org graphs. A directory attribute,
          never a PDP input — authority flows only through its graphs.
        fields:
          id:
            type: string
            docs: The organization's URN RID.
          code:
            type: string
            docs: Stable, locale-agnostic identifier (D-Code; NOT NULL UNIQUE, immutable by convention).
          name:
            type: map<string, string>
            docs: locale->text display name.
          domainId:
            type: string
            docs: The organization's domain (its kind) RID.
          visibility: Visibility
          state: UnitState
          metadata:
            type: optional<any>
            docs: Free-form long-tail attributes (JSONB).
          createdAt: datetime
          updatedAt: datetime
      Unit:
        docs: A node in the org graph. `code` is the stable external reference; `name` is the locale->text map.
        fields:
          id:
            type: string
            docs: The unit's URN RID (carried as a plain string).
          orgId:
            type: string
            docs: The owning organization's RID (D-TenantOrganizations, M40).
          domainId:
            type: string
            docs: The unit's domain (kind class) RID; defaults to the org's domain, may differ (mixed trees). Never a PDP input.
          kindId:
            type: optional<string>
            docs: The unit's domain-scoped unit-kind RID (replaces the former free-text unitKind). Never branched on in code.
          code:
            type: optional<string>
            docs: Optional human-readable business ID (D-UnitCodeLifecycle, M28); absent = a non-separate sub-unit. The RID (id) is the stable external handle. Unique among active units that have a code; set/corrected/cleared via PUT /units/{id}/code.
          name:
            type: map<string, string>
            docs: locale->text display name (all enabled locales; default-locale fallback + i18n store).
          level:
            type: optional<integer>
            docs: Optional ordinal for sort/filter; never a PDP or shadow-gate input.
          visibility: Visibility
          state: UnitState
          metadata:
            type: optional<any>
            docs: Free-form long-tail attributes (JSONB).
          createdAt: datetime
          updatedAt: datetime
      UnitLanguage:
        docs: |
          A unit's official/working language (D-Languages, M18; Link link__unit_language). languageId
          references a Glottolog languoid (LanguageService); name is its translatable display name.
        fields:
          id: string
          unitId: string
          languageId:
            type: string
            docs: The languoid's URN RID (resolve via GET /language/v1/languages).
          name:
            type: map<string, string>
            docs: The languoid's translatable display name as a locale -> text map (all enabled locales; D-i18n).
          isOfficial:
            type: boolean
            docs: Whether the language is official (vs. merely working) for the unit.
      Graph:
        docs: A named hierarchy over the units (D-Graphs), per organization (M40). Each graph is independently a DAG.
        fields:
          id:
            type: string
            docs: The graph's URN RID (carried as a plain string).
          orgId:
            type: optional<string>
            docs: The owning organization's RID (D-TenantOrganizations, M40); ABSENT = an instance-global/cross-org graph (e.g. religion's taxonomy graphs).
          code:
            type: string
            docs: Stable, locale-agnostic identifier (e.g. command, operational); unique per org (or among global graphs); referenced by edges/closure/assignments.
          name:
            type: map<string, string>
            docs: locale->text display name.
          isDefault:
            type: boolean
            docs: The graph a subtree grant uses when none is named; exactly one default exists (seeded command).
          isAuthorityBearing:
            type: boolean
            docs: Whether the PDP cascades subtree grants over this graph (D-DirectoryGraphs). command is locked TRUE.
      UnitEdge:
        docs: A directed parent->child relationship within one graph (link__parent_of).
        fields:
          id:
            type: string
            docs: The edge's URN RID (carried as a plain string).
          graph:
            type: string
            docs: The graph code this edge belongs to.
          parentId: string
          childId: string
          createdAt: datetime
      UnitRef:
        docs: A lightweight unit reference with its closure depth (ancestor/descendant listings).
        fields:
          id: string
          code:
            type: optional<string>
            docs: Optional human-readable code (absent for a codeless sub-unit; D-UnitCodeLifecycle).
          name: map<string, string>
          depth:
            type: integer
            docs: Closure distance from the queried unit (shortest path in the DAG).
      UnitPage:
        docs: A page of units plus the opaque token for the next page (empty when exhausted).
        fields:
          units: list<Unit>
          nextPageToken: optional<string>
      FacetBucket:
        docs: |
          One bucket of a facet distribution (M57 / D-ObjectFacets).

          `key` is the bucket's stable, locale-agnostic identity — an enum value (`shadow`), a band
          (`2-3`), `true`/`false`, or a RID for a `ref` facet — and is exactly what you pass back as
          the corresponding list filter. Two synthetic keys never name a real value: `(unknown)` is
          the NULL bucket and `(other)` a top-N facet's collapsed tail; neither is a usable filter
          value.

          `label` carries the object's display name as a locale → text map (D-i18n) and is present
          only for `ref` buckets, whose keys are RIDs. Best effort: an id with no resolvable name
          carries no label.
        fields:
          key: string
          label: optional<map<string, string>>
          count: integer
      FacetDistribution:
        docs: |
          One facet's buckets, in chart order — for an enum, the declared CHECK-set order with
          zero-count buckets included so a chart's shape is stable; for bands, the declared band
          order; for a ref, descending by count with `(other)`/`(unknown)` last.
        fields:
          facet: string
          buckets: list<FacetBucket>
      UnitStats:
        docs: |
          Facet distributions over the SAME set `listUnits` returns under the same filters, with the
          shadow-visibility gate folded INTO the count (D-ObjectFacets): a shadow unit outside the
          caller's reach is not counted at all, rather than counted and then trimmed.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
      OrganizationStats:
        docs: |
          Facet distributions over the SAME set `listOrganizations` returns under the same filters,
          with the shadow gate folded INTO the count (M58 / D-ObjectFacets).

          For an organization that gate is `public OR reachable`, where reach is DERIVED from unit
          reach (M58 ticket 4 follow-up, amending D-VisibilityScope): an organization is visible when
          any of its live units is in the subject's reach. It is not the unit dashboard's predicate
          copied — a role assignment's `target_unit_id` FKs `tenant_units`, so an organization RID can
          never appear in a readable-unit set and that predicate would match nothing here. It is
          exactly what `gateOrgs` leaves on the list, which is why `totalCount` equals the rows
          exhaustively paging `listOrganizations` under these filters would return.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
      UnitRefList:
        docs: An ordered list of unit references (ancestors), nearest first.
        fields:
          units: list<UnitRef>
      UnitRefPage:
        docs: A page of unit references (descendants) plus the opaque next-page token.
        fields:
          units: list<UnitRef>
          nextPageToken: optional<string>
      GraphList:
        docs: The graph registry, in display order.
        fields:
          graphs: list<Graph>
      ClosureReport:
        docs: The result of a closure verify/rebuild for one graph (D-ClosureIntegrity / D-ClosureDriftHealth).
        fields:
          graph:
            type: string
            docs: The graph code this report covers.
          missingCount:
            type: integer
            docs: Closure rows the recompute found missing vs. the stored closure.
          extraCount:
            type: integer
            docs: Spurious stored closure rows the recompute did not produce.
          inDrift: boolean
          sample:
            type: optional<any>
            docs: Optional small drift sample for diagnostics.
      ClosureReportList:
        docs: Per-graph closure reports (one per graph processed).
        fields:
          reports: list<ClosureReport>
      CreateUnitRequest:
        docs: Create a unit. `name` is the default-locale text; other locales are managed via LocalizationService.
        fields:
          orgId:
            type: string
            docs: The owning organization's RID (required; D-TenantOrganizations, M40).
          domainId:
            type: optional<string>
            docs: The unit's domain RID; defaults to the organization's domain when omitted. May differ (mixed trees).
          kindId:
            type: optional<string>
            docs: The unit's domain-scoped unit-kind RID (replaces free-text unitKind). Must belong to the unit's domain.
          code:
            type: optional<string>
            docs: Optional human-readable code (omit for a non-separate sub-unit; D-UnitCodeLifecycle, M28).
          name: string
          level: optional<integer>
          visibility:
            type: optional<Visibility>
            docs: Defaults to PUBLIC.
          metadata: optional<any>
      UpdateUnitRequest:
        docs: Update name/kind/domain/level/metadata/visibility. Omitted fields are unchanged. `code` is excluded — set it via PUT /units/{id}/code (D-UnitCodeLifecycle). `orgId` is immutable.
        fields:
          name: optional<string>
          domainId:
            type: optional<string>
            docs: Re-classify the unit's domain (mixed trees allowed). The kind, if set, must match.
          kindId: optional<string>
          level: optional<integer>
          visibility: optional<Visibility>
          metadata: optional<any>
      DomainList:
        docs: The domain (org-kind) catalog, in display order.
        fields:
          domains: list<Domain>
      CreateDomainRequest:
        docs: Add an org-kind domain to the catalog (instance-admin; domain.manage).
        fields:
          code: string
          name: string
          sortOrder: optional<integer>
      UpdateDomainRequest:
        docs: Rename / retire a domain. Omitted fields are unchanged. `code` is immutable.
        fields:
          name: optional<string>
          status: optional<string>
          sortOrder: optional<integer>
      UnitKindList:
        docs: The unit-kind catalog for a domain, in display order.
        fields:
          unitKinds: list<UnitKind>
      CreateUnitKindRequest:
        docs: Add a domain-scoped unit kind (instance-admin; unit-kind.manage).
        fields:
          domainId: string
          code: string
          name: string
          attrSchema: optional<any>
          sortOrder: optional<integer>
      UpdateUnitKindRequest:
        docs: Rename / retire a unit kind or adjust its attr schema. Omitted fields are unchanged. `code`/`domainId` are immutable.
        fields:
          name: optional<string>
          attrSchema: optional<any>
          status: optional<string>
          sortOrder: optional<integer>
      OrganizationPage:
        docs: A page of organizations plus the opaque token for the next page (empty when exhausted).
        fields:
          organizations: list<Organization>
          nextPageToken: optional<string>
      CreateOrganizationRequest:
        docs: |
          Create an organization (the realm). Seeds its `command` (default, locked authority-bearing,
          undeletable) + `operational` graphs in the same transaction (D-TenantOrganizations, M40).
        fields:
          code: string
          name: string
          domainId:
            type: string
            docs: The organization's domain (its kind) RID.
          visibility:
            type: optional<Visibility>
            docs: Defaults to PUBLIC.
          metadata: optional<any>
      UpdateOrganizationRequest:
        docs: Update name/domain/metadata/visibility. Omitted fields are unchanged. `code` is immutable; state is changed via PUT /organizations/{id}/state.
        fields:
          name: optional<string>
          domainId: optional<string>
          visibility: optional<Visibility>
          metadata: optional<any>
      SetUnitCodeRequest:
        docs: |
          Set, correct, or clear a unit's code (D-UnitCodeLifecycle, M28). An omitted `code` CLEARS the
          code (the unit becomes a non-separate sub-unit). `reason` is recorded on the append-only ledger.
        fields:
          code:
            type: optional<string>
            docs: The new code; omit to clear the code (NULL). Must be unique among active coded units.
          reason:
            type: optional<string>
            docs: Optional free-text reason recorded in the code-change ledger.
      UnitCodeEvent:
        docs: One entry in a unit's append-only code-change ledger (D-UnitCodeLifecycle, M28).
        fields:
          id:
            type: string
            docs: The event's URN RID.
          unitId: string
          oldCode:
            type: optional<string>
            docs: The code before the change (absent = the unit was codeless).
          newCode:
            type: optional<string>
            docs: The code after the change (absent = the code was cleared).
          reason: optional<string>
          createdAt: datetime
      UnitCodeEventList:
        docs: A unit's code-change history, newest first.
        fields:
          events: list<UnitCodeEvent>
      AddEdgeRequest:
        docs: Attach the path unit as a child of `parentId` within a graph.
        fields:
          parentId: string
          graph:
            type: optional<string>
            docs: The graph code; defaults to command.
      TransitionRequest:
        docs: Transition a unit's lifecycle state (suspend/archive/restore).
        fields:
          toState: UnitState
          reason: optional<string>
      AddGraphRequest:
        docs: Add a graph (instance-admin; graph.manage). Per-org when orgId is set, else instance-global (M40).
        fields:
          orgId:
            type: optional<string>
            docs: The organization the new graph belongs to; omit for an instance-global/cross-org graph.
          code: string
          name: string
          isAuthorityBearing:
            type: optional<boolean>
            docs: Defaults to true.
      UpdateGraphRequest:
        docs: Rename / set default / flip isAuthorityBearing (guarded). Omitted fields are unchanged.
        fields:
          name: optional<string>
          isDefault:
            type: optional<boolean>
            docs: Setting true makes this the sole default; the previous default is cleared in the same transaction.
          isAuthorityBearing: optional<boolean>
      UpsertUnitLanguageRequest:
        docs: Add or update a unit's official/working language (keyed on languageId).
        fields:
          languageId:
            type: string
            docs: The languoid's URN RID.
          isOfficial:
            type: optional<boolean>
            docs: Defaults to true (official); false marks a working language.
    errors:
      UnitNotFound:
        namespace: Tenant
        code: NOT_FOUND
        safe-args:
          unitId: string
      UnitCodeConflict:
        docs: A unit with this code already exists.
        namespace: Tenant
        code: CONFLICT
        safe-args:
          code: string
      UnitCycleDetected:
        docs: Adding the edge would create a cycle within its graph (the child already reaches the parent).
        namespace: Tenant
        code: CONFLICT
        safe-args:
          graph: string
          parentId: string
          childId: string
      UnitInvalid:
        docs: The unit's code or name is malformed, or the request is otherwise invalid.
        namespace: Tenant
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      OrganizationInvalid:
        docs: |
          The organization's filter or facet arguments are malformed — a non-RID `domain`, a
          `visibility`/`state` value outside its CHECK set, or an undeclared facet key on
          `organizationStats`.
        namespace: Tenant
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      TransitionInvalid:
        docs: The requested lifecycle transition is not permitted from the unit's current state.
        namespace: Tenant
        code: FAILED_PRECONDITION
        safe-args:
          reason: string
      GraphNotFound:
        namespace: Tenant
        code: NOT_FOUND
        safe-args:
          graph: string
      GraphCodeConflict:
        docs: A graph with this code already exists.
        namespace: Tenant
        code: CONFLICT
        safe-args:
          code: string
      GraphInUse:
        docs: The graph cannot be deleted while it has live edges (or, post-M7, active subtree assignments).
        namespace: Tenant
        code: FAILED_PRECONDITION
        safe-args:
          graph: string
      GraphProtected:
        docs: The command graph cannot be deleted or made directory-only; at least one graph must remain (per org).
        namespace: Tenant
        code: FAILED_PRECONDITION
        safe-args:
          reason: string
      DomainNotFound:
        namespace: Tenant
        code: NOT_FOUND
        safe-args:
          domainId: string
      DomainCodeConflict:
        docs: A domain with this code already exists.
        namespace: Tenant
        code: CONFLICT
        safe-args:
          code: string
      UnitKindNotFound:
        namespace: Tenant
        code: NOT_FOUND
        safe-args:
          unitKindId: string
      UnitKindCodeConflict:
        docs: A unit kind with this code already exists in the domain.
        namespace: Tenant
        code: CONFLICT
        safe-args:
          domainId: string
          code: string
      OrganizationNotFound:
        namespace: Tenant
        code: NOT_FOUND
        safe-args:
          orgId: string
      OrganizationCodeConflict:
        docs: An organization with this code already exists.
        namespace: Tenant
        code: CONFLICT
        safe-args:
          code: string
services:
  TenantService:
    name: Tenant Service
    package: oikumenea.tenant
    base-path: /tenant/v1
    default-auth: header
    docs: |
      The unit graph, its per-graph closure, and the graph registry (D-Graphs). Reads pass the
      shadow-visibility gate and are gated by `unit.read`/`graph.read`; writes are unit-scoped
      (`unit.create`/`unit.update`/`unit.edges.*`/`unit.lifecycle`) or instance-scoped
      (`graph.manage`/`closure.rebuild`) — all enforced once authorization lands (M7).
    endpoints:
      createUnit:
        http: POST /units
        docs: Create a unit. Returns Tenant:UnitCodeConflict if the code is taken among active units.
        args:
          request: CreateUnitRequest
        returns: Unit
      getUnit:
        http: GET /units/{unitId}
        docs: Read one unit by RID (shadow-gated once authz lands).
        args:
          unitId:
            type: string
            param-type: path
        returns: Unit
      updateUnit:
        http: PUT /units/{unitId}
        docs: Update name/kind/level/metadata/visibility. `code` is excluded — use setUnitCode.
        args:
          unitId:
            type: string
            param-type: path
          request: UpdateUnitRequest
        returns: Unit
      setUnitCode:
        http: PUT /units/{unitId}/code
        docs: |
          Set, correct, or clear the unit's code (audited; appends a tenant_unit_code_events row).
          Returns Tenant:UnitCodeConflict if the code is taken among active units. Requires unit.recode.
        args:
          unitId:
            type: string
            param-type: path
          request: SetUnitCodeRequest
        returns: Unit
      listUnitCodeEvents:
        http: GET /units/{unitId}/code-events
        docs: A unit's code-change history, newest first (D-UnitCodeLifecycle, M28).
        args:
          unitId:
            type: string
            param-type: path
        returns: UnitCodeEventList
      listUnits:
        http: GET /units
        docs: |
          List/search units within an organization (D-TenantOrganizations, M40). `org` is REQUIRED —
          a fully-unscoped listing is rejected with Tenant:UnitInvalid. Optionally narrowed by the
          unit facet set (D-ObjectFacets, M56): `domain` (cross-cut within the org, for mixed trees),
          `unitKind`, `level` / `levelMin` / `levelMax`, `visibility`, `state` and `pdpScoped`.
          Token-paginated.

          The shadow-visibility gate still trims the page AFTER it is cut, so `visibility` NARROWS and
          never widens: asking for `visibility=shadow` without shadow reach yields an empty page, not
          an error and not a leak.

          For hierarchical (expand-on-click) browsing in graph `graph` (default `command`): pass
          `rootsOnly=true` to list only the org's top-level units (those with no parent in the graph),
          or `parent=<unitRid>` to list a unit's DIRECT children in the graph. The two are mutually
          exclusive, and each ignores the flat-listing filters
          (`domain`/`unitKind`/`level`/`levelMin`/`levelMax`/`visibility`/`state`/`pdpScoped`). When neither is set the
          listing is the flat, filtered org listing.
        args:
          org:
            type: string
            param-type: query
            docs: REQUIRED — the organization RID to scope the listing to.
          domain:
            type: optional<string>
            param-type: query
            docs: Optional domain RID filter (units of this kind within the org). Ignored when `parent`/`rootsOnly` is set.
          unitKind:
            type: optional<string>
            param-type: query
            docs: Optional unit-kind RID filter. Ignored when `parent`/`rootsOnly` is set.
          level:
            type: optional<integer>
            param-type: query
            docs: |
              Optional exact-match level filter, and the arg this endpoint has always shipped.
              SUPERSEDED by `levelMin`/`levelMax` (an exact match is `levelMin=n&levelMax=n`); it is
              retained because the contract is expand-only, and it still applies when set — the three
              are ANDed. Ignored when `parent`/`rootsOnly` is set.
          levelMin:
            type: optional<integer>
            param-type: query
            docs: |
              Facet filter — INCLUSIVE lower bound on `level` (M57 ticket 3, D-ObjectFacets). The pair
              is what makes the `level` DISTRIBUTION's bands click-through: a band is a range, and no
              single value expresses one. Units with no level are excluded whenever either bound is
              set (SQL three-valued logic), so the `(unknown)` bucket stays reachable only by leaving
              both unset. Ignored when `parent`/`rootsOnly` is set.
          levelMax:
            type: optional<integer>
            param-type: query
            docs: Facet filter — INCLUSIVE upper bound on `level`. See `levelMin`. Ignored when `parent`/`rootsOnly` is set.
          visibility:
            type: optional<string>
            param-type: query
            docs: Facet filter — `public` or `shadow`. NARROWS only; the shadow gate still trims the page afterwards. Ignored when `parent`/`rootsOnly` is set.
          state:
            type: optional<string>
            param-type: query
            docs: Facet filter — `active`, `suspended` or `archived`. Ignored when `parent`/`rootsOnly` is set.
          pdpScoped:
            type: optional<boolean>
            param-type: query
            docs: Facet filter — `true` for operational (reach-scoped) units, `false` for reference units such as universities and companies (D-UnifiedOrgGraph, M41). Ignored when `parent`/`rootsOnly` is set.
          graph:
            type: optional<string>
            param-type: query
            docs: Graph code for `parent`/`rootsOnly` hierarchy queries (default `command`). Ignored for the flat listing.
          parent:
            type: optional<string>
            param-type: query
            docs: When set, list the DIRECT children of this unit RID within `graph`. Mutually exclusive with `rootsOnly`.
          rootsOnly:
            type: optional<boolean>
            param-type: query
            docs: When true, list only the org's root units (no parent within `graph`). Mutually exclusive with `parent`.
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: UnitPage
      unitStats:
        http: GET /stats/units
        docs: |
          Facet distributions for an organization's units — the dashboard half of the facet
          vocabulary (M57 / D-ObjectFacets). Takes exactly the FLAT-listing filter args `listUnits`
          takes (minus paging and the `graph`/`parent`/`rootsOnly` traversal args, which switch that
          endpoint to a hierarchy walk rather than adding a predicate), so a dashboard and a list are
          two renderings of one request state.

          `org` is REQUIRED, as on `listUnits`. The shadow gate is folded into SQL here: on the list
          it trims the page after it is cut — correct for a page, wrong for a count — so
          `totalCount` equals the number of rows exhaustively paging `listUnits` with these filters
          would return.

          The path is `/stats/units` rather than `/units/stats` because the server's router rejects a
          literal path segment that is a sibling of `{unitId}` — see the route-conflict guard in
          `internal/platform/transport`.
        args:
          org:
            type: string
            param-type: query
            docs: REQUIRED — the organization RID to scope the counts to.
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`unitKind,level,state`). Omitted or
              empty = every facet the caller may read; an explicit list of nothing (`facets=,`)
              returns `totalCount` alone. An undeclared facet key is a Tenant:UnitInvalid.
          domain:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listUnits`.
          unitKind:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listUnits`.
          level:
            type: optional<integer>
            param-type: query
            docs: Facet filter — exact-match level, the scalar arg `listUnits` has always shipped and still honours. Superseded by `levelMin`/`levelMax`; see `listUnits`.
          levelMin:
            type: optional<integer>
            param-type: query
            docs: Facet filter — INCLUSIVE lower bound on `level`, the args the `level` distribution's bands filter by. See `listUnits`.
          levelMax:
            type: optional<integer>
            param-type: query
            docs: Facet filter — INCLUSIVE upper bound on `level`. See `listUnits`.
          visibility:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listUnits`. Narrows only; asking for `shadow` without shadow reach counts zero rather than erroring.
          state:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listUnits`.
          pdpScoped:
            type: optional<boolean>
            param-type: query
            docs: Facet filter — see `listUnits`.
        returns: UnitStats
      organizationStats:
        http: GET /stats/organizations
        docs: |
          Facet distributions over the organization registry — the dashboard half of the
          organization facet vocabulary (M58 / D-ObjectFacets). Takes exactly the filter args
          `listOrganizations` takes, minus paging, so a dashboard and a list are two renderings of
          one request state.

          Unlike `unitStats` there is no `org` arg: the organization registry is the instance's
          whole realm catalog, not a per-org tree.

          The shadow gate is folded into SQL: on the list `gateOrgs` trims the page once it is cut,
          which is right for a page and wrong for a count. Organization reach is DERIVED from unit
          reach (M58 ticket 4 follow-up): an organization is visible when it is public, or when any
          of its live units is in the subject's reach. `totalCount` therefore equals the rows
          exhaustively paging `listOrganizations` under these filters would return.

          The path is `/stats/organizations` rather than `/organizations/stats` because the server's
          router rejects a literal path segment that is a sibling of `{orgId}` — see the
          route-conflict guard in `internal/platform/transport`.
        args:
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`domain,state`). Omitted or empty =
              every facet the caller may read; an explicit list of nothing (`facets=,`) returns
              `totalCount` alone. An undeclared facet key is a Tenant:OrganizationInvalid.
          domain:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listOrganizations`.
          visibility:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listOrganizations`. Narrows only; asking for `shadow` without instance-admin standing counts zero rather than erroring.
          state:
            type: optional<string>
            param-type: query
            docs: Facet filter — see `listOrganizations`.
        returns: OrganizationStats
      addEdge:
        http: POST /units/{unitId}/edges
        docs: Attach the path unit as a child of parentId within a graph (default command). Returns Tenant:UnitCycleDetected on a cycle.
        args:
          unitId:
            type: string
            param-type: path
          request: AddEdgeRequest
        returns: UnitEdge
      removeEdge:
        http: DELETE /units/{unitId}/edges
        docs: Detach the path unit from a parent within a graph.
        args:
          unitId:
            type: string
            param-type: path
          parentId:
            type: string
            param-type: query
          graph:
            type: optional<string>
            param-type: query
      unitAncestors:
        http: GET /units/{unitId}/ancestors
        docs: Ancestors of the unit in graph `graph` (default command), nearest first.
        args:
          unitId:
            type: string
            param-type: path
          graph:
            type: optional<string>
            param-type: query
        returns: UnitRefList
      unitDescendants:
        http: GET /units/{unitId}/descendants
        docs: The unit's subtree in graph `graph` (default command), token-paginated.
        args:
          unitId:
            type: string
            param-type: path
          graph:
            type: optional<string>
            param-type: query
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: UnitRefPage
      transitionUnit:
        http: POST /units/{unitId}/transition
        docs: Transition the unit's lifecycle state. Returns Tenant:TransitionInvalid for an illegal transition.
        args:
          unitId:
            type: string
            param-type: path
          request: TransitionRequest
        returns: Unit
      listUnitLanguages:
        http: GET /units/{unitId}/languages
        docs: List a unit's official/working languages (D-Languages, M18).
        args:
          unitId:
            type: string
            param-type: path
        returns: list<UnitLanguage>
      upsertUnitLanguage:
        http: PUT /units/{unitId}/languages
        docs: |
          Add or update a unit's official/working language (keyed on languageId). Returns
          Tenant:UnitInvalid when languageId does not resolve to a languoid.
        args:
          unitId:
            type: string
            param-type: path
          request: UpsertUnitLanguageRequest
        returns: UnitLanguage
      deleteUnitLanguage:
        http: DELETE /units/{unitId}/languages/{languageId}
        docs: Remove a unit's language by languoid id. Idempotent within the active set.
        args:
          unitId:
            type: string
            param-type: path
          languageId:
            type: string
            param-type: path
      verifyClosure:
        http: POST /closure/verify
        docs: Diff the stored closure vs. the edges and upsert the per-graph drift status (default all graphs).
        args:
          graph:
            type: optional<string>
            param-type: query
        returns: ClosureReportList
      rebuildClosure:
        http: POST /closure/rebuild
        docs: Truncate + recompute the closure, one transaction per graph (default all graphs).
        args:
          graph:
            type: optional<string>
            param-type: query
        returns: ClosureReportList
      listGraphs:
        http: GET /graphs
        docs: |
          List graphs in display order (M40). With `org`, returns that organization's graphs plus the
          instance-global graphs; without `org`, returns only the instance-global graphs.
        args:
          org:
            type: optional<string>
            param-type: query
            docs: Optional organization RID; when set, the org's graphs are returned alongside global graphs.
        returns: GraphList
      addGraph:
        http: POST /graphs
        docs: Add a graph. Returns Tenant:GraphCodeConflict if the code exists.
        args:
          request: AddGraphRequest
        returns: Graph
      updateGraph:
        http: PUT /graphs/{graphId}
        docs: Rename / set default / flip isAuthorityBearing (guarded; command is locked authority-bearing).
        args:
          graphId:
            type: string
            param-type: path
          request: UpdateGraphRequest
        returns: Graph
      deleteGraph:
        http: DELETE /graphs/{graphId}
        docs: Delete a graph (blocked for command, or while it has live edges).
        args:
          graphId:
            type: string
            param-type: path
      listDomains:
        http: GET /domains
        docs: List the org-kind domain catalog in display order (D-TenantOrganizations, M40). Gated by domain.read.
        returns: DomainList
      createDomain:
        http: POST /domains
        docs: Add a domain (instance-admin; domain.manage). Returns Tenant:DomainCodeConflict if the code exists.
        args:
          request: CreateDomainRequest
        returns: Domain
      updateDomain:
        http: PUT /domains/{domainId}
        docs: Rename / retire a domain. Returns Tenant:DomainNotFound.
        args:
          domainId:
            type: string
            param-type: path
          request: UpdateDomainRequest
        returns: Domain
      listUnitKinds:
        http: GET /unit-kinds
        docs: List the unit-kind catalog for a domain (D-TenantOrganizations, M40). Gated by unit-kind.read.
        args:
          domain:
            type: string
            param-type: query
            docs: REQUIRED — the domain RID whose unit kinds to list.
        returns: UnitKindList
      createUnitKind:
        http: POST /unit-kinds
        docs: Add a domain-scoped unit kind (instance-admin; unit-kind.manage). Returns Tenant:UnitKindCodeConflict.
        args:
          request: CreateUnitKindRequest
        returns: UnitKind
      updateUnitKind:
        http: PUT /unit-kinds/{unitKindId}
        docs: Rename / retire a unit kind or adjust its attr schema. Returns Tenant:UnitKindNotFound.
        args:
          unitKindId:
            type: string
            param-type: path
          request: UpdateUnitKindRequest
        returns: UnitKind
      listOrganizations:
        http: GET /organizations
        docs: |
          List organizations, token-paginated, optionally filtered by domain, visibility and state
          (D-TenantOrganizations, M40; facet vocabulary M58 / D-ObjectFacets). Shadow-gated. Gated by
          organization.read. A malformed filter is a Tenant:OrganizationInvalid.
        args:
          domain:
            type: optional<string>
            param-type: query
            docs: Optional domain RID filter (organizations of this kind).
          visibility:
            type: optional<string>
            param-type: query
            docs: |
              Facet filter — `public` | `shadow`. Narrows only (D-VisibilityScope): asking for
              `shadow` returns the shadow organizations the caller can REACH, and an empty page
              rather than an error when that is none. Organization reach is DERIVED from unit reach
              (M58 ticket 4 follow-up) — an organization is visible when any of its live units is in
              the subject's reach.
          state:
            type: optional<string>
            param-type: query
            docs: Facet filter — `active` | `suspended` | `archived`.
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: OrganizationPage
      createOrganization:
        http: POST /organizations
        docs: |
          Create an organization and seed its command + operational graphs in one transaction
          (organization.create). Returns Tenant:OrganizationCodeConflict if the code exists.
        args:
          request: CreateOrganizationRequest
        returns: Organization
      getOrganization:
        http: GET /organizations/{orgId}
        docs: |
          Read one organization by RID, shadow-gated. A `shadow` organization the caller cannot reach
          is `Tenant:OrganizationNotFound` — the SAME error a RID that names nothing gets, because
          `shadow` hides EXISTENCE (F-002 / D-VisibilityScope) and a permission error would confirm
          the organization is real.

          This line already said "(shadow-gated)" before M58 ticket 4 and the implementation applied
          no gate at all: `listOrganizations` trimmed shadow organizations while this endpoint handed
          them over to anyone holding `organization.read`. Fixed there; the two surfaces now share one
          gate rather than one of them being remembered.
        args:
          orgId:
            type: string
            param-type: path
        returns: Organization
      updateOrganization:
        http: PUT /organizations/{orgId}
        docs: Update an organization's name/domain/metadata/visibility (organization.update).
        args:
          orgId:
            type: string
            param-type: path
          request: UpdateOrganizationRequest
        returns: Organization
      transitionOrganization:
        http: PUT /organizations/{orgId}/state
        docs: Transition an organization's lifecycle state (organization.lifecycle). Returns Tenant:TransitionInvalid for an illegal transition.
        args:
          orgId:
            type: string
            param-type: path
          request: TransitionRequest
        returns: Organization
      listOrganizationGraphs:
        http: GET /organizations/{orgId}/graphs
        docs: List an organization's graph registry (alias of GET /graphs?org=, path-scoped).
        args:
          orgId:
            type: string
            param-type: path
        returns: GraphList
