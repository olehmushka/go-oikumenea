# Vehicle module API (M26). A generic vehicle registry binding people AND companies to vehicles in one
# queryable graph (docs/modules/vehicle.md / D-Vehicles): a brand/model/type taxonomy, the physical
# vehicle (VIN), the brand->manufacturer link (to a M21 company), and the ownership+plate registration
# record. Volatile vehicle intelligence (insurance/inspection/accidents/telematics) is PARKED (DS-52);
# column-izing stabilized specs out of `attributes` is parked (DS-53).
#
# RID-bearing fields are typed `string` (the canonical RID text): Conjure reserves `rid` as a built-in
# primitive, so a type named `Rid` cannot be used. Translatable labels (type/brand/model/plate-type
# names) are returned as a `locale -> text` map assembled from the i18n store (D-i18n: all locales in
# every response, no negotiation); create/update requests carry the default-locale value as a plain
# `string`. Vehicle entities carry no unit scope of their own (external reference data), so reads gate
# on `vehicle.read`, vehicle/registration/manufacturer writes on `vehicle.manage`, catalog management
# on the instance-scope `vehicle.catalog.manage` — all satisfied anywhere via the PEP. Writes are
# audited in-process under a `system` actor (D-Audit). The plate REGION is a geo_places RID (placetype
# = region) resolved via GeoService.listPlaces. Generated Go lands in internal/conjure, never hand-edited.
types:
  definitions:
    default-package: oikumenea.vehicle
    objects:
      # ---- reference catalogs ----
      VehicleType:
        docs: A vehicle taxonomy node (car/truck/motorcycle…); a shallow tree (parentId + denormalized rootId).
        fields:
          id: string
          code: string
          name:
            type: map<string, string>
            docs: Default-locale fallback + i18n translations.
          parentId: optional<string>
          rootId: optional<string>
          status: string
          sortOrder: optional<integer>
      Brand:
        docs: A vehicle marque (Toyota/BMW…); countryId is the country of origin (nullable).
        fields:
          id: string
          code: string
          name: map<string, string>
          countryId: optional<string>
          status: string
          sortOrder: optional<integer>
      Model:
        docs: A model under a brand (containment); generation + the manufacture window are structural specs.
        fields:
          id: string
          brandId: string
          code: string
          name: map<string, string>
          generation: optional<string>
          manufactureStart: optional<string>
          manufactureEnd: optional<string>
          status: string
          sortOrder: optional<integer>
      RegistrationNumberType:
        docs: A plate-type catalog entry (regular/temporary/transit/diplomatic/military/old…).
        fields:
          id: string
          code: string
          name: map<string, string>
          status: string
          sortOrder: optional<integer>
      # ---- objects ----
      Vehicle:
        docs: A physical vehicle at registry grade. Soft-deleted, not destroyed. The RID is the external handle.
        fields:
          id: string
          typeId: string
          typeLabel:
            type: optional<string>
            docs: Best-effort default-locale type name.
          modelId: optional<string>
          modelLabel: optional<string>
          brandId:
            type: optional<string>
            docs: The brand of the model (derived), when a model is set.
          brandLabel: optional<string>
          vin: optional<string>
          colorId:
            type: optional<string>
            docs: The vehicle's color — a platform_colors RID (domain='vehicle', D-Color). Resolve label/hex via the platform color catalog.
          manufactureDate: optional<string>
          attributes:
            type: optional<string>
            docs: Long-tail spec grab-bag as a JSON string (DS-53 will column-ize stabilized fields).
          status:
            type: string
            docs: One of active | scrapped | exported.
          createdAt: datetime
          updatedAt: datetime
      # ---- reified links ----
      Manufacturer:
        docs: A brand is MANUFACTURED_BY a company (link__manufactured_by); temporal (changes with acquisitions).
        fields:
          id: string
          brandId: string
          companyId: string
          companyLabel:
            type: optional<string>
            docs: Best-effort company legal name.
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
          createdAt: datetime
          updatedAt: datetime
      Registration:
        docs: |
          The ownership+plate record (link__registered_to). The owner is a person OR a company
          (polymorphic). country/subdivision carry the registering country + optional plate region. A
          re-registration is a new row (the prior closed), so registration IS the ownership history.
        fields:
          id: string
          vehicleId: string
          ownerKind:
            type: string
            docs: One of person | company.
          ownerId: string
          ownerLabel:
            type: optional<string>
            docs: Best-effort display label (company legal name for company owners; empty for persons).
          countryId: string
          subdivisionId:
            type: optional<string>
            docs: The plate region — a geo_places RID (placetype=region).
          subdivisionLabel: optional<string>
          registrationNumber: string
          numberTypeId: optional<string>
          status:
            type: string
            docs: One of active | closed.
          effectiveFrom: datetime
          effectiveTo: optional<datetime>
          createdAt: datetime
          updatedAt: datetime
      # ---- person view ----
      PersonVehicleRegistration:
        docs: A vehicle registration a person owns, enriched with the vehicle's identity (read-only).
        fields:
          id: string
          vehicleId: string
          vin: optional<string>
          typeLabel: optional<string>
          brandLabel: optional<string>
          modelLabel: optional<string>
          registrationNumber: string
          countryId: string
          subdivisionLabel: optional<string>
          status: string
          effectiveFrom: datetime
          effectiveTo: optional<datetime>
      PersonVehicles:
        docs: A person's vehicle registrations (current + historical, newest first).
        fields:
          registrations: list<PersonVehicleRegistration>
      # ---- pages / lists ----
      VehiclePage:
        fields:
          vehicles: list<Vehicle>
          nextPageToken: optional<string>
      VehicleTypeList:
        fields:
          types: list<VehicleType>
      BrandList:
        fields:
          brands: list<Brand>
      ModelList:
        fields:
          models: list<Model>
      RegistrationNumberTypeList:
        fields:
          numberTypes: list<RegistrationNumberType>
      RegistrationList:
        fields:
          registrations: list<Registration>
      ManufacturerList:
        fields:
          manufacturers: list<Manufacturer>
      # ---- facet distributions (M58 / D-ObjectFacets) ----
      FacetBucket:
        docs: |
          One bucket of a facet distribution (M58 / D-ObjectFacets).

          `key` is the bucket's stable, locale-agnostic identity — an enum value, a `YYYY-MM` month,
          or a RID for a `ref` facet — and is exactly what you pass back as the corresponding query
          filter, which is what makes a chart segment and a filter the same act. Two synthetic keys
          never name a real value: `(unknown)` is the NULL bucket (mandatory for a nullable column,
          so the gap is visible rather than dropped) and `(other)` is a top-N facet's collapsed tail;
          neither is a usable filter value.

          `label` carries a display name as a locale → text map (D-i18n) and is present only for
          `ref` buckets, whose keys are RIDs. Best effort — an id with no resolvable name simply
          carries no label.
        fields:
          key: string
          label: optional<map<string, string>>
          count: integer
      FacetDistribution:
        docs: |
          One facet's buckets, in chart order — for an enum, the declared CHECK-set order with
          zero-count buckets included so a chart's shape is stable across filterings; for the
          manufactureDate histogram, ascending by month; for a ref facet, descending by count with
          `(other)`/`(unknown)` last.
        fields:
          facet: string
          buckets: list<FacetBucket>
      VehicleStats:
        docs: |
          Facet distributions over the SAME set `listVehicles` returns under the same filters
          (M58 / D-ObjectFacets): `totalCount` is what exhaustively paging that endpoint would yield,
          not an estimate and not a page count.

          Every facet here partitions the result set — each counted row lands in exactly one bucket
          of each distribution, so a distribution's counts sum to `totalCount`. `registrationCountry`
          partitions too, and does so BECAUSE it is confined to the one ACTIVE registration a vehicle
          may hold; the ownership history behind it is one-to-many and would not.
        fields:
          totalCount: integer
          facets: list<FacetDistribution>
      # ---- request bodies ----
      UpsertVehicleTypeRequest:
        docs: Create/update (by code) a vehicle-type catalog node. name is the default-locale fallback.
        fields:
          code: string
          name: string
          parentId: optional<string>
          sortOrder: optional<integer>
      UpsertBrandRequest:
        fields:
          code: string
          name: string
          countryId: optional<string>
          sortOrder: optional<integer>
      UpsertModelRequest:
        fields:
          code: string
          name: string
          generation: optional<string>
          manufactureStart: optional<string>
          manufactureEnd: optional<string>
          sortOrder: optional<integer>
      UpsertNumberTypeRequest:
        fields:
          code: string
          name: string
          sortOrder: optional<integer>
      CreateVehicleRequest:
        fields:
          typeId: string
          modelId: optional<string>
          vin: optional<string>
          colorId:
            type: optional<string>
            docs: A platform_colors RID (domain='vehicle', D-Color).
          manufactureDate: optional<string>
          attributes:
            type: optional<string>
            docs: A JSON object string; defaults to {}.
      UpdateVehicleRequest:
        docs: Update type/model/vin/colorId/date/attributes/status; omitted fields are unchanged.
        fields:
          typeId: optional<string>
          modelId: optional<string>
          vin: optional<string>
          colorId:
            type: optional<string>
            docs: A platform_colors RID (domain='vehicle', D-Color).
          manufactureDate: optional<string>
          attributes: optional<string>
          status: optional<string>
      RegisterVehicleRequest:
        docs: |
          Register the vehicle to a new owner (person or company). Any currently-active registration for
          the vehicle is closed first (registration is the ownership history), so this also performs a
          transfer. subdivisionId (the plate region) must be a geo_places region when supplied.
        fields:
          ownerKind: string
          ownerId: string
          countryId: string
          subdivisionId: optional<string>
          registrationNumber: string
          numberTypeId: optional<string>
          effectiveFrom: optional<datetime>
      AddManufacturerRequest:
        docs: Record that a company manufactures this brand (temporal).
        fields:
          companyId: string
          effectiveFrom: optional<string>
          effectiveTo: optional<string>
    errors:
      VehicleNotFound:
        namespace: Vehicle
        code: NOT_FOUND
        safe-args:
          vehicleId: string
      BrandNotFound:
        namespace: Vehicle
        code: NOT_FOUND
        safe-args:
          brandId: string
      LinkNotFound:
        docs: A registration / manufacturer link was not found.
        namespace: Vehicle
        code: NOT_FOUND
        safe-args:
          linkId: string
      Conflict:
        docs: A code/identifier already exists in scope (catalog code, duplicate active VIN, duplicate active plate per country).
        namespace: Vehicle
        code: CONFLICT
        safe-args:
          reason: string
      Invalid:
        docs: A malformed request or an unknown referenced entity (type/model/brand/country/number-type/owner).
        namespace: Vehicle
        code: INVALID_ARGUMENT
        safe-args:
          reason: string
      RegionInvalid:
        docs: The supplied plate region is not a geo_places region (placetype<>region) or does not exist.
        namespace: Vehicle
        code: INVALID_ARGUMENT
        safe-args:
          subdivisionId: string
services:
  VehicleService:
    name: Vehicle Service
    package: oikumenea.vehicle
    base-path: /vehicle/v1
    default-auth: header
    docs: |
      A vehicle registry: brand/model/type catalogs, vehicles, the brand->manufacturer link, and the
      ownership+plate registration record. Reads gate on `vehicle.read`; vehicle/registration/
      manufacturer writes on `vehicle.manage`; catalog-entry writes on `vehicle.catalog.manage`. Writes
      are audited in-process (D-Audit).
    endpoints:
      # ---- catalogs ----
      listVehicleTypes:
        http: GET /vehicle-types
        returns: VehicleTypeList
      upsertVehicleType:
        http: PUT /vehicle-types
        args:
          request: UpsertVehicleTypeRequest
        returns: VehicleType
      listBrands:
        http: GET /brands
        args:
          query:
            type: optional<string>
            param-type: query
            docs: Optional case-insensitive code/name filter.
        returns: BrandList
      upsertBrand:
        http: PUT /brands
        args:
          request: UpsertBrandRequest
        returns: Brand
      listModels:
        http: GET /brands/{brandId}/models
        args:
          brandId: { type: string, param-type: path }
        returns: ModelList
      upsertModel:
        http: PUT /brands/{brandId}/models
        args:
          brandId: { type: string, param-type: path }
          request: UpsertModelRequest
        returns: Model
      listRegistrationNumberTypes:
        http: GET /registration-number-types
        returns: RegistrationNumberTypeList
      upsertRegistrationNumberType:
        http: PUT /registration-number-types
        args:
          request: UpsertNumberTypeRequest
        returns: RegistrationNumberType
      # ---- vehicles ----
      createVehicle:
        http: POST /vehicles
        args:
          request: CreateVehicleRequest
        returns: Vehicle
      listVehicles:
        http: GET /vehicles
        docs: |
          List vehicles, token-paginated, narrowed by any combination of the facet filters below
          (M58 / D-ObjectFacets). Every filter here is also a distribution on `vehicleStats`, so a
          dashboard and a list are two renderings of one request state. Gated by `vehicle.read`.
        args:
          query:
            type: optional<string>
            param-type: query
            docs: Optional case-insensitive VIN filter.
          typeId:
            type: optional<string>
            param-type: query
            docs: Facet filter — vehicle-type RID (`vehicle_types`).
          brandId:
            type: optional<string>
            param-type: query
            docs: |
              Facet filter — brand RID. TWO-HOP: the brand hangs off the vehicle's model
              (`vehicle_models.brand_id`), so this matches vehicles whose model belongs to the brand.
          modelId:
            type: optional<string>
            param-type: query
            docs: Facet filter — model RID (`vehicle_models`). Nullable column; the no-model rows are the `(unknown)` bucket.
          color:
            type: optional<string>
            param-type: query
            docs: |
              Facet filter — colour RID (`platform_colors`, domain='vehicle' — D-Color/M42). A hard FK,
              not free text.
          status:
            type: optional<string>
            param-type: query
            docs: Facet filter — `active` | `scrapped` | `exported`.
          manufactureDateFrom:
            type: optional<string>
            param-type: query
            docs: |
              Facet filter — INCLUSIVE lower bound on `manufactureDate` (`YYYY-MM-DD`). A calendar
              DATE, not a datetime. Vehicles with no manufacture date are excluded whenever either
              bound is set; the no-date set is a distinct bucket on the stats endpoint.
          manufactureDateTo:
            type: optional<string>
            param-type: query
            docs: Facet filter — INCLUSIVE upper bound on `manufactureDate` (`YYYY-MM-DD`).
          registrationCountry:
            type: optional<string>
            param-type: query
            docs: |
              Facet filter — country RID of the vehicle's ACTIVE registration
              (`vehicle_registrations.country_id` where status='active'). An EXISTS semi-join, never a
              join: registration is ownership HISTORY, and joining it would multiply a vehicle across
              every country it has ever worn plates in. A vehicle holds at most one active
              registration, so this filter and its distribution both partition.
          pageSize:
            type: optional<integer>
            param-type: query
          pageToken:
            type: optional<string>
            param-type: query
        returns: VehiclePage
      vehicleStats:
        http: GET /stats/vehicles
        docs: |
          Facet distributions over the fleet — the dashboard half of the facet vocabulary (M58 /
          D-ObjectFacets). Takes exactly the filter args `listVehicles` takes (minus paging) plus an
          optional `facets` CSV, so a dashboard and a list are two renderings of ONE request state
          and a chart segment is a link to the same URL with one more filter applied.

          `totalCount` equals the number of rows exhaustively paging `listVehicles` with these same
          filters would return. One round-trip serves the whole dashboard.

          ONE aggregate arm, with no subject and no scoped twin — for the same reason
          `externalOrgStats` has one, and NOT the audit ledger's reason. `vehicle_vehicles` carries no
          row-level security, no unit column and no reach predicate: `vehicle.read` held anywhere is
          the whole visibility decision, so there is nothing for a second arm to narrow.

          The path is `/stats/vehicles` rather than `/vehicles/stats` because the server's router
          rejects a literal path segment that is a sibling of `{vehicleId}`.
        args:
          facets:
            type: optional<string>
            param-type: query
            docs: |
              Optional comma-separated facet keys to compute (`typeId,status,color`). Omitted or empty
              means EVERY facet; a list of nothing (`,`) means none, i.e. `totalCount` alone. Naming a
              facet this type does not declare is a 400.
          query:
            type: optional<string>
            param-type: query
            docs: Optional case-insensitive VIN filter.
          typeId:
            type: optional<string>
            param-type: query
            docs: Facet filter — vehicle-type RID.
          brandId:
            type: optional<string>
            param-type: query
            docs: Facet filter — brand RID (two-hop via the model).
          modelId:
            type: optional<string>
            param-type: query
            docs: Facet filter — model RID.
          color:
            type: optional<string>
            param-type: query
            docs: Facet filter — colour RID (`platform_colors`).
          status:
            type: optional<string>
            param-type: query
            docs: Facet filter — `active` | `scrapped` | `exported`.
          manufactureDateFrom:
            type: optional<string>
            param-type: query
            docs: Facet filter — INCLUSIVE lower bound on `manufactureDate` (`YYYY-MM-DD`).
          manufactureDateTo:
            type: optional<string>
            param-type: query
            docs: Facet filter — INCLUSIVE upper bound on `manufactureDate` (`YYYY-MM-DD`).
          registrationCountry:
            type: optional<string>
            param-type: query
            docs: Facet filter — country RID of the ACTIVE registration.
        returns: VehicleStats
      getVehicle:
        http: GET /vehicles/{vehicleId}
        args:
          vehicleId: { type: string, param-type: path }
        returns: Vehicle
      updateVehicle:
        http: PUT /vehicles/{vehicleId}
        args:
          vehicleId: { type: string, param-type: path }
          request: UpdateVehicleRequest
        returns: Vehicle
      deleteVehicle:
        http: DELETE /vehicles/{vehicleId}
        args:
          vehicleId: { type: string, param-type: path }
      # ---- registrations (ownership history) ----
      listRegistrations:
        http: GET /vehicles/{vehicleId}/registrations
        args:
          vehicleId: { type: string, param-type: path }
        returns: RegistrationList
      registerVehicle:
        http: POST /vehicles/{vehicleId}/registrations
        docs: Register (or transfer) the vehicle to a new owner; closes any active registration first.
        args:
          vehicleId: { type: string, param-type: path }
          request: RegisterVehicleRequest
        returns: Registration
      closeRegistration:
        http: POST /registrations/{registrationId}/close
        docs: End an active registration without a new owner (e.g. deregistration).
        args:
          registrationId: { type: string, param-type: path }
        returns: Registration
      # ---- brand manufacturers ----
      listManufacturers:
        http: GET /brands/{brandId}/manufacturers
        args:
          brandId: { type: string, param-type: path }
        returns: ManufacturerList
      addManufacturer:
        http: POST /brands/{brandId}/manufacturers
        args:
          brandId: { type: string, param-type: path }
          request: AddManufacturerRequest
        returns: Manufacturer
      removeManufacturer:
        http: DELETE /manufacturers/{manufacturerId}
        args:
          manufacturerId: { type: string, param-type: path }
      # ---- person view ----
      listPersonVehicles:
        http: GET /persons/{personId}/vehicles
        docs: Read-only view of the vehicle registrations a person owns (current + historical).
        args:
          personId: { type: string, param-type: path }
        returns: PersonVehicles
