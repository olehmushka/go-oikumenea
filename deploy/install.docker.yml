# Install config for the docker-compose stack. Mounted over /app/var/conf/install.yml in the app
# container. The DSN points at the compose `postgres` service and connects as the NON-superuser
# `oikumenea` app role so the RLS backstop is in force (D-RLSDefenseInDepth). INSECURE local defaults —
# replace every secret (DSN password, hmac-key, crypto keys, bootstrap admin) for a real deployment,
# and supply them ECV-encrypted.
product-name: oikumenea
product-version: 0.0.0-dev
use-console-log: true
server:
  address: "0.0.0.0"
  port: 8443
  management-port: 8444
  context-path: ""

# local-dev environment: this reference stack ships an insecure HS256 (symmetric) issuer below, which
# the app fail-closes on outside local/dev (F-009). Use a real OIDC issuer + `staging`/`production` for
# any real deployment.
environment: local

postgres:
  dsn: "postgres://oikumenea:oikumenea@postgres:5432/postgres?sslmode=disable"

idp:
  clock-skew-seconds: 60
  jit:
    enabled: false
    claim: person_code
  issuers:
    - issuer: "https://local-dev.oikumenea.test"
      type: hs256
      label: "Local dev (HS256)"
      audience: oikumenea
      hmac-key: "local-dev-insecure-signing-key-change-me"
    # Real issuers go here — one entry per IdP whose tokens this deployment accepts. Every `oidc`
    # entry MUST pin an audience (the server refuses to boot otherwise): a public IdP's `iss` is
    # shared by every application registered with it, so the `aud` is what binds a token to THIS
    # deployment. See deploy/oauth/README.md for per-provider recipes (Google, GitHub via broker,
    # Entra, GitLab, Okta) and D-MultiIdPExamples for the rationale.
    # - issuer: "https://accounts.google.com"
    #   type: oidc
    #   label: "Google"
    #   audience: "<console-oauth-client-id>.apps.googleusercontent.com"

account:
  identity-linking-enabled: true

crypto:
  provider: local-dev
  blind-index-key: "bG9jYWwtZGV2LWluc2VjdXJlLWJsaW5kLWlkeC1rZXk="
  dek-cache-ttl-seconds: 300
  local-dev:
    kek: "bG9jYWwtZGV2LWluc2VjdXJlLWtlay1jaGFuZ2UtbWU="

bootstrap-admin:
  issuer: "https://local-dev.oikumenea.test"
  subject: "local-admin"
  display-name: "Local Admin"
  person-code: "admin"

# Import-control proxy to the hermenea companion (D-Hermenea): oikumenea forwards UI-triggered
# /hermenea/v1/* calls to base-url, gated on import.manage. In compose, hermenea is reachable at the
# service hostname `hermenea`; insecure-skip-verify accepts its self-signed cert. The directional shared
# secrets can be set here (outbound-token/inbound-token, ECV-encryptable, review R-16) or via the compose
# env overrides OIKUMENEA_HERMENEA_TOKEN / HERMENEA_OIKUMENEA_TOKEN (see docker-compose.yml).
hermenea:
  base-url: "https://hermenea:9443"
  insecure-skip-verify: true
