# pinax preset — rank systems (curated, hand-authored). D-Pinax (M45), objectType `ranks`
# (native importer over rank.Service.ImportPreset). Grade codes align to NATO STANAG 2116 (the
# rank_grades comparability scale); ranks sharing a NATO grade carry the same gradeCode.
#
# Branches modeled per system = the service branches whose rank NAMES differ. Ukraine's Air Force /
# Air Assault / Special Ops reuse the Ground Forces ladder, so only Navy is separate. US: all six
# services differ (Army/Marines/Air Force/Space Force use the same OFFICER titles; Navy/Coast Guard
# use naval officer titles).
preset: ranks
objectType: ranks
source: curated
sourceVersion: '3'
license: CC0-1.0
dependsOn: []   # country resolved against the migration-seeded geo_countries skeleton
