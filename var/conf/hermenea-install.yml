# Local-dev install configuration for the hermenea companion service (M16 / D-Hermenea).
# Plaintext for local dev; ECV-encrypted in real deployments. The two shared secrets are RUNTIME env
# vars (OIKUMENEA_HERMENEA_TOKEN, HERMENEA_OIKUMENEA_TOKEN) — NOT in this file.
product-name: hermenea
product-version: 0.0.0-dev
use-console-log: true
server:
  address: "0.0.0.0"
  port: 9443
  management-port: 9444
  context-path: ""

# Hermenea's OWN PostgreSQL (separate database from oikumenea's). Apply migrations/hermenea first:
#   set -a; . ./.env; set +a; atlas migrate apply --env hermenea
postgres:
  dsn: "postgres://postgres:dev@localhost:5432/hermenea?sslmode=disable"

# oikumenea's public API the loader calls (POST /import/{objectType}). insecure-skip-verify accepts the
# self-signed local-dev cert; set false against a real certificate.
oikumenea:
  base-url: "https://localhost:8443"
  insecure-skip-verify: true
  # R-05 chunked runs: records per import envelope/transaction (default 5000) and the loader's
  # per-request deadline (default 120000 ms — finite; a request carries at most one chunk).
  # chunk-size: 5000
  # Raised from the 120000 default: high-res WOF region/country geometries (e.g. US states) are heavy
  # to parse (ST_GeomFromGeoJSON) + derive (ST_PointOnSurface/ST_Envelope) per chunk. Kept well under
  # worker.job-timeout-ms (1800000) so a single chunk that overruns still fails within the job budget.
  http-timeout-ms: 600000

# Declarative import sources seeded at boot (idempotent). The first real connector is the Who's-On-First
# geo gazetteer (D-GeoPlaces): connector-type `wof-sqlite` stages the per-country `.db.bz2` admin
# distribution and the `geo-places` paged mapper loads country/region/county/locality.
#
# GLOBAL rollout = one source per ISO country (code `wof-geo-<iso>`, locator `…-admin-<iso>-latest…`).
# Enabled below: Ukraine + Russia + the European countries + US/CA/MX/BR/CO/AR. They all share one cron
# interval, so on the first scheduler tick after boot every enabled source becomes due at once; the
# SINGLE worker then runs them one at a time (sequentially) — a large multi-country backfill takes hours.
# Trigger a single country on demand with `POST /hermenea/v1/sync/wof-geo-<iso>`. To pause one, set its
# `enabled: false`. WOF downloads + geometry imports are large, hence the raised worker.job-timeout-ms
# below; very large countries (US, RU) may still need more.
sources:
  # The simplest proving consumer (network-free): the bundled ISO-3166 country list, read by the
  # degenerate `file` connector and loaded via the in-memory geo-countries mapper into
  # oikumenea.geo_countries (POST /import/geo-countries). Re-running is an idempotent no-op. Path is
  # relative to the process working dir (repo root on host; /app in the Docker image).
  - code: geo-countries-iso3166
    name: "ISO-3166 countries (bundled)"
    connector-type: file
    object-type: geo-countries
    locator: "deploy/geo-presets/iso-3166.json"
    cron: "@weekly"
    enabled: true
  # Languages (D-Languages, M18) — hermenea's first NEW consumers beyond geo. These pull LIVE from
  # upstream master on every run via the `http-files` streaming connector: the raw files are staged to a
  # temp dir and transformed in Go (the CLDFMapper / SupplementalMapper port of gen-presets.py), so the
  # catalog refreshes without regenerating bundled presets. The `locator` is a whitespace-separated URL
  # list; the mapper reads each file by basename. source_version is a checksum of the fetched files, so an
  # unchanged upstream is an idempotent no-op. language-scheme MUST load before language-scripts (scripts
  # resolve languoids by ISO 639-3); both share the cron window and the single worker runs them
  # sequentially. Tracking master means a run depends on upstream being reachable + format-stable; a
  # failed/garbled run is logged in import_runs, retried, then dead-lettered — imports are transactional,
  # so they never corrupt the existing catalog.
  #
  # OFFLINE / air-gap alternative: swap connector-type back to `file` and point locator at the bundled
  # preset (regenerate with deploy/language-presets/gen-presets.py), e.g.:
  #   connector-type: file
  #   locator: "deploy/language-presets/glottolog-5.3.json"   # (and cldr-scripts.json)
  - code: glottolog-languoids
    name: "Glottolog languoids (live CLDF master)"
    connector-type: http-files
    object-type: language-scheme
    locator: >-
      https://raw.githubusercontent.com/glottolog/glottolog-cldf/master/cldf/languages.csv
      https://raw.githubusercontent.com/glottolog/glottolog-cldf/master/cldf/values.csv
    cron: "@weekly"
    enabled: true
  - code: cldr-language-scripts
    name: "CLDR language→script links (live)"
    connector-type: http-files
    object-type: language-scripts
    locator: >-
      https://raw.githubusercontent.com/unicode-org/cldr/main/common/supplemental/supplementalData.xml
      https://iso639-3.sil.org/sites/iso639-3/files/downloads/iso-639-3.tab
    cron: "@weekly"
    enabled: true
  # Ethnicity catalog (D-PhysicalIdentity amendment, M43) — OPT-IN, default DISABLED. Ethnicity is
  # contentious, so no catalog loads unless an operator enables this on purpose. Fed LIVE from the CIA World
  # Factbook (PUBLIC DOMAIN) at import time — NO committed preset: the `factbook` StreamingConnector
  # enumerates the ~260 country files in the `factbook/factbook.json` GitHub mirror (one git-tree API call)
  # and stages them; the ethnicity PagedMapper parses each country's "Ethnic groups" free-text, derives the
  # country's ISO code from its Internet ccTLD, and dedups group→countries across all files. A FLAT,
  # country-linked catalog (the Factbook has no hierarchy / no language ties). The locator is `owner/repo@ref`.
  # The catalog is plaintext reference data; a person's declared ethnicity stays encrypted, and the group's
  # country links are group-level metadata, never inferred onto a person.
  - code: factbook-ethnicities
    name: "CIA World Factbook ethnic groups (live, opt-in)"
    connector-type: factbook
    object-type: ethnicity-scheme
    locator: "factbook/factbook.json@master"
    cron: "@weekly"
    enabled: false
  - code: wof-geo-ua
